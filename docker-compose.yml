name: aviation-radar

services:
  redis:
    image: redis:alpine
    container_name: aviation-radar-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"]
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: aviation-radar-app
    build:
      context: ./radar-app
      dockerfile: Dockerfile
    container_name: aviation-radar-app
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=8081
    depends_on:
      - redis
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8081"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  swim-ingestor:
    image: aviation-radar-app
    build:
      context: ./radar-app
      dockerfile: Dockerfile
    container_name: aviation-radar-swim-ingestor
    command: python -u -m Classes.Ingestors.faa.runFAASwim
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - swim
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
