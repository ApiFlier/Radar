services:
  redis:
    image: redis:alpine
    container_name: flight-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  swim-ingestor:
    build: ./api
    container_name: swim-ingestor
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - FAA_USER=
      - FAA_PASS=
      - QUEUE_SFDPS=
      - QUEUE_STDDS=
      - QUEUE_TFMS=
    command: ["python", "-u", "-m", "Classes.Ingestors.faa.runFAASwim"]
    restart: unless-stopped

  api:
    build: ./api
    container_name: flight-api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - API_DEBUG=true
      - ENABLE_INGESTORS=true
      - OPENSKY_CLIENT_ID=
      - OPENSKY_CLIENT_SECRET=
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: lib/Dockerfile
    container_name: flight-web
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=8081
    ports:
      - "${WEB_PORT}:8080"
    restart: unless-stopped

volumes:
  redis-data:
