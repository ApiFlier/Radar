name: radar

services:
  adsblol-ground:
    container_name: radar-adsblol-ground
    image: radar-backend
    build: ./api
    command: python -u -m Classes.AdsbLolGroundSweep
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADSBLOL_REAPI_BASE=https://re-api.adsb.lol
      - GROUND_SWEEP_CLUSTER_INTERVAL_SECONDS=300
      - GROUND_SWEEP_REQUEST_SPACING_SECONDS=5
      - GROUND_SWEEP_TTL_SECONDS=900
      - GROUND_SWEEP_MAX_SEEN_POS_SECONDS=120
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    container_name: radar-redis
    image: redis:alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  swim-ingestor:
    container_name: radar-swim-ingestor
    image: radar-backend
    build: ./api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - FAA_USER=
      - FAA_PASS=
      - QUEUE_SFDPS=
      - QUEUE_STDDS=
      - QUEUE_TFMS=
    command: ["python", "-u", "-m", "Classes.Ingestors.faa.runFAASwim"]
    restart: unless-stopped

  adsblol-reapi:
    container_name: radar-adsblol-reapi
    image: radar-backend
    build: ./api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADSBLOL_REAPI_URL=${ADSBLOL_REAPI_URL:-https://re-api.adsb.lol/}
      - ADSBLOL_REAPI_CIRCLES=${ADSBLOL_REAPI_CIRCLES:-40.491389,-80.232778,250}
      - ADSBLOL_REAPI_INTERVAL_SECONDS=${ADSBLOL_REAPI_INTERVAL_SECONDS:-10}
      - ADSBLOL_REAPI_TTL_SECONDS=${ADSBLOL_REAPI_TTL_SECONDS:-45}
      - ADSBLOL_REAPI_REQUEST_SPACING_SECONDS=${ADSBLOL_REAPI_REQUEST_SPACING_SECONDS:-1.2}
      - ADSBLOL_HEALTH_MAX_AGE_SECONDS=${ADSBLOL_HEALTH_MAX_AGE_SECONDS:-45}
    command: ["python", "-u", "-m", "Classes.Ingestors.adsblol.runAdsbLolReApi"]
    restart: always

  api:
    container_name: radar-api
    image: radar-backend
    build: ./api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - API_DEBUG=true
      - ENABLE_INGESTORS=true
      - OPENSKY_CLIENT_ID=
      - OPENSKY_CLIENT_SECRET=
    restart: unless-stopped

  web:
    container_name: radar-web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    build:
      context: .
      dockerfile: lib/Dockerfile
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=8081
    restart: unless-stopped

volumes:
  redis-data:
