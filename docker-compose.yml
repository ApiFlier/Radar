services:
  redis:
    image: redis:alpine
    container_name: flight-redis
    ports:
      - "6379:6379"
    restart: always

  swim-ingestor:
    build: ./ingestors/swim
    container_name: swim-ingestor
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    env_file:
      - .env
    restart: always

  core:
    build: ./core
    container_name: flight-core
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    restart: always

  web:
    build: ./web
    container_name: flight-web
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    ports:
      - "8080:8080"
    restart: always
