services:
  redis:
    image: redis:alpine
    container_name: flight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  swim-ingestor:
    build: ./api
    container_name: swim-ingestor
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - FAA_USER=${FAA_USER}
      - FAA_PASS=${FAA_PASS}
      - QUEUE_SFDPS=${QUEUE_SFDPS}
      - QUEUE_STDDS=${QUEUE_STDDS}
      - QUEUE_TFMS=${QUEUE_TFMS}
    command: ["python", "-u", "-m", "Classes.Ingestors.faa.runFAASwim"]
    restart: always

  api:
    build: ./api
    container_name: flight-api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - API_DEBUG=true
      - ENABLE_INGESTORS=true
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET}
    ports:
      - "8081:8081"
    restart: always

  web:
    build:
      context: .
      dockerfile: lib/Dockerfile
    container_name: flight-web
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=8081
    ports:
      - "8080:8080"
    restart: always

volumes:
  redis-data: