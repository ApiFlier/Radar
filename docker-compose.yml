name: radar

services:
  redis:
    image: redis:alpine
    container_name: radar-redis
    restart: unless-stopped

  api:
    image: ${RADAR_BACKEND_IMAGE:-ghcr.io/apiflier/radar-backend:latest}
    container_name: radar-api
    command: uvicorn main:app --host 0.0.0.0 --port 8081
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  swim-ingestor:
    image: ${RADAR_BACKEND_IMAGE:-ghcr.io/apiflier/radar-backend:latest}
    container_name: radar-swim-ingestor
    command: python -u -m Classes.SwimIngestor
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  adsblol-reapi:
    image: ${RADAR_BACKEND_IMAGE:-ghcr.io/apiflier/radar-backend:latest}
    container_name: radar-adsblol-reapi
    command: python -u -m Classes.AdsbLolReApi
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  adsblol-ground:
    image: ${RADAR_BACKEND_IMAGE:-ghcr.io/apiflier/radar-backend:latest}
    container_name: radar-adsblol-ground
    command: python -u -m Classes.AdsbLolGroundSweep
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  web:
    image: ${RADAR_WEB_IMAGE:-ghcr.io/apiflier/radar-web:latest}
    container_name: radar-web
    command: python -u app.py
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8081
    depends_on:
      - api
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
