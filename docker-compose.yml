services:
  redis:
    image: redis:alpine
    container_name: flight-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  swim-ingestor:
    image: radar-backend
    build: ./api
    container_name: swim-ingestor
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - FAA_USER=
      - FAA_PASS=
      - QUEUE_SFDPS=
      - QUEUE_STDDS=
      - QUEUE_TFMS=
    command: ["python", "-u", "-m", "Classes.Ingestors.faa.runFAASwim"]
    restart: unless-stopped

  adsblol-reapi:
    image: radar-backend
    build: ./api
    container_name: adsblol-reapi
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADSBLOL_REAPI_URL=${ADSBLOL_REAPI_URL:-https://re-api.adsb.lol/}
      - ADSBLOL_REAPI_CIRCLES=${ADSBLOL_REAPI_CIRCLES:-40.491389,-80.232778,250}
      - ADSBLOL_REAPI_INTERVAL_SECONDS=${ADSBLOL_REAPI_INTERVAL_SECONDS:-10}
      - ADSBLOL_REAPI_TTL_SECONDS=${ADSBLOL_REAPI_TTL_SECONDS:-45}
      - ADSBLOL_REAPI_REQUEST_SPACING_SECONDS=${ADSBLOL_REAPI_REQUEST_SPACING_SECONDS:-1.2}
      - ADSBLOL_HEALTH_MAX_AGE_SECONDS=${ADSBLOL_HEALTH_MAX_AGE_SECONDS:-45}
    command: ["python", "-u", "-m", "Classes.Ingestors.adsblol.runAdsbLolReApi"]
    restart: always

  api:
    image: radar-backend
    build: ./api
    container_name: flight-api
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - API_DEBUG=true
      - ENABLE_INGESTORS=true
      - OPENSKY_CLIENT_ID=
      - OPENSKY_CLIENT_SECRET=
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: lib/Dockerfile
    container_name: flight-web
    depends_on:
      - api
    environment:
      - API_HOST=api
      - API_PORT=8081
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  redis-data:
