                    pd.arr = p.arr || pd.arr;
                    pd.depTime = p.depTime || p.dep_time || pd.depTime;
                    pd.eta = p.eta || pd.eta;
                    pd.faaTs = p.faaTs || p.faa_ts || pd.faaTs;
                    pd.flightStatus = p.flightStatus || p.flight_status || pd.flightStatus;
                    pd.operator = p.operator || pd.operator;
                    pd.icaoHex = p.icaoHex || p.icao_hex || pd.icaoHex;
                    pd.source = p.source || pd.source;
                    pd.airborne = p.airborne !== undefined ? p.airborne : pd.airborne;
                    pd.onGround = (p.onGround || p.on_ground) !== undefined ? (p.onGround || p.on_ground) : pd.onGround;
                    updateAircraftTags(pd, p);
                    pd.displayState = aircraftDisplayState(pd);
                }
            }

            if (planeMarkers[id]) {
                if (!shouldDisplayPlane(planeData[id]) && id !== followFlightId && id !== activeFlightId) {
                    removeMarker(id);
                    return;
                }

                var color = altColor(planeData[id].alt, planeData[id].speed);
                var opacity = staleOpacity(planeData[id]);

                planeMarkers[id].setLatLng([lat, lon]);
                planeMarkers[id].setIcon(makePlaneIcon(id, heading, color, opacity));
                planeMarkers[id]._lastColor = color;
                planeMarkers[id].getPopup().setContent(popupContent(planeData[id]));

                if (followFlightId === id) {
                    map.panTo([lat, lon], {animate: true, duration: 1});
                }
            } else if (shouldDisplayPlane(planeData[id])) {
                addMarker(id);
            }

            if (panelMode === 'aircraft' && selectedAcId === id) {
                renderAircraftPanel();
            }
        }

        function syncVisiblePlanes() {
            updateBounds();
            for (var id in planeData) {
                var p = planeData[id];
                if (shouldDisplayPlane(p)) {
                    if (!planeMarkers[id]) addMarker(id);
                } else if (id !== followFlightId && id !== activeFlightId) {
                    removeMarker(id);
                }
            }
            updateHUD();
        }

        function cleanStalePlanes() {
            var now = Date.now() / 1000;
            for (var id in planeData) {
                var age = now - (parseFloat(planeData[id].lastUpdate) || 0);
                var maxAge = isGroundSweepPlane(planeData[id]) ? getVisibleGroundMaxAge() : REMOVE_STALE_AGE;
                if (age > maxAge) {
                    if (followFlightId === id) stopFollow();
                    removeMarker(id);
                    delete planeData[id];
                } else if (planeMarkers[id]) {
                    planeMarkers[id].setPopupContent(popupContent(planeData[id]));
                    planeMarkers[id].setIcon(makePlaneIcon(
                        id,
                        parseFloat(planeData[id].heading || 0),
                        altColor(planeData[id].alt, planeData[id].speed),
                        staleOpacity(planeData[id])
                    ));
                }
            }
            updateHUD();
        }


        var airportData = [];
        var airportLookup = {};
        var airportMarkers = {};
        var airportLayer = L.layerGroup().addTo(map);

        function airportMinZoom(a) {
            if (a.type === 'large_airport') return 5;
            if (a.type === 'medium_airport') return 7;
            if (a.scheduled_service === 'yes') return 8;
            if (a.type === 'small_airport') return 11;
            return 13;
        }

        function airportColor(a) {
            if (a.type === 'large_airport') return '#ffcc00';
            if (a.type === 'medium_airport') return '#ffaa00';
            if (a.scheduled_service === 'yes') return '#00ffcc';
            return '#ffffff';
        }

        function airportPopup(a) {
            if (!a) return '<div class="apt-popup"><div class="apt-body">No airport data</div></div>';

            function clean(v) {
                return String(v || '').trim();
            }

            function codeValue(v) {
                return clean(v).toUpperCase();
            }

            function prettyType(t) {
                t = clean(t).replace(/_/g, ' ');
                return t ? t.replace(/\b\w/g, function(c) { return c.toUpperCase(); }) : 'Airport';
            }

            function row(label, value) {
                if (!value) return '';
                return '<div class="apt-row"><span>' + htmlEscape(label) + '</span><span>' + htmlEscape(value) + '</span></div>';
            }

            function cell(label, value, cls) {
                return '<div class="apt-cell"><div class="apt-label">' + htmlEscape(label) + '</div><div class="apt-value ' + (cls || '') + '">' + htmlEscape(value || '—') + '</div></div>';
            }

            var ident = codeValue(a.ident || a.icao || a.gps_code);
            var iata = codeValue(a.iata_code || a.iata);
            var icao = codeValue(a.gps_code || a.icao || a.ident);
            var local = codeValue(a.local_code);
            var gps = codeValue(a.gps_code);
            var primaryCode = iata || icao || ident || local || gps || 'APT';

            var name = clean(a.name) || 'Airport';
            var municipality = clean(a.municipality || a.city);
            var region = clean(a.region || a.iso_region);
            var country = clean(a.iso_country || a.country);
            var elevationRaw = clean(a.elevation_ft || a.elevation);
            var elevation = elevationRaw ? Number(elevationRaw).toLocaleString() + ' ft' : '';
            var type = prettyType(a.type);
            var website = clean(a.home_link || a.website || a.url);
            var wiki = clean(a.wikipedia_link);

            var html = '<div class="apt-popup">';

            html += '<div class="apt-head">';
            html += '<div class="apt-code">' + htmlEscape(primaryCode) + '</div>';
            html += '<div class="apt-name">' + htmlEscape(name) + '</div>';
            html += '<div class="apt-region">' + htmlEscape([municipality, region || country].filter(Boolean).join(' · ')) + '</div>';
            html += '</div>';

            html += '<div class="apt-grid">';
            html += cell('IATA', iata || '—', iata ? 'accent' : '');
            html += cell('ICAO', icao || ident || '—', icao || ident ? 'accent' : '');
            html += cell('Elevation', elevation || '—', '');
            html += '</div>';

            html += '<div class="apt-body">';
            html += row('Type', type);
            html += row('Local', local);
            html += row('GPS', gps);
            html += row('Region', region);
            html += '</div>';

            var freqs = Array.isArray(a.frequencies) ? a.frequencies : [];
            if (freqs.length) {
                html += '<div class="apt-body">';
                html += '<div class="apt-section-title">Frequencies</div>';

                freqs.slice(0, 8).forEach(function(f) {
                    var fType = clean(f.type || f.frequency_type || f.name).toUpperCase();
                    var mhz = clean(f.frequency_mhz || f.mhz || f.freq || f.frequency);
                    var desc = clean(f.description || f.desc || f.use || f.name);

                    html += '<div class="apt-frequency">';
                    html += '<span class="type">' + htmlEscape(fType || '—') + '</span>';
                    html += '<span class="mhz">' + htmlEscape(mhz ? mhz + ' MHz' : '—') + '</span>';
                    html += '<span class="desc">' + htmlEscape(desc || '') + '</span>';
                    html += '</div>';
                });

                if (freqs.length > 8) {
                    html += '<div class="apt-row"><span>More</span><span>' + htmlEscape(String(freqs.length - 8)) + ' additional frequencies hidden</span></div>';
                }

                html += '</div>';
            }

            html += '<div class="apt-actions">';
            html += '<a class="apt-action primary" href="/?airport=' + encodeURIComponent(icao || ident || primaryCode) + '">Center Map</a>';
            html += '<a class="apt-action" href="/airports">Airport Dashboard</a>';
            if (website) html += '<a class="apt-action" href="' + htmlEscape(website) + '" target="_blank" rel="noopener">Website</a>';
            if (wiki) html += '<a class="apt-action" href="' + htmlEscape(wiki) + '" target="_blank" rel="noopener">Wikipedia</a>';
            html += '</div>';

            html += '<div class="apt-note">Airport and frequency data is for display only. Verify against official FAA sources before operational use.</div>';

            html += '</div>';
            return html;
        }

        function shouldShowAirport(a) {
            if (!a || isNaN(a.lat) || isNaN(a.lon)) return false;
            if (map.getZoom() < airportMinZoom(a)) return false;
            return map.getBounds().pad(0.2).contains([a.lat, a.lon]);
        }

        function addAirportMarker(a) {
            var id = a.ident || a.code;
            if (!id || airportMarkers[id]) return;

            var marker = L.circleMarker([a.lat, a.lon], {
                radius: a.type === 'large_airport' ? 6 : 4,
                color: airportColor(a),
                weight: 2,
                fillColor: airportColor(a),
                fillOpacity: 0.65,
                opacity: 0.95
            }).bindPopup(airportPopup(a))
              .on('click', (function(apt) {
                var aptCode = String(apt.ident || apt.gps_code || apt.icao || apt.code || '').toUpperCase();
                return function() { openAirportPanel(aptCode, apt); };
              })(a));

            marker.addTo(airportLayer);
            airportMarkers[id] = marker;
        }

        function removeAirportMarker(id) {
            if (airportMarkers[id]) {
                airportLayer.removeLayer(airportMarkers[id]);
                delete airportMarkers[id];
            }
        }

        function syncAirportMarkers() {
            if (!airportData.length) return;

            var visible = {};
            airportData.forEach(function(a) {
                var id = a.ident || a.code;
                if (!id) return;

                if (shouldShowAirport(a)) {
                    visible[id] = true;
                    addAirportMarker(a);
                }
            });

            for (var id in airportMarkers) {
                if (!visible[id]) removeAirportMarker(id);
            }
        }

        fetch('/static/airports.json')
            .then(function(res) { return res.json(); })
            .then(function(json) {
                airportData = json.airports || [];
                buildAirportLookup();
                syncAirportMarkers();

                // Ground aircraft visibility depends on airportData.
                // Re-run aircraft visibility after airports load.
                syncVisiblePlanes();
            })
            .catch(function(err) {
                console.log('Airport layer failed to load', err);
            });


        map.on('moveend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
        });
        map.on('zoomend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
            updateLabelVisibility();
        });

        function updateLabelVisibility() {
            var mapEl = document.getElementById('map');
            if (map.getZoom() >= 9) {
                mapEl.classList.remove('labels-hidden');
            } else {
                mapEl.classList.add('labels-hidden');
            }
        }
        updateLabelVisibility();

        // Initial load — uses the hardened doFullRefresh (defined below)
        doFullRefresh();

        // SSE stream
        var source = new EventSource('/api/stream');
        source.onmessage = function(event) {
            processPlane(JSON.parse(event.data));
        };
        source.onerror = function() {
            console.log('SSE connection error, will retry...');
        };

        // Periodic full re-fetch — fallback in case SSE is throttled by browser
        setInterval(doFullRefresh, FULL_REFRESH_INTERVAL_MS);

        // Re-fetch immediately when user returns to a background tab
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                doFullRefresh();
            }
        });

        setInterval(function() {
            var now = Date.now() / 1000;
            for (var id in planeMarkers) {
                var pd = planeData[id];
                if (!pd) continue;

                var age = now - (parseFloat(pd.lastUpdate) || 0);
                if (shouldDrawTrail(pd) && pd.speed > 10 && age < DEAD_RECKON_MAX_AGE) {
                    var dist = pd.speed * KNOTS_TO_DEG_SEC * 0.033;
                    var rad = pd.heading * Math.PI / 180;
                    pd.lat += dist * Math.cos(rad);
                    pd.lon += dist * Math.sin(rad) / Math.cos(pd.lat * Math.PI / 180);
                    planeMarkers[id].setLatLng([pd.lat, pd.lon]);
                }

                if (followFlightId === id) {
                    map.panTo([pd.lat, pd.lon], {animate: false});
                }
            }
        }, 33);

        setInterval(function() {
            if (activeFlightId && planeData[activeFlightId]) {
                if (shouldDrawTrail(planeData[activeFlightId])) {
                    showTrail(activeFlightId);
                }
            }
        }, 15000);

        setInterval(cleanStalePlanes, 15000);

        var searchSuggestions = [];
        var activeSearchIndex = -1;
        var searchDebounce = null;

        document.getElementById('search-btn').addEventListener('click', function() {
            runSearch(true);
        });

        document.getElementById('search-input').addEventListener('input', function() {
            clearTimeout(searchDebounce);
            var q = this.value.trim();
            if (!q) {
                hideSearchResults();
                return;
            }
            searchDebounce = setTimeout(function() { runSearch(false); }, 180);
        });

        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (searchSuggestions.length) selectSuggestion(Math.max(activeSearchIndex, 0));
                else runSearch(true);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveSearchSelection(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveSearchSelection(-1);
            } else if (e.key === 'Escape') {
                hideSearchResults();
            }
        });

        function hideSearchResults() {
            document.getElementById('search-results').style.display = 'none';
            searchSuggestions = [];
            activeSearchIndex = -1;
        }

        function buildLocalAirportSuggestions(q) {
            var out = [];
            var uq = q.toUpperCase();
            var lq = q.toLowerCase();
            var seen = {};

            if (!airportData || !airportData.length) return out;

            for (var i = 0; i < airportData.length; i++) {
                var a = airportData[i];
                var codes = [a.ident, a.icao, a.gps_code, a.iata_code, a.local_code]
                    .filter(Boolean)
                    .map(function(x) { return String(x).toUpperCase(); });

                var name = String(a.name || '');
                var nameMatch = name.toLowerCase().indexOf(lq) >= 0;
                var codeMatch = codes.some(function(c) { return c === uq || c.indexOf(uq) === 0; });

                if (!nameMatch && !codeMatch) continue;

                var code = codes.find(function(c) { return c === uq; }) || codes[0];
                if (!code || seen[code]) continue;
                seen[code] = true;

                out.push({
                    kind: 'airport',
                    code: code,
                    title: code,
                    subtitle: code + (name ? ' — ' + name : '') + (a.region ? ' · ' + a.region : ''),
                    priority: code === uq ? 0 : 20
                });

                if (out.length >= 8) break;
            }

            return out.sort(function(a, b) {
                return a.priority - b.priority || a.title.localeCompare(b.title);
            });
        }

        function buildLocalAircraftSuggestions(q) {
            var out = [];
            var lq = q.toLowerCase();

            for (var id in planeData) {
                var p = planeData[id];
                if (!p) continue;

                var fields = [
                    p.callsign, p.registration, p.icaoHex, p.flightId, p.operator,
                    p.dep, p.arr, formatRoute(p)
                ].filter(Boolean).join(' ').toLowerCase();

                if (fields.indexOf(lq) < 0) continue;

                out.push({
                    kind: 'aircraft',
                    id: id,
                    title: displayName(p),
                    subtitle: formatRoute(p),
                    priority: 50
                });

                if (out.length >= 12) break;
            }

            return out;
        }

        function renderSearchSuggestions(suggestions) {
            searchSuggestions = suggestions.slice(0, 20);
            activeSearchIndex = searchSuggestions.length ? 0 : -1;

            var container = document.getElementById('search-results');
            if (!searchSuggestions.length) {
                container.innerHTML = '<div class="search-result">No results found</div>';
                container.style.display = 'block';
                return;
            }

            var html = '';
            var lastKind = '';

            searchSuggestions.forEach(function(r, idx) {
                if (r.kind !== lastKind) {
                    lastKind = r.kind;
                    html += '<div class="search-section-label">' + (r.kind === 'airport' ? 'Airports' : 'Aircraft') + '</div>';
                }

                html += '<div class="search-result ' + (idx === activeSearchIndex ? 'active' : '') + '" onclick="selectSuggestion(' + idx + ')">' +
                    '<span class="sr-call">' + htmlEscape(r.title || '') + '</span>' +
                    '<span class="sr-kind">' + htmlEscape(r.kind || '') + '</span>' +
                    '<div class="sr-route">' + htmlEscape(r.subtitle || '') + '</div>' +
                    '</div>';
            });

            container.innerHTML = html;
            container.style.display = 'block';
        }

        function moveSearchSelection(delta) {
            if (!searchSuggestions.length) return;
            activeSearchIndex += delta;
            if (activeSearchIndex < 0) activeSearchIndex = searchSuggestions.length - 1;
            if (activeSearchIndex >= searchSuggestions.length) activeSearchIndex = 0;
            renderSearchSuggestions(searchSuggestions);
        }

        function runSearch(forceApi) {
            var q = document.getElementById('search-input').value.trim();
            if (!q) return;

            var local = buildLocalAirportSuggestions(q).concat(buildLocalAircraftSuggestions(q));
            renderSearchSuggestions(local);

            if (!forceApi && local.length >= 6) return;

            fetch('/api/?action=Search&q=' + encodeURIComponent(q))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    var results = json.response && json.response.data ? json.response.data.results || [] : [];
                    var extra = [];

                    results.slice(0, 10).forEach(function(r) {
                        var fid = r.flightId || '';
                        if (!fid) return;

                        extra.push({
                            kind: 'aircraft',
                            id: fid,
                            title: r.callsign || r.flightId,
                            subtitle: formatRoute(r),
                            priority: 70
                        });
                    });

                    var merged = local.slice();
                    var seen = {};
                    merged.forEach(function(x) {
                        seen[(x.kind || '') + ':' + (x.code || x.id || x.title)] = true;
                    });
                    extra.forEach(function(x) {
                        var key = (x.kind || '') + ':' + (x.code || x.id || x.title);
                        if (!seen[key]) merged.push(x);
                    });

                    renderSearchSuggestions(merged);
                })
                .catch(function() {
                    // Local results are already shown.
                });
        }

        function doSearch() {
            runSearch(true);
        }

        function selectSuggestion(index) {
            var r = searchSuggestions[index];
            if (!r) return;

            hideSearchResults();
            document.getElementById('search-input').value = '';

            if (r.kind === 'airport') {
                applyAirportDeepLink(r.code);
                openAirportPanel(r.code);
                return;
            }

            if (r.kind === 'aircraft') {
                selectSearchResult(r.id);
            }
        }

        function selectSearchResult(flightId) {
            hideSearchResults();
            document.getElementById('search-input').value = '';

            if (planeData[flightId]) {
                var p = planeData[flightId];
                map.setView([p.lat, p.lon], 12);
                if (!planeMarkers[flightId]) addMarker(flightId);
                if (planeMarkers[flightId]) planeMarkers[flightId].openPopup();
            }

            startFollow(flightId);
            openAircraftPanel(flightId);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#search-box') && !e.target.closest('#search-results')) {
                document.getElementById('search-results').style.display = 'none';
            }
        });

        /* ── Hardened full refresh ── */
        function doFullRefresh() {
            if (refreshInFlight) return;
            refreshInFlight = true;
            var seq = ++refreshSeqId;

            var controller = new AbortController();
            var abortTimer = setTimeout(function() { controller.abort(); }, FETCH_TIMEOUT_MS);

            fetch('/api/?action=Planes&_=' + Date.now(), { signal: controller.signal })
                .then(function(res) {
                    clearTimeout(abortTimer);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(json) {
                    // Discard if a newer request already finished
                    if (seq !== refreshSeqId) { refreshInFlight = false; return; }
                    refreshInFlight = false;

                    var planes = (json.response && json.response.data && json.response.data.planes) || [];

                    // Suspicious empty: API returned 0 aircraft but we had a healthy count before.
                    // Keep existing markers until this happens repeatedly (edge case: real outage).
                    if (planes.length === 0 && lastGoodAircraftCount > 50) {
                        consecutiveEmptyResponses++;
                        console.warn('[Radar] Empty response ' + consecutiveEmptyResponses + '/' +
                            SUSPICIOUS_EMPTY_THRESHOLD + ' — keeping ' + lastGoodAircraftCount + ' aircraft');
                        if (consecutiveEmptyResponses < SUSPICIOUS_EMPTY_THRESHOLD) {
                            showStatusHUD('Empty aircraft response — keeping last known data');
                            return;
                        }
                        console.warn('[Radar] Accepting empty response after ' +
                            consecutiveEmptyResponses + ' consecutive empties');
                    } else {
                        consecutiveEmptyResponses = 0;
                    }

                    planes.forEach(processPlane);
                    syncVisiblePlanes();

                    if (planes.length > 0) {
                        lastGoodAircraftCount = planes.length;
                        lastGoodRefreshAt = Date.now();
                    }

                    applyDeepLink();
                })
                .catch(function(err) {
                    clearTimeout(abortTimer);
                    if (seq !== refreshSeqId) { refreshInFlight = false; return; }
                    refreshInFlight = false;
                    if (err.name === 'AbortError') {
                        console.warn('[Radar] Refresh timed out after ' + (FETCH_TIMEOUT_MS / 1000) + 's');
                    } else {
                        console.warn('[Radar] Refresh failed:', err.message);
                    }
                    if (lastGoodAircraftCount > 0) {
                        showStatusHUD('Radar refresh failed — showing last known aircraft');
                    }
                });
        }

        function showStatusHUD(message, type) {
            var hud = document.getElementById('status-hud');
            if (!hud) {
                hud = document.createElement('div');
                hud.id = 'status-hud';
                hud.style.cssText = [
                    'position:fixed', 'bottom:64px', 'left:50%', 'transform:translateX(-50%)',
                    'background:rgba(0,0,0,0.85)',
                    'border-radius:6px', 'padding:9px 18px', 'font-size:12px',
                    'font-family:"Segoe UI",sans-serif',
                    'z-index:9999', 'cursor:pointer', 'white-space:nowrap',
                    'box-shadow:0 2px 12px rgba(0,0,0,0.5)'
                ].join(';');
                hud.onclick = function() { this.style.display = 'none'; };
                document.body.appendChild(hud);
            }
            var isInfo = type === 'info';
            hud.style.color  = isInfo ? '#00ffcc' : '#fa5';
            hud.style.border = '1px solid ' + (isInfo ? 'rgba(0,255,204,0.3)' : 'rgba(255,170,85,0.35)');
            hud.textContent = message;
            hud.style.display = 'block';
            if (hud._timer) clearTimeout(hud._timer);
            hud._timer = setTimeout(function() { hud.style.display = 'none'; }, 8000);
        }

        /* ── Deep-link support: /?icao=HEX, /?callsign=CALL, /?airport=CODE ── */
        function applyDeepLink() {
            // Guard: runs at most once per page load regardless of how many refreshes fire
            if (deepLinkApplied) return;
            deepLinkApplied = true;

            var params       = new URLSearchParams(window.location.search);
            var icaoParam    = (params.get('icao')     || '').toUpperCase().trim();
            var callParam    = (params.get('callsign') || '').toUpperCase().trim();
            var airportParam = (params.get('airport')  || '').toUpperCase().trim();

            if (!icaoParam && !callParam && !airportParam) return;

            // Airport deep-link — center map; does not require aircraft data
            if (airportParam) {
                showStatusHUD('Finding airport ' + airportParam + '…', 'info');
                applyAirportDeepLink(airportParam);
                return;
            }

            showStatusHUD('Finding aircraft ' + (icaoParam || callParam) + '…', 'info');

            // Aircraft deep-link with retry — aircraft may arrive via SSE after initial load
            var attempts = 0;
            var maxAttempts = 5;
            function findAndFocus() {
                var targetId = null;
                for (var id in planeData) {
                    var pd = planeData[id];
                    if (icaoParam && (pd.icaoHex || '').toUpperCase() === icaoParam) { targetId = id; break; }
                    if (callParam && (pd.callsign || '').toUpperCase() === callParam) { targetId = id; break; }
                }
                if (targetId) {
                    var pd = planeData[targetId];
                    map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 12));
                    // Allow moveend / syncVisiblePlanes to run before opening popup
                    setTimeout(function() {
                        if (!planeMarkers[targetId]) addMarker(targetId);
                        var marker = planeMarkers[targetId];
                        if (marker) { marker.openPopup(); startFollow(targetId); }
                        openAircraftPanel(targetId);
                    }, 350);
                    return;
                }
                if (++attempts < maxAttempts) {
                    setTimeout(findAndFocus, 1500);
                } else {
                    showDeepLinkHUD(icaoParam || callParam, false);
                }
            }
            findAndFocus();
        }

        function applyAirportDeepLink(code) {
            function doCenter() {
                var a = lookupAirport(code);
                if (!a) return false;
                var lat = parseFloat(a.lat || a.latitude || a.latitude_deg);
                var lon = parseFloat(a.lon || a.longitude || a.longitude_deg);
                if (isNaN(lat) || isNaN(lon)) return false;
                var zoom = (a.type === 'large_airport' || a.type === 'medium_airport') ? 11 : 12;
                map.setView([lat, lon], zoom);
                var label = code + (a.name ? ' — ' + a.name : '');
                showStatusHUD('Centered on ' + label, 'info');
                openAirportPanel(code, a);
                return true;
            }

            // If airport data already loaded, apply immediately
            if (airportData.length > 0) {
                if (!doCenter()) showDeepLinkHUD('Airport ' + code + ' not found', false);
                return;
            }

            // Airport JSON is still loading — retry up to 10 times at 400 ms
            var retries = 0;
            function tryLater() {
                if (airportData.length > 0) {
                    if (!doCenter()) showDeepLinkHUD('Airport ' + code + ' not found', false);
                    return;
                }
                if (++retries < 10) {
                    setTimeout(tryLater, 400);
                } else {
                    showDeepLinkHUD('Airport ' + code + ' — data unavailable', false);
                }
            }
            setTimeout(tryLater, 400);
        }

        function showDeepLinkHUD(label, found) {
            var hud = document.getElementById('deeplink-hud');
            if (!hud) {
                hud = document.createElement('div');
                hud.id = 'deeplink-hud';
                hud.style.cssText = [
                    'position:fixed', 'bottom:24px', 'left:50%', 'transform:translateX(-50%)',
                    'background:rgba(0,0,0,0.85)', 'border:1px solid rgba(255,153,119,0.35)',
                    'border-radius:6px', 'padding:9px 18px', 'font-size:12px',
                    'font-family:"Segoe UI",sans-serif', 'color:#f97',
                    'z-index:9999', 'cursor:pointer', 'white-space:nowrap',
                    'box-shadow:0 2px 12px rgba(0,0,0,0.5)'
                ].join(';');
                hud.onclick = function() { this.style.display = 'none'; };
                document.body.appendChild(hud);
            }
            hud.textContent = 'Aircraft "' + label + '" not found in current feed — click to dismiss';
            hud.style.display = 'block';
            setTimeout(function() { if (hud) hud.style.display = 'none'; }, 8000);
        }

        /* ── Side detail panel ── */
        var selectedAcId   = null;
        var selectedAptCode = null;
        var selectedAptObj  = null;
        var panelMode       = null;   // 'aircraft' | 'airport' | null
        var aptFlightsCache = {};     // code → {ts, inbound, outbound}
        var APT_FLIGHTS_TTL = 45000;  // ms throttle between re-fetches

        function openPanel() {
            document.getElementById('detail-panel').classList.add('open');
            document.body.classList.add('panel-open');
        }

        function closePanel() {
            selectedAcId    = null;
            selectedAptCode = null;
            selectedAptObj  = null;
            panelMode       = null;
            document.getElementById('detail-panel').classList.remove('open');
            document.body.classList.remove('panel-open');
            document.getElementById('dp-body').innerHTML = '';
        }

        /* ── Aircraft panel ── */
        function openAircraftPanel(flightId) {
            selectedAcId    = flightId;
            selectedAptCode = null;
            selectedAptObj  = null;
            panelMode       = 'aircraft';
            document.getElementById('dp-mode-label').textContent = 'Aircraft';
            openPanel();
            renderAircraftPanel();
        }

        function renderAircraftPanel() {
            if (panelMode !== 'aircraft' || !selectedAcId) return;
            document.getElementById('dp-body').innerHTML =
                buildAircraftPanelHTML(planeData[selectedAcId], selectedAcId);
        }

        function buildAircraftPanelHTML(p, flightId) {
            if (!p) {
                return '<div class="dp-stale">Not in current feed — data unavailable</div>' +
                       '<div class="dp-empty">Aircraft may have landed or left range.</div>';
            }

            var name         = displayName(p);
            var route        = formatRoute(p);
            var airline      = airlineInfo(p);
            var acClass      = displayAircraftClass(p);
            var state        = aircraftDisplayState(p);
            var stateLbl     = stateLabel(state);
            var icao         = String(p.icaoHex || '').trim().toUpperCase();
            var csRaw        = String(p.callsign || p.flight || '').trim().replace(/\s+/g, '');
            var isFollowing  = (followFlightId === flightId);

            var tags = [];
            if (boolField(p.isMilitary))  tags.push('Military');
            if (boolField(p.isHelicopter)) tags.push('Helicopter');
            if (boolField(p.isPia))        tags.push('PIA');
            if (boolField(p.isLadd))       tags.push('LADD');

            var subtitle = airline ? airline.display : (p.operator || p.registration || '');

            var html = '';

            html += '<div class="dp-ac-head">';
            html += '<div class="dp-ac-name">' + htmlEscape(name) + '</div>';
            if (subtitle) html += '<div class="dp-ac-sub">' + htmlEscape(subtitle) + '</div>';
            if (stateLbl) html += '<div class="dp-badge">' + htmlEscape(stateLbl) + '</div>';
            html += '</div>';

            if (route !== 'Route unavailable') {
                html += '<div class="dp-route">' + htmlEscape(route) + '</div>';
            }

            function fmtAlt(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n).toLocaleString() + ' ft'; }
            function fmtSpd(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n) + ' kt'; }
            function fmtHdg(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n) + '°'; }

            html += '<div class="dp-grid-3">';
            html += '<div class="dp-cell"><div class="dp-cell-label">Altitude</div><div class="dp-cell-value accent">' + htmlEscape(fmtAlt(p.alt)) + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Speed</div><div class="dp-cell-value">' + htmlEscape(fmtSpd(p.speed)) + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Heading</div><div class="dp-cell-value">' + htmlEscape(fmtHdg(p.heading)) + '</div></div>';
            html += '</div>';

            function dpRow(label, value) {
                if (value === null || value === undefined || value === '') return '';
                return '<div class="dp-row"><span class="dp-row-label">' + htmlEscape(label) +
                       '</span><span class="dp-row-value">' + value + '</span></div>';
            }

            html += '<div class="dp-section">';
            var vr = parseFloat(p.verticalRate);
            if (!isNaN(vr) && Math.abs(vr) >= 100) {
                html += dpRow('V/S', htmlEscape((vr > 0 ? '+' : '') + Math.round(vr).toLocaleString() + ' fpm'));
            }
            var aAlt = parseFloat(p.assignedAlt);
            if (!isNaN(aAlt) && aAlt > 0 && Math.abs((parseFloat(p.alt) || 0) - aAlt) > 300) {
                html += dpRow('Assigned Alt', htmlEscape(fmtAlt(p.assignedAlt)));
            }
            if (airline) html += dpRow('Airline', htmlEscape(airline.airline));
            if (p.registration) {
                html += dpRow('Registration',
                    '<span style="font-family:Consolas,Menlo,monospace">' + htmlEscape(p.registration) + '</span>');
            }
            if (p.aircraftType) html += dpRow('Type', htmlEscape(p.aircraftType));
            html += dpRow('Class', htmlEscape(acClass));
            if (tags.length) html += dpRow('Tags', htmlEscape(tags.join(' · ')));
            if (icao) {
                html += dpRow('ICAO',
                    '<span style="font-family:Consolas,Menlo,monospace">' + htmlEscape(icao) + '</span>');
            }
            var sq = String(p.squawk || '').trim();
            if (sq && sq !== '0') {
                var sqHtml = htmlEscape(sq);
                if (sq === '7500') sqHtml += ' <span style="color:#ff6060;font-weight:700">HIJACK</span>';
                else if (sq === '7600') sqHtml += ' <span style="color:#f5a623;font-weight:700">RADIO FAIL</span>';
                else if (sq === '7700') sqHtml += ' <span style="color:#ff6060;font-weight:700">EMERGENCY</span>';
                html += dpRow('Squawk', sqHtml);
            }
            html += '</div>';

            var posLabel   = friendlySource(p.positionSource || p.source);
            var routeLabel = friendlySource(p.enrichmentSource);
            if (posLabel || routeLabel || p.sourceFacility) {
                html += '<div class="dp-section dp-section-dim">';
                if (posLabel) html += dpRow('Position', htmlEscape(posLabel));
                if (routeLabel && routeLabel !== posLabel) html += dpRow('Route data', htmlEscape(routeLabel));
                if (p.sourceFacility) html += dpRow('Facility', htmlEscape(p.sourceFacility));
                html += '</div>';
            }

            var fid = String(flightId || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            html += '<div class="dp-actions">';
            if (isFollowing) {
                html += '<button class="dp-action primary" onclick="stopFollow();renderAircraftPanel()">Stop Follow</button>';
            } else {
                html += '<button class="dp-action primary" onclick="startFollow(\'' + fid + '\');renderAircraftPanel()">Follow</button>';
            }
            if (icao) {
                html += '<a class="dp-action" href="https://globe.adsbexchange.com/?icao=' +
                        htmlEscape(icao.toLowerCase()) + '" target="_blank" rel="noopener">ADSBx</a>';
            }
            if (csRaw && airline) {
                html += '<a class="dp-action" href="https://flightaware.com/live/flight/' +
                        htmlEscape(csRaw) + '" target="_blank" rel="noopener">FlightAware</a>';
            }
            var copyVal = icao || csRaw;
            if (copyVal && navigator && navigator.clipboard) {
                html += '<button class="dp-action" onclick="navigator.clipboard.writeText(\'' +
                        htmlEscape(copyVal) + '\')">Copy</button>';
            }
            html += '</div>';

            return html;
        }

        /* ── Airport panel ── */
        function openAirportPanel(code, airportObj) {
            code = String(code || '').toUpperCase().trim();
            if (!code) return;
            selectedAcId    = null;
            selectedAptCode = code;
            selectedAptObj  = airportObj || lookupAirport(code) || null;
            panelMode       = 'airport';
            document.getElementById('dp-mode-label').textContent = 'Airport';
            openPanel();
            renderAirportPanel();
            fetchAptFlights(code);
        }

        function renderAirportPanel() {
            if (panelMode !== 'airport' || !selectedAptCode) return;
            var code = selectedAptCode;
            document.getElementById('dp-body').innerHTML = buildAirportPanelHTML(selectedAptObj, code);
            var cache = aptFlightsCache[code];
            if (cache && cache.inbound !== undefined) {
                renderAptFlightsInPanel(code, cache.inbound, cache.outbound);
            }
        }

        function buildAirportPanelHTML(a, code) {
            function esc(v) { return htmlEscape(v); }
            function clean(v) { return String(v || '').trim(); }

            var html = '';

            if (!a) {
                html += '<div class="dp-apt-head"><div class="dp-apt-code">' + esc(code) + '</div></div>';
                html += '<div class="dp-flights-box" id="dp-flights-' + esc(code) +
                        '"><div class="dp-flights-loading">Loading…</div></div>';
                return html;
            }

            var iata     = clean(a.iata_code || a.iata).toUpperCase();
            var icao     = clean(a.gps_code || a.icao || a.ident).toUpperCase();
            var local    = clean(a.local_code).toUpperCase();
            var gps      = clean(a.gps_code).toUpperCase();
            var name     = clean(a.name) || 'Airport';
            var muni     = clean(a.municipality || a.city);
            var region   = clean(a.region || a.iso_region);
            var country  = clean(a.iso_country || a.country);
            var elev     = clean(a.elevation_ft || a.elevation);
            var type     = clean(a.type).replace(/_/g, ' ');
            var website  = clean(a.home_link || a.website || a.url);
            var wiki     = clean(a.wikipedia_link);
            var loc      = [muni, region || country].filter(Boolean).join(' · ');

            html += '<div class="dp-apt-head">';
            html += '<div class="dp-apt-code">' + esc(code) + '</div>';
            html += '<div class="dp-apt-name">' + esc(name) + '</div>';
            if (loc) html += '<div class="dp-apt-region">' + esc(loc) + '</div>';
            html += '</div>';

            html += '<div class="dp-grid-3">';
            html += '<div class="dp-cell"><div class="dp-cell-label">IATA</div>' +
                    '<div class="dp-cell-value' + (iata ? ' accent' : '') + '">' + esc(iata || '—') + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">ICAO</div>' +
                    '<div class="dp-cell-value' + (icao ? ' accent' : '') + '">' + esc(icao || code || '—') + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Elevation</div>' +
                    '<div class="dp-cell-value">' + esc(elev ? elev + ' ft' : '—') + '</div></div>';
            html += '</div>';

            function dpRow(label, val) {
                if (!val) return '';
                return '<div class="dp-row"><span class="dp-row-label">' + esc(label) +
                       '</span><span class="dp-row-value">' + esc(val) + '</span></div>';
            }

            html += '<div class="dp-section">';
            if (type) html += dpRow('Type', type.replace(/\b\w/g, function(c) { return c.toUpperCase(); }));
            if (local) html += dpRow('Local', local);
            if (gps && gps !== icao) html += dpRow('GPS', gps);
            if (region) html += dpRow('Region', region);
            html += '</div>';

            var freqs = Array.isArray(a.frequencies) ? a.frequencies : [];
            if (freqs.length) {
                html += '<div class="dp-section">';
                html += '<div class="dp-section-title">Frequencies</div>';
                freqs.slice(0, 8).forEach(function(f) {
                    var fType = clean(f.type || f.frequency_type || f.name).toUpperCase();
                    var mhz   = clean(f.frequency_mhz || f.mhz || f.freq || f.frequency);
                    var desc  = clean(f.description || f.desc || f.use || f.name);
                    html += '<div class="dp-freq">';
                    html += '<span class="dp-freq-type">' + esc(fType || '—') + '</span>';
                    html += '<span class="dp-freq-mhz">' + esc(mhz ? mhz + ' MHz' : '—') + '</span>';
                    html += '<span class="dp-freq-desc">' + esc(desc || '') + '</span>';
                    html += '</div>';
                });
                if (freqs.length > 8) {
                    html += '<div style="font-size:10px;color:#444;margin-top:4px">+' +
                            esc(String(freqs.length - 8)) + ' more</div>';
                }
                html += '</div>';
            }

            var aptCode = icao || code;
            html += '<div class="dp-actions">';
            html += '<button class="dp-action primary" onclick="applyAirportDeepLink(\'' +
                    htmlEscape(aptCode) + '\')">Center Map</button>';
            html += '<a class="dp-action" href="/airports">Airports</a>';
            if (website) html += '<a class="dp-action" href="' + esc(website) + '" target="_blank" rel="noopener">Website</a>';
            if (wiki)    html += '<a class="dp-action" href="' + esc(wiki) + '" target="_blank" rel="noopener">Wikipedia</a>';
            html += '</div>';

            html += '<div class="dp-flights-box" id="dp-flights-' + esc(code) +
                    '"><div class="dp-flights-loading">Loading aircraft…</div></div>';

            return html;
        }

        function fetchAptFlights(code) {
            var now   = Date.now();
            var cache = aptFlightsCache[code];
            if (cache && (now - cache.ts) < APT_FLIGHTS_TTL) {
                if (selectedAptCode === code && panelMode === 'airport') {
                    renderAptFlightsInPanel(code, cache.inbound, cache.outbound);
                }
                return;
            }
            fetch('/api/?action=Planes&view=airport&airport=' + encodeURIComponent(code) + '&_=' + now)
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(json) {
                    var data     = ((json.response || {}).data) || {};
                    var inbound  = data.inbound  || [];
                    var outbound = data.outbound || [];
                    aptFlightsCache[code] = { ts: Date.now(), inbound: inbound, outbound: outbound };
                    if (selectedAptCode === code && panelMode === 'airport') {
                        renderAptFlightsInPanel(code, inbound, outbound);
                    }
                })
                .catch(function() {
                    var box = document.getElementById('dp-flights-' + code);
                    if (box) box.innerHTML = '<div class="dp-flights-loading" style="color:#555">Aircraft data unavailable</div>';
                });
        }

        function renderAptFlightsInPanel(code, inbound, outbound) {
            var box = document.getElementById('dp-flights-' + code);
            if (!box) return;

            if (!inbound.length && !outbound.length) {
                box.innerHTML = '<div class="dp-flights-loading" style="color:#555">No active aircraft for ' +
                                htmlEscape(code) + '</div>';
                return;
            }

            function groupHtml(list, label) {
                if (!list.length) return '';
                var h = '<div class="dp-flights-group">';
                h += '<div class="dp-flights-group-title">' + htmlEscape(label) +
                     ' <span style="color:#444;font-weight:400">(' + list.length + ')</span></div>';
                list.slice(0, 10).forEach(function(p) {
                    var icaoHex = (p.icaoHex || '').toUpperCase();
                    var cs      = (p.callsign || '').trim();
                    var call    = (cs && cs !== icaoHex) ? cs :
                                  (p.registration || p.flightId || icaoHex || '—');
                    var dep     = (p.dep || '').trim().toUpperCase();
                    var arr     = (p.arr || '').trim().toUpperCase();
                    var rt      = (dep && arr) ? dep + '→' + arr :
                                  dep ? dep + '→?' : arr ? '?→' + arr : '—';
                    var altN    = parseFloat(p.alt);
                    var altStr  = (!isNaN(altN) && altN > 0) ?
                                  Math.round(altN).toLocaleString() + ' ft' : '';
                    var link    = icaoHex ? '/?icao=' + encodeURIComponent(icaoHex) : '';
                    h += '<div class="dp-flight-row">';
                    h += '<span class="dp-flight-call">'  + htmlEscape(call)   + '</span>';
                    h += '<span class="dp-flight-route">' + htmlEscape(rt)     + '</span>';
                    h += '<span class="dp-flight-alt">'   + htmlEscape(altStr) + '</span>';
                    h += link ? '<a class="dp-flight-link" href="' + htmlEscape(link) + '">Radar</a>'
                              : '<span></span>';
                    h += '</div>';
                });
                if (list.length > 10) {
                    h += '<div style="font-size:10px;color:#444;padding:4px 0">+' +
                         (list.length - 10) + ' more</div>';
                }
                h += '</div>';
                return h;
            }

            var html = '<div class="dp-flights-counts">';
            html += '<span style="color:#aaa">' + inbound.length  + ' inbound</span>';
            html += '<span style="color:#444">·</span>';
            html += '<span style="color:#aaa">' + outbound.length + ' outbound</span>';
            html += '</div>';
            html += groupHtml(inbound,  'Inbound to '    + code);
            html += groupHtml(outbound, 'Outbound from ' + code);

            box.innerHTML = html;
        }
    </script>
</body>
</html>
