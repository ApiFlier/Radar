<!DOCTYPE html>
<html>
<head>
    <title>Meeks Family Radar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .plane-container { background: none; border: none; }

        .aircraft-icon {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        }

        .aircraft-icon svg {
            display: block;
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 3px currentColor);
        }

        .aircraft-icon-commercial svg { width: 32px; height: 32px; }
        .aircraft-icon-private svg { width: 25px; height: 25px; }
        .aircraft-icon-military svg { width: 30px; height: 30px; }
        .aircraft-icon-helicopter svg { width: 30px; height: 30px; }

        .aircraft-icon-parked {
            opacity: 0.75;
        }

        .aircraft-icon-ground_moving {
            opacity: 0.9;
        }

        .aircraft-icon-ground-sweep {
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 7px rgba(255, 255, 255, 0.55);
        }

        .aircraft-icon-ground-sweep.aircraft-icon-parked {
            opacity: 0.9;
        }

        .aircraft-icon-ground-sweep.aircraft-icon-ground_moving {
            opacity: 1.0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        @keyframes emergency-pulse {
            0%, 100% { box-shadow: 0 0 8px rgba(255,50,50,0.9), 0 0 16px rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 22px rgba(255,0,0,1), 0 0 40px rgba(255,0,0,0.7); }
        }
        .aircraft-icon-emergency {
            background: rgba(120,0,0,0.6);
            border: 1.5px solid rgba(255,60,60,0.9);
            border-radius: 50%;
            animation: emergency-pulse 0.8s ease-in-out infinite;
        }

        .aircraft-badge {
            position: absolute;
            right: -5px;
            top: -6px;
            min-width: 12px;
            height: 12px;
            padding: 0 2px;
            border-radius: 7px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            line-height: 12px;
            text-align: center;
        }

        .aircraft-label {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 9px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 3px rgba(0,0,0,1), 0 1px 2px rgba(0,0,0,1);
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        .labels-hidden .aircraft-label { display: none; }

        #hud {
            position: fixed; top: 12px; left: 100px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #00ffcc; padding: 10px 16px;
            border-radius: 6px; font-size: 13px; pointer-events: none;
            border: 1px solid rgba(0,255,204,0.2); min-width: 160px;
        }
        #hud .total { font-size: 16px; margin-bottom: 6px; }
        #hud .total span { color: #fff; font-weight: bold; }
        #hud .airlines { font-size: 11px; color: #aaa; line-height: 1.6; }
        #hud .airlines span { color: #00ffcc; font-weight: bold; min-width: 30px; display: inline-block; text-align: right; margin-right: 4px; }

        /* push Leaflet zoom controls clear of the sidebar */
        .leaflet-top.leaflet-left { margin-left: 56px; }

        /* ── App sidebar ── */
        #sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 56px;
            z-index: 1100;
            background: rgba(8,8,8,0.95);
            border-right: 1px solid rgba(0,255,204,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar-logo {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #00ffcc;
            flex-shrink: 0;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-nav {
            flex: 1;
            width: 100%;
            padding: 6px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar-bottom {
            width: 100%;
            padding: 6px 0 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            flex-shrink: 0;
        }
        .nav-item {
            width: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 0 7px;
            border-radius: 6px;
            text-decoration: none;
            color: #686868;
            font-size: 8.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-item:hover { color: #b0b0b0; background: rgba(255,255,255,0.06); }
        .nav-item.active { color: #00ffcc; background: rgba(0,255,204,0.09); }
        .nav-item.active:hover { color: #00ffcc; background: rgba(0,255,204,0.13); }
        .nav-item.soon { color: #464646; }
        .nav-item.soon:hover { color: #636363; background: rgba(255,255,255,0.02); }
        .nav-sep { width: 28px; height: 1px; background: rgba(255,255,255,0.06); margin: 3px 0; }

        #search-box {
            position: fixed; top: 12px; right: 12px; z-index: 1000;
            display: flex; gap: 0;
        }
        #search-input {
            background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(0,255,204,0.3);
            border-radius: 6px 0 0 6px; padding: 8px 12px; font-size: 14px; width: 220px;
            outline: none; font-family: 'Segoe UI', sans-serif;
        }
        #search-input::placeholder { color: #666; }
        #search-input:focus { border-color: #00ffcc; }
        #search-btn {
            background: rgba(0,255,204,0.15); color: #00ffcc; border: 1px solid rgba(0,255,204,0.3);
            border-left: none; border-radius: 0 6px 6px 0; padding: 8px 12px; cursor: pointer;
            font-size: 14px;
        }
        #search-btn:hover { background: rgba(0,255,204,0.3); }
        #search-results {
            position: fixed; top: 48px; right: 12px; z-index: 1000;
            background: rgba(0,0,0,0.9); border: 1px solid rgba(0,255,204,0.2);
            border-radius: 6px; max-height: 300px; overflow-y: auto; display: none; width: 260px;
        }
        .search-result {
            padding: 8px 12px; color: #ccc; cursor: pointer; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .search-result:hover { background: rgba(0,255,204,0.1); color: #fff; }
        .search-result .sr-call { color: #00ffcc; font-weight: bold; }
        .search-result .sr-route { color: #888; font-size: 11px; }

        #follow-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0,0,0,0.85); color: #00ffcc;
            padding: 8px 20px; border-radius: 20px; font-size: 13px;
            border: 1px solid rgba(0,255,204,0.3); display: none; cursor: pointer;
        }
        #follow-bar:hover { background: rgba(0,255,204,0.15); }

        .leaflet-popup-content-wrapper {
            background: rgba(5,8,8,0.96);
            color: #ccc;
            border: 1px solid rgba(0,255,204,0.26);
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }
        .leaflet-popup-tip { background: rgba(5,8,8,0.96); }
        .leaflet-popup-content { margin: 0; }

        .ac-popup {
            min-width: 300px;
            max-width: 350px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #bbb;
            overflow: hidden;
        }
        .acp-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px 9px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,255,204,0.035);
        }
        .acp-title {
            color: #00ffcc;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.4px;
            font-family: Consolas, Menlo, monospace;
            line-height: 1.1;
        }
        .acp-sub {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
            line-height: 1.25;
        }
        .acp-badge {
            color: #00ffcc;
            border: 1px solid rgba(0,255,204,0.28);
            background: rgba(0,255,204,0.07);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .acp-route {
            padding: 9px 14px;
            color: #eee;
            font-size: 13px;
            line-height: 1.35;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .acp-body {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .acp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .acp-cell {
            background: rgba(0,0,0,0.24);
            padding: 8px 9px;
            min-width: 0;
        }
        .acp-label {
            color: #555;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.55px;
            margin-bottom: 2px;
        }
        .acp-value {
            color: #ddd;
            font-size: 12px;
            font-weight: 650;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .acp-value.accent { color: #00ffcc; }
        .acp-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 11px;
            padding: 2px 0;
        }
        .acp-row span:first-child {
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.45px;
            white-space: nowrap;
        }
        .acp-row span:last-child {
            color: #aaa;
            text-align: right;
            overflow-wrap: anywhere;
        }
        .acp-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 14px 12px;
        }
        .acp-action {
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.13);
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .acp-action:hover { color: #fff; background: rgba(255,255,255,0.07); }
        .acp-action.primary {
            color: #00ffcc;
            border-color: rgba(0,255,204,0.28);
            background: rgba(0,255,204,0.055);
        }
        .acp-action.primary:hover { background: rgba(0,255,204,0.11); }

        .search-section-label {
            color: #00ffcc;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            padding: 7px 10px 3px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .search-section-label:first-child { border-top: none; }
        .search-result .sr-kind {
            color: #555;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.45px;
            float: right;
            margin-left: 8px;
        }
        .search-result.active {
            background: rgba(0,255,204,0.13);
            color: #fff;
        }

        .apt-popup {
            min-width: 300px;
            max-width: 360px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #bbb;
            overflow: hidden;
        }
        .apt-head {
            padding: 12px 14px 9px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,255,204,0.035);
        }
        .apt-code {
            color: #00ffcc;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.4px;
            font-family: Consolas, Menlo, monospace;
            line-height: 1.1;
        }
        .apt-name {
            color: #ddd;
            font-size: 12px;
            font-weight: 600;
            margin-top: 3px;
            line-height: 1.3;
        }
        .apt-region {
            color: #777;
            font-size: 11px;
            margin-top: 2px;
        }
        .apt-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .apt-cell {
            background: rgba(0,0,0,0.24);
            padding: 8px 9px;
            min-width: 0;
        }
        .apt-label {
            color: #555;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.55px;
            margin-bottom: 2px;
        }
        .apt-value {
            color: #ddd;
            font-size: 12px;
            font-weight: 650;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .apt-value.accent { color: #00ffcc; }
        .apt-body {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .apt-section-title {
            color: #00ffcc;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.65px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .apt-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 11px;
            padding: 2px 0;
        }
        .apt-row span:first-child {
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.45px;
            white-space: nowrap;
        }
        .apt-row span:last-child {
            color: #aaa;
            text-align: right;
            overflow-wrap: anywhere;
        }
        .apt-frequency {
            display: grid;
            grid-template-columns: 44px 76px 1fr;
            gap: 8px;
            font-size: 11px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.035);
        }
        .apt-frequency:last-child { border-bottom: none; }
        .apt-frequency .type {
            color: #00ffcc;
            font-family: Consolas, Menlo, monospace;
            font-weight: 700;
        }
        .apt-frequency .mhz {
            color: #ddd;
            font-family: Consolas, Menlo, monospace;
        }
        .apt-frequency .desc { color: #777; }
        .apt-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 14px 12px;
        }
        .apt-action {
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.13);
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .apt-action:hover { color: #fff; background: rgba(255,255,255,0.07); }
        .apt-action.primary {
            color: #00ffcc;
            border-color: rgba(0,255,204,0.28);
            background: rgba(0,255,204,0.055);
        }
        .apt-action.primary:hover { background: rgba(0,255,204,0.11); }
        .apt-note {
            padding: 8px 14px 11px;
            color: #555;
            font-size: 10px;
            line-height: 1.35;
            background: rgba(255,255,255,0.015);
        }

        /* ── Detail panel ── */
        #detail-panel {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 380px;
            z-index: 1050;
            background: rgba(8,8,12,0.97);
            border-left: 1px solid rgba(0,255,204,0.1);
            display: flex; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
            box-shadow: -6px 0 28px rgba(0,0,0,0.55);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px; color: #bbb;
        }
        #detail-panel.open { transform: translateX(0); }

        #dp-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px 9px;
            background: rgba(0,255,204,0.03);
            border-bottom: 1px solid rgba(0,255,204,0.1);
            flex-shrink: 0; gap: 10px;
        }
        #dp-mode-label {
            font-size: 9px; font-weight: 700; color: #00ffcc;
            text-transform: uppercase; letter-spacing: 1px;
        }
        #dp-close {
            background: transparent; border: none;
            color: #555; font-size: 15px; cursor: pointer;
            padding: 2px 6px; border-radius: 4px; line-height: 1;
            font-family: inherit;
        }
        #dp-close:hover { color: #aaa; background: rgba(255,255,255,0.06); }

        #dp-body {
            flex: 1; overflow-y: auto; overflow-x: hidden;
        }
        #dp-body::-webkit-scrollbar { width: 4px; }
        #dp-body::-webkit-scrollbar-track { background: transparent; }
        #dp-body::-webkit-scrollbar-thumb { background: rgba(0,255,204,0.15); border-radius: 2px; }

        .dp-ac-head {
            padding: 13px 14px 11px;
            background: rgba(0,255,204,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .dp-ac-name {
            font-size: 20px; font-weight: 800; color: #00ffcc;
            font-family: Consolas, Menlo, monospace;
            letter-spacing: 0.3px; line-height: 1.1;
        }
        .dp-ac-sub { font-size: 11px; color: #777; margin-top: 3px; line-height: 1.3; }

        .dp-apt-head {
            padding: 13px 14px 11px;
            background: rgba(0,255,204,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .dp-apt-code {
            font-size: 22px; font-weight: 800; color: #00ffcc;
            font-family: Consolas, Menlo, monospace;
            letter-spacing: 0.3px; line-height: 1.1;
        }
        .dp-apt-name { font-size: 12px; font-weight: 600; color: #ddd; margin-top: 3px; line-height: 1.3; }
        .dp-apt-region { font-size: 11px; color: #777; margin-top: 2px; }

        .dp-badge {
            display: inline-block; font-size: 9px; font-weight: 700; color: #00ffcc;
            border: 1px solid rgba(0,255,204,0.28); background: rgba(0,255,204,0.07);
            border-radius: 4px; padding: 2px 6px; letter-spacing: 0.5px;
            text-transform: uppercase; white-space: nowrap; margin-top: 5px;
        }

        .dp-route {
            padding: 9px 14px; font-size: 13px; color: #eee; line-height: 1.35;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dp-grid-3 {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 1px; background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dp-cell { background: rgba(0,0,0,0.24); padding: 8px 9px; min-width: 0; }
        .dp-cell-label {
            color: #555; font-size: 9px; text-transform: uppercase;
            letter-spacing: 0.55px; margin-bottom: 2px;
        }
        .dp-cell-value {
            color: #ddd; font-size: 12px; font-weight: 650;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dp-cell-value.accent { color: #00ffcc; }

        .dp-section {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dp-section-dim { background: rgba(0,0,0,0.12); }
        .dp-section-title {
            font-size: 9px; font-weight: 800; color: #00ffcc;
            text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px;
        }

        .dp-row {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 10px; padding: 2px 0; font-size: 11px;
        }
        .dp-row-label {
            color: #555; text-transform: uppercase; letter-spacing: 0.45px;
            white-space: nowrap; flex-shrink: 0; font-size: 10px;
        }
        .dp-row-value { color: #aaa; text-align: right; overflow-wrap: anywhere; font-size: 11px; }

        .dp-actions {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dp-action {
            color: #aaa; border: 1px solid rgba(255,255,255,0.13);
            background: rgba(255,255,255,0.03); border-radius: 4px;
            padding: 5px 10px; font-size: 10px; font-weight: 700;
            text-decoration: none; cursor: pointer; text-transform: uppercase;
            letter-spacing: 0.4px; font-family: inherit;
        }
        .dp-action:hover { color: #fff; background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.22); }
        .dp-action.primary {
            color: #00ffcc; border-color: rgba(0,255,204,0.3); background: rgba(0,255,204,0.055);
        }
        .dp-action.primary:hover { background: rgba(0,255,204,0.11); }

        .dp-freq {
            display: grid; grid-template-columns: 44px 80px 1fr;
            gap: 8px; font-size: 11px; padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .dp-freq:last-child { border-bottom: none; }
        .dp-freq-type { color: #00ffcc; font-family: Consolas, Menlo, monospace; font-weight: 700; }

    <script>
        var map = L.map('map').setView([40.49, -79.84], 10);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        }).addTo(map);

        // Hybrid map overlays: satellite imagery plus labels/roads.
        map.createPane('labels');
        map.getPane('labels').style.zIndex = 350;
        map.getPane('labels').style.pointerEvents = 'none';

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labels',
            maxZoom: 19,
            attribution: 'Labels © Esri'
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labels',
            maxZoom: 19,
            attribution: 'Roads © Esri'
        }).addTo(map);


        var planeData = {};
        var planeMarkers = {};
        var activeTrail = null;
        var activeFlightId = null;
        var followFlightId = null;
        var KNOTS_TO_DEG_SEC = 0.0000046296;
        var currentBounds = null;
        var BOUNDS_PAD = 0.3;
        var DEAD_RECKON_MAX_AGE = 180;
        var REMOVE_STALE_AGE = 3600;

        // Refresh reliability state
        var lastGoodAircraftCount = 0;
        var lastGoodRefreshAt = 0;
        var consecutiveEmptyResponses = 0;
        var refreshInFlight = false;
        var refreshSeqId = 0;
        var deepLinkApplied = false;
        var FULL_REFRESH_INTERVAL_MS = 90000;   // periodic fallback behind SSE
        var FETCH_TIMEOUT_MS = 30000;            // abort hung fetches
        var SUSPICIOUS_EMPTY_THRESHOLD = 3;     // ignore N empties before accepting

        function updateBounds() {
            currentBounds = map.getBounds().pad(BOUNDS_PAD);
        }
        updateBounds();

        function isVisible(lat, lon) {
            return currentBounds && currentBounds.contains([lat, lon]);
        }

        function altColor(alt, speed) {
            var a = parseFloat(alt) || 0;
            var s = parseFloat(speed) || 0;
            if (s < 40) return '#666666';
            if (a < 5000) return '#3b82f6';
            if (a < 15000) return '#06b6d4';
            if (a < 25000) return '#00ffcc';
            if (a < 35000) return '#a5f3fc';
            return '#ffffff';
        }

        function displayName(p) {
            return p.callsign || p.flightId || 'UNKNOWN';
        }

        function updateHUD() {
            var total = Object.keys(planeData).length;
            var vis = Object.keys(planeMarkers).length;
            document.getElementById('count').textContent = total;
            document.getElementById('visible-count').textContent = vis;

            var classCounts = { commercial: 0, military: 0, helicopter: 0, private: 0, unknown: 0 };
            for (var id in planeData) {
                var cls = displayAircraftClass(planeData[id]);
                classCounts[cls] = (classCounts[cls] || 0) + 1;
            }

            var parts = [];
            if (classCounts.commercial) parts.push('<span>' + classCounts.commercial + '</span> Commercial');
            if (classCounts.military)   parts.push('<span>' + classCounts.military   + '</span> Military');
            if (classCounts.helicopter) parts.push('<span>' + classCounts.helicopter + '</span> Helicopter');
            if (classCounts.private)    parts.push('<span>' + classCounts.private    + '</span> Private');
            if (classCounts.unknown)    parts.push('<span>' + classCounts.unknown    + '</span> Unknown');
            document.getElementById('airline-stats').innerHTML = parts.join(' &middot; ');
        }

        function startFollow(flightId) {
            followFlightId = flightId;
            var pd = planeData[flightId];
            document.getElementById('follow-name').textContent = pd ? displayName(pd) : flightId;
            document.getElementById('follow-bar').style.display = 'block';
            if (pd) map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 11));
            showTrail(flightId);
        }

        function stopFollow() {
            followFlightId = null;
            document.getElementById('follow-bar').style.display = 'none';
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
                activeFlightId = null;
            }
        }

        function showTrail(flightId) {
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
            }

            activeFlightId = flightId;

            fetch('/api/?action=Trail&id=' + encodeURIComponent(flightId))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    var points = json.response && json.response.data ? json.response.data.points || [] : [];
                    if (points.length > 0) {
                        var latlngs = points.map(function(p) {
                            return [parseFloat(p.lat), parseFloat(p.lon)];
                        });

                        var pd = planeData[flightId];
                        if (pd) latlngs.push([pd.lat, pd.lon]);

                        var color = pd ? altColor(pd.alt, pd.speed) : '#00ffcc';
                        activeTrail = L.polyline(latlngs, {
                            color: color,
                            weight: 2,
                            opacity: 0.5,
                            dashArray: '6 4'
                        }).addTo(map);
                    }
                });
        }

        function cssSafe(value) {
            return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function isStale(p) {
            var now = Date.now() / 1000;
            var age = now - (parseFloat(p.lastUpdate) || 0);
            return age > DEAD_RECKON_MAX_AGE;
        }

        function staleOpacity(p) {
            var age = getPlaneAgeSeconds(p);

            if (isAirbornePlane(p)) {
                return age <= getVisibleAirMaxAge() ? 1.0 : 0.0;
            }

            return age <= getVisibleGroundMaxAge() ? 0.85 : 0.0;
        }

        function isAirbornePlane(p) {
            if (!p) return false;

            var speed = parseFloat(p.speed) || 0;
            var alt = parseFloat(p.alt) || 0;
            var airborne = String(p.airborne || '').toLowerCase();
            var onGround = String(p.onGround || p.on_ground || '').toLowerCase();
            var altBaro = String(p.alt_baro || p.altBaro || '').toLowerCase();

            if (onGround === '1' || onGround === 'true') return false;
            if (altBaro === 'ground') return false;

            return airborne === '1' || airborne === 'true' || speed >= 40 || alt >= 1500;
        }

        function aircraftDisplayState(p) {
            if (!p) return 'unknown';

            if (isAirbornePlane(p)) return 'airborne';

            var speed = parseFloat(p.speed) || 0;
            if (speed >= 3) return 'ground_moving';

            return 'parked';
        }

        function shouldDrawTrail(p) {
            return isAirbornePlane(p);
        }

        function boolField(v) {
            return v === true || v === 1 || v === '1' || String(v || '').toLowerCase() === 'true';
        }

        function aircraftIconType(p) {
            if (!p) return 'private';

            var iconType = String(displayIconType(p) || 'private').toLowerCase();

            if (boolField(p.isMilitary) || iconType === 'military') return 'military';
            if (boolField(p.isHelicopter) || iconType === 'helicopter') return 'helicopter';
            if (iconType === 'commercial') return 'commercial';
            if (iconType === 'private') return 'private';

            return 'private';
        }

        function aircraftIconSvg(p) {
            var iconType = aircraftIconType(p);

            if (iconType === 'military') {
                // Fighter jet top-down: sharp nose, swept delta wings, split twin tail fins.
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<path fill="currentColor" d="M32 2 L38 26 L60 38 L44 44 L38 60 L34 52 L30 52 L26 60 L20 44 L4 38 L26 26 Z"/>' +
                    '<path d="M32 6 L32 50" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round"/>' +
                    '</svg>';
            }

            if (iconType === 'helicopter') {
                // Helicopter top-down: main rotor blade drawn first (visible tips extend past body),
                // fuselage/cockpit bubble drawn over it, tail rotor at the bottom.
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<line x1="4" y1="26" x2="60" y2="26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>' +

                    '<line x1="22" y1="60" x2="42" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>' +
                    '</svg>';
            }

            if (iconType === 'commercial') {
                // Large airliner, top-down
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<path fill="currentColor" d="M32 2 C36 2 39 6 39 12 V26 L62 40 V49 L39 43 V54 L49 60 V63 L32 58 L15 63 V60 L25 54 V43 L2 49 V40 L25 26 V12 C25 6 28 2 32 2 Z"/>' +
                    '</svg>';
            }

            // Private / small single-engine aircraft, top-down. Prop dot at nose distinguishes from jet.
            return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                '<path fill="currentColor" d="M32 5 C35 5 37 8 37 12 V29 L56 39 V46 L37 42 V53 L45 58 V62 L32 59 L19 62 V58 L27 53 V42 L8 46 V39 L27 29 V12 C27 8 29 5 32 5 Z"/>' +

                '<circle cx="32" cy="7" r="3" fill="rgba(0,0,0,0.35)"/>' +

        }

        function aircraftBadgeHtml(p) {
            // Keep the map clean. Aircraft privacy/category tags are shown in the popup instead.
            return '';
        }

        function makePlaneIcon(id, heading, color, opacity) {
            var p = planeData[id] || {};
            var iconType = aircraftIconType(p);
            var state = aircraftDisplayState(p);
            var safeOpacity = opacity === undefined ? 1 : opacity;
            var iconSvg = aircraftIconSvg(p);

            if (iconType === 'commercial' || iconType === 'military') {

            var labelHtml = labelText ? '<div class="aircraft-label">' + htmlEscape(labelText) + '</div>' : '';

            return L.divIcon({
                className: 'plane-container',
                html: '<div id="icon-' + cssSafe(id) + '" ' +
                      'class="aircraft-icon aircraft-icon-' + iconType + ' aircraft-icon-' + state + groundClass + emergencyClass + '" ' +
                      'style="transform:rotate(' + heading + 'deg); opacity:' + safeOpacity + '; color:' + color + ';">' +
                      iconSvg +
                      badgeHtml +
                      '</div>' +
                      labelHtml,
                iconSize: [34, 34],
                iconAnchor: [17, 17]
            });
        }

        function htmlEscape(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
