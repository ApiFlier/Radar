<!DOCTYPE html>
<html>
<head>
    <title>Meeks Family Radar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .plane-container { background: none; border: none; }

        .aircraft-icon {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out;
        }

        .aircraft-icon svg {
            display: block;
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 3px currentColor);
        }

        .aircraft-icon-commercial svg { width: 32px; height: 32px; }
        .aircraft-icon-private svg { width: 25px; height: 25px; }
        .aircraft-icon-military svg { width: 30px; height: 30px; }
        .aircraft-icon-helicopter svg { width: 30px; height: 30px; }

        .aircraft-icon-parked {
            opacity: 0.75;
        }

        .aircraft-icon-ground_moving {
            opacity: 0.9;
        }

        .aircraft-icon-ground-sweep {
            background: rgba(0, 0, 0, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 7px rgba(255, 255, 255, 0.55);
        }

        .aircraft-icon-ground-sweep.aircraft-icon-parked {
            opacity: 0.9;
        }

        .aircraft-icon-ground-sweep.aircraft-icon-ground_moving {
            opacity: 1.0;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        }

        @keyframes emergency-pulse {
            0%, 100% { box-shadow: 0 0 8px rgba(255,50,50,0.9), 0 0 16px rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 22px rgba(255,0,0,1), 0 0 40px rgba(255,0,0,0.7); }
        }
        .aircraft-icon-emergency {
            background: rgba(120,0,0,0.6);
            border: 1.5px solid rgba(255,60,60,0.9);
            border-radius: 50%;
            animation: emergency-pulse 0.8s ease-in-out infinite;
        }

        .aircraft-badge {
            position: absolute;
            right: -5px;
            top: -6px;
            min-width: 12px;
            height: 12px;
            padding: 0 2px;
            border-radius: 7px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            line-height: 12px;
            text-align: center;
        }

        .aircraft-label {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 9px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 3px rgba(0,0,0,1), 0 1px 2px rgba(0,0,0,1);
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        .labels-hidden .aircraft-label { display: none; }

        #hud {
            position: fixed; top: 12px; left: 60px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #00ffcc; padding: 10px 16px;
            border-radius: 6px; font-size: 13px; pointer-events: none;
            border: 1px solid rgba(0,255,204,0.2); min-width: 160px;
        }
        #hud .total { font-size: 16px; margin-bottom: 6px; }
        #hud .total span { color: #fff; font-weight: bold; }
        #hud .airlines { font-size: 11px; color: #aaa; line-height: 1.6; }
        #hud .airlines span { color: #00ffcc; font-weight: bold; min-width: 30px; display: inline-block; text-align: right; margin-right: 4px; }

        #search-box {
            position: fixed; top: 12px; right: 12px; z-index: 1000;
            display: flex; gap: 0;
        }
        #search-input {
            background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(0,255,204,0.3);
            border-radius: 6px 0 0 6px; padding: 8px 12px; font-size: 14px; width: 220px;
            outline: none; font-family: 'Segoe UI', sans-serif;
        }
        #search-input::placeholder { color: #666; }
        #search-input:focus { border-color: #00ffcc; }
        #search-btn {
            background: rgba(0,255,204,0.15); color: #00ffcc; border: 1px solid rgba(0,255,204,0.3);
            border-left: none; border-radius: 0 6px 6px 0; padding: 8px 12px; cursor: pointer;
            font-size: 14px;
        }
        #search-btn:hover { background: rgba(0,255,204,0.3); }
        #search-results {
            position: fixed; top: 48px; right: 12px; z-index: 1000;
            background: rgba(0,0,0,0.9); border: 1px solid rgba(0,255,204,0.2);
            border-radius: 6px; max-height: 300px; overflow-y: auto; display: none; width: 260px;
        }
        .search-result {
            padding: 8px 12px; color: #ccc; cursor: pointer; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .search-result:hover { background: rgba(0,255,204,0.1); color: #fff; }
        .search-result .sr-call { color: #00ffcc; font-weight: bold; }
        .search-result .sr-route { color: #888; font-size: 11px; }

        #follow-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0,0,0,0.85); color: #00ffcc;
            padding: 8px 20px; border-radius: 20px; font-size: 13px;
            border: 1px solid rgba(0,255,204,0.3); display: none; cursor: pointer;
        }
        #follow-bar:hover { background: rgba(0,255,204,0.15); }

        .leaflet-popup-content-wrapper {
            background: rgba(0,0,0,0.85); color: #ccc; border: 1px solid #00ffcc44;
            border-radius: 6px; font-size: 13px;
        }
        .leaflet-popup-tip { background: rgba(0,0,0,0.85); }
        .leaflet-popup-content b { color: #00ffcc; }
        .leaflet-popup-content .route { color: #fff; font-size: 14px; margin: 4px 0; }
        .leaflet-popup-content .meta { color: #888; font-size: 11px; }
        .leaflet-popup-content .follow-link { color: #00ffcc; cursor: pointer; text-decoration: underline; font-size: 11px; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="total">Tracking <span id="count">0</span> aircraft (<span id="visible-count">0</span> visible)</div>
        <div class="airlines" id="airline-stats"></div>
    </div>
    <div id="search-box">
        <input type="text" id="search-input" placeholder="Callsign, airport, airline, flight ID">
        <button id="search-btn">&#128269;</button>
    </div>
    <div id="search-results"></div>
    <div id="follow-bar" onclick="stopFollow()">Following <span id="follow-name"></span> — click to stop</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([40.49, -79.84], 10);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        }).addTo(map);

        // Hybrid map overlays: satellite imagery plus labels/roads.
        map.createPane('labels');
        map.getPane('labels').style.zIndex = 350;
        map.getPane('labels').style.pointerEvents = 'none';

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labels',
            maxZoom: 19,
            attribution: 'Labels © Esri'
        }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
            pane: 'labels',
            maxZoom: 19,
            attribution: 'Roads © Esri'
        }).addTo(map);


        var planeData = {};
        var planeMarkers = {};
        var activeTrail = null;
        var activeFlightId = null;
        var followFlightId = null;
        var KNOTS_TO_DEG_SEC = 0.0000046296;
        var currentBounds = null;
        var BOUNDS_PAD = 0.3;
        var DEAD_RECKON_MAX_AGE = 180;
        var REMOVE_STALE_AGE = 3600;

        function updateBounds() {
            currentBounds = map.getBounds().pad(BOUNDS_PAD);
        }
        updateBounds();

        function isVisible(lat, lon) {
            return currentBounds && currentBounds.contains([lat, lon]);
        }

        function altColor(alt, speed) {
            var a = parseFloat(alt) || 0;
            var s = parseFloat(speed) || 0;
            if (s < 40) return '#666666';
            if (a < 5000) return '#3b82f6';
            if (a < 15000) return '#06b6d4';
            if (a < 25000) return '#00ffcc';
            if (a < 35000) return '#a5f3fc';
            return '#ffffff';
        }

        function displayName(p) {
            return p.callsign || p.flightId || 'UNKNOWN';
        }

        function updateHUD() {
            var total = Object.keys(planeData).length;
            var vis = Object.keys(planeMarkers).length;
            document.getElementById('count').textContent = total;
            document.getElementById('visible-count').textContent = vis;

            var classCounts = { commercial: 0, military: 0, helicopter: 0, private: 0, unknown: 0 };
            for (var id in planeData) {
                var cls = displayAircraftClass(planeData[id]);
                classCounts[cls] = (classCounts[cls] || 0) + 1;
            }

            var parts = [];
            if (classCounts.commercial) parts.push('<span>' + classCounts.commercial + '</span> Commercial');
            if (classCounts.military)   parts.push('<span>' + classCounts.military   + '</span> Military');
            if (classCounts.helicopter) parts.push('<span>' + classCounts.helicopter + '</span> Helicopter');
            if (classCounts.private)    parts.push('<span>' + classCounts.private    + '</span> Private');
            if (classCounts.unknown)    parts.push('<span>' + classCounts.unknown    + '</span> Unknown');
            document.getElementById('airline-stats').innerHTML = parts.join(' &middot; ');
        }

        function startFollow(flightId) {
            followFlightId = flightId;
            var pd = planeData[flightId];
            document.getElementById('follow-name').textContent = pd ? displayName(pd) : flightId;
            document.getElementById('follow-bar').style.display = 'block';
            if (pd) map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 11));
            showTrail(flightId);
        }

        function stopFollow() {
            followFlightId = null;
            document.getElementById('follow-bar').style.display = 'none';
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
                activeFlightId = null;
            }
        }

        function showTrail(flightId) {
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
            }

            activeFlightId = flightId;

            fetch('/api/?action=Trail&id=' + encodeURIComponent(flightId))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    var points = json.response && json.response.data ? json.response.data.points || [] : [];
                    if (points.length > 0) {
                        var latlngs = points.map(function(p) {
                            return [parseFloat(p.lat), parseFloat(p.lon)];
                        });

                        var pd = planeData[flightId];
                        if (pd) latlngs.push([pd.lat, pd.lon]);

                        var color = pd ? altColor(pd.alt, pd.speed) : '#00ffcc';
                        activeTrail = L.polyline(latlngs, {
                            color: color,
                            weight: 2,
                            opacity: 0.5,
                            dashArray: '6 4'
                        }).addTo(map);
                    }
                });
        }

        function cssSafe(value) {
            return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function isStale(p) {
            var now = Date.now() / 1000;
            var age = now - (parseFloat(p.lastUpdate) || 0);
            return age > DEAD_RECKON_MAX_AGE;
        }

        function staleOpacity(p) {
            var age = getPlaneAgeSeconds(p);

            if (isAirbornePlane(p)) {
                return age <= getVisibleAirMaxAge() ? 1.0 : 0.0;
            }

            return age <= getVisibleGroundMaxAge() ? 0.85 : 0.0;
        }

        function isAirbornePlane(p) {
            if (!p) return false;

            var speed = parseFloat(p.speed) || 0;
            var alt = parseFloat(p.alt) || 0;
            var airborne = String(p.airborne || '').toLowerCase();
            var onGround = String(p.onGround || p.on_ground || '').toLowerCase();
            var altBaro = String(p.alt_baro || p.altBaro || '').toLowerCase();

            if (onGround === '1' || onGround === 'true') return false;
            if (altBaro === 'ground') return false;

            return airborne === '1' || airborne === 'true' || speed >= 40 || alt >= 1500;
        }

        function aircraftDisplayState(p) {
            if (!p) return 'unknown';

            if (isAirbornePlane(p)) return 'airborne';

            var speed = parseFloat(p.speed) || 0;
            if (speed >= 3) return 'ground_moving';

            return 'parked';
        }

        function shouldDrawTrail(p) {
            return isAirbornePlane(p);
        }

        function boolField(v) {
            return v === true || v === 1 || v === '1' || String(v || '').toLowerCase() === 'true';
        }

        function aircraftIconType(p) {
            if (!p) return 'private';

            var iconType = String(displayIconType(p) || 'private').toLowerCase();

            if (boolField(p.isMilitary) || iconType === 'military') return 'military';
            if (boolField(p.isHelicopter) || iconType === 'helicopter') return 'helicopter';
            if (iconType === 'commercial') return 'commercial';
            if (iconType === 'private') return 'private';

            return 'private';
        }

        function aircraftIconSvg(p) {
            var iconType = aircraftIconType(p);

            if (iconType === 'military') {
                // Fighter jet top-down: sharp nose, swept delta wings, split twin tail fins.
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<path fill="currentColor" d="M32 2 L38 26 L60 38 L44 44 L38 60 L34 52 L30 52 L26 60 L20 44 L4 38 L26 26 Z"/>' +
                    '<path d="M32 6 L32 50" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round"/>' +
                    '</svg>';
            }

            if (iconType === 'helicopter') {
                // Helicopter top-down: main rotor blade drawn first (visible tips extend past body),
                // fuselage/cockpit bubble drawn over it, tail rotor at the bottom.
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<line x1="4" y1="26" x2="60" y2="26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>' +
                    '<path fill="currentColor" d="M32 10 C38 10 43 16 43 26 C43 37 39 49 34 54 L34 60 L30 60 L30 54 C25 49 21 37 21 26 C21 16 26 10 32 10 Z"/>' +
                    '<line x1="22" y1="60" x2="42" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>' +
                    '</svg>';
            }

            if (iconType === 'commercial') {
                // Large airliner, top-down
                return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                    '<path fill="currentColor" d="M32 2 C36 2 39 6 39 12 V26 L62 40 V49 L39 43 V54 L49 60 V63 L32 58 L15 63 V60 L25 54 V43 L2 49 V40 L25 26 V12 C25 6 28 2 32 2 Z"/>' +
                    '</svg>';
            }

            // Private / small single-engine aircraft, top-down. Prop dot at nose distinguishes from jet.
            return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
                '<path fill="currentColor" d="M32 5 C35 5 37 8 37 12 V29 L56 39 V46 L37 42 V53 L45 58 V62 L32 59 L19 62 V58 L27 53 V42 L8 46 V39 L27 29 V12 C27 8 29 5 32 5 Z"/>' +
                '<path fill="rgba(0,0,0,0.22)" d="M29 10 H35 V29 H29 Z"/>' +
                '<circle cx="32" cy="7" r="3" fill="rgba(0,0,0,0.35)"/>' +
                '</svg>';
        }

        function aircraftBadgeHtml(p) {
            // Keep the map clean. Aircraft privacy/category tags are shown in the popup instead.
            return '';
        }

        function makePlaneIcon(id, heading, color, opacity) {
            var p = planeData[id] || {};
            var iconType = aircraftIconType(p);
            var state = aircraftDisplayState(p);
            var safeOpacity = opacity === undefined ? 1 : opacity;
            var iconSvg = aircraftIconSvg(p);
            var badgeHtml = aircraftBadgeHtml(p);

            var groundClass = isGroundSweepPlane(p) ? ' aircraft-icon-ground-sweep' : '';
            var emergencyClass = isEmergencySquawk(p) ? ' aircraft-icon-emergency' : '';

            var labelText = '';
            if (iconType === 'commercial' || iconType === 'military') {
                labelText = String(p.callsign || '').trim();
            }
            var labelHtml = labelText ? '<div class="aircraft-label">' + htmlEscape(labelText) + '</div>' : '';

            return L.divIcon({
                className: 'plane-container',
                html: '<div id="icon-' + cssSafe(id) + '" ' +
                      'class="aircraft-icon aircraft-icon-' + iconType + ' aircraft-icon-' + state + groundClass + emergencyClass + '" ' +
                      'style="transform:rotate(' + heading + 'deg); opacity:' + safeOpacity + '; color:' + color + ';">' +
                      iconSvg +
                      badgeHtml +
                      '</div>' +
                      labelHtml,
                iconSize: [34, 34],
                iconAnchor: [17, 17]
            });
        }

        function htmlEscape(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function popupValue(value, fallback) {
            if (value === undefined || value === null || value === '') {
                return fallback || '—';
            }
            return htmlEscape(value);
        }

        function cleanAirportName(name) {
            name = String(name || '').trim();
            return name
                .replace(/\s+Airport$/i, '')
                .replace(/\s+International$/i, ' Intl')
                .replace(/\s+International\s+Airport$/i, ' Intl')
                .replace(/\s+Regional\s+Airport$/i, ' Regional')
                .replace(/\s+Municipal\s+Airport$/i, ' Municipal');
        }

        function airportCandidates(code) {
            var c = String(code || '').trim().toUpperCase();
            if (!c || c === '???') return [];

            var out = [c];

            // Some small US airports are stored as 4G4 instead of K4G4.
            if (/^K[0-9A-Z]{3}$/.test(c)) out.push(c.substring(1));

        function airportState(a, code) {

            'faa-sfdps':            'FAA/SWIM',
            'faa':                  'FAA/SWIM',
            'adsb-lol':             'ADSB.lol',
        };

        function friendlySource(raw) {
            if (!raw) return '';
            var key = String(raw).toLowerCase().trim();
            if (SOURCE_LABELS[key]) return SOURCE_LABELS[key];
            if (key.startsWith('faa-') || key.startsWith('swim-')) return 'FAA/SWIM';
            if (key.startsWith('opensky')) return 'OpenSky';
            if (key.startsWith('adsb-lol') || key.startsWith('adsblol')) return 'ADSB.lol';

        function stateLabel(state) {

        function isEmergencySquawk(p) {
            if (!p) return false;
            var sq = String(p.squawk || '').trim();
            var emerg = String(p.emergency || '').trim().toLowerCase();
            return sq === '7500' || sq === '7600' || sq === '7700' ||
                   (emerg && emerg !== 'none' && emerg !== '0' && emerg !== '');
        }

        function buildAirportLookup() {
            airportLookup = {};

            if (!airportData || !airportData.length) return;

            airportData.forEach(function(a) {
                [
                    a.ident,
                    a.icao,
                    a.icao_code,
                    a.gps_code,
                    a.local_code,
                    a.iata_code

                    if (code) airportLookup[String(code).toUpperCase()] = a;
                });

        function lookupAirport(code) {
            var candidates = airportCandidates(code);

            for (var i = 0; i < candidates.length; i++) {
                if (airportLookup[candidates[i]]) return airportLookup[candidates[i]];
            }

            return null;
        }

        function formatAirport(code) {
            var raw = String(code || '').trim().toUpperCase();
            if (!raw || raw === '???') return '???';

            var a = lookupAirport(raw);
            var displayCode = raw;
            var fixedName = AIRPORT_NAME_FIXES[raw] || null;

            if (!fixedName && a) {
                for (var i = 0; i < airportCandidates(raw).length; i++) {
                    var c = airportCandidates(raw)[i];
                    if (AIRPORT_NAME_FIXES[c]) {
                        fixedName = AIRPORT_NAME_FIXES[c];
                        break;
                    }
                }
            }

            if (!a && !fixedName) return displayCode;

            var name = fixedName || cleanAirportName(a.name || a.municipality || displayCode);
            var state = airportState(a, raw);
            var statePart = state ? ', ' + state : '';

            return name + statePart + ' (' + displayCode + ')';
        }

        function routeCodeValue(value) {
            var v = String(value || '').trim();
            if (!v || v === '???' || v.toLowerCase() === 'unknown' || v.toLowerCase() === 'none' || v.toLowerCase() === 'null') {
                return '';
            }
            return v;
        }

        function routeEndpointText(value, fallback) {
            var raw = routeCodeValue(value);
            if (!raw) return fallback;

            var code = String(raw).trim().toUpperCase();
            var hasAirport = !!lookupAirport(code);
            var hasFix = !!AIRPORT_NAME_FIXES[code];

            if (!hasAirport && !hasFix) {
                for (var i = 0; i < airportCandidates(code).length; i++) {
                    if (AIRPORT_NAME_FIXES[airportCandidates(code)[i]]) {
                        hasFix = true;
                        break;
                    }
                }
            }

            if (!hasAirport && !hasFix) return fallback;

            return formatAirport(code);
        }

        function formatRoute(p) {
            var depText = routeEndpointText(p.dep || p.origin || p.departure, 'Departure unknown');
            var arrText = routeEndpointText(p.arr || p.destination || p.arrival, 'Arrival unknown');

            if (depText === 'Departure unknown' && arrText === 'Arrival unknown') return 'Route unavailable';

            return depText + ' → ' + arrText;
        }

        function airlineInfo(p) {
            var callsign = String((p && (p.callsign || p.flight || p.flightId || p.flight_id)) || '').trim().toUpperCase();
            var m = callsign.match(/^([A-Z]{2,3})([0-9]{1,5}[A-Z]?)$/);

            if (!m) return null;

            var prefix = m[1];
            var number = m[2];
            var airline = AIRLINE_PREFIXES[prefix];

            if (!airline) return null;

            return {
                prefix: prefix,
                number: number,
                airline: airline,
                display: airline + ' ' + number
            };
        }


        function displayAircraftClass(p) {
            var cls = String((p && (p.aircraftClass || p.aircraft_class)) || 'unknown').toLowerCase();
            var airline = airlineInfo(p);

            if (airline && airline.prefix === 'RCH') return 'military';
            if (airline && cls !== 'military' && cls !== 'helicopter') return 'commercial';

            return cls;
        }

        function displayIconType(p) {
            var icon = String((p && (p.iconType || p.icon_type || p.aircraftClass || p.aircraft_class)) || 'private').toLowerCase();
            var airline = airlineInfo(p);

            if (airline && airline.prefix === 'RCH') return 'military';
            if (airline && (icon === 'private' || icon === 'unknown')) return 'commercial';

            return icon;
        }

        function popupContent(p) {
            if (!p) return '<div>No aircraft data</div>';

            var name = displayName(p);
            var route = formatRoute(p);
            var airline = airlineInfo(p);
            var aircraftClass = displayAircraftClass(p);
            var iconType = displayIconType(p);
            var state = aircraftDisplayState(p);

            var tags = [];
            if (boolField(p.isMilitary)) tags.push('Military');
            if (boolField(p.isPia)) tags.push('PIA');
            if (boolField(p.isLadd)) tags.push('LADD');
            if (boolField(p.isHelicopter)) tags.push('Helicopter');

            var flightId = String(p.flightId || p.flight_id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            var stateLbl = stateLabel(state);

            var html = '<div style="min-width:240px">';
            html += '<b>' + htmlEscape(name) + '</b>';
            if (stateLbl) html += ' <span class="meta">' + htmlEscape(stateLbl) + '</span>';
            html += '<div class="route">' + htmlEscape(route) + '</div>';
            if (airline) {
                html += '<div class="meta">Airline: ' + htmlEscape(airline.airline) + '</div>';
                html += '<div class="meta">Flight: ' + htmlEscape(airline.display) + '</div>';
            }
            if (tags.length) {
                html += '<div class="meta">Tags: ' + htmlEscape(tags.join(', ')) + '</div>';
            }

            html += '<hr style="border-color:#333">';
            var fmtAlt = function(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n).toLocaleString(); };
            var fmtSpd = function(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n); };
            var fmtHdg = function(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n); };
            html += 'Alt: ' + fmtAlt(p.alt) + ' ft';
            html += ' &nbsp; Spd: ' + fmtSpd(p.speed) + ' kt';
            html += ' &nbsp; Hdg: ' + fmtHdg(p.heading) + '°<br>';
            var vr = parseFloat(p.verticalRate);
            if (!isNaN(vr) && Math.abs(vr) >= 100) {
                var vrColor = vr > 0 ? '#7cf' : '#f97';
                html += '<span style="color:' + vrColor + '">' + (vr > 0 ? '↑' : '↓') + ' ' + Math.abs(Math.round(vr)).toLocaleString() + ' fpm</span><br>';
            }

            var aAlt = parseFloat(p.assignedAlt);
            if (!isNaN(aAlt) && aAlt > 0 && Math.abs((parseFloat(p.alt) || 0) - aAlt) > 300) {
                html += 'Assigned: ' + fmtAlt(p.assignedAlt) + ' ft<br>';
            }
            if (p.registration) html += 'Reg: ' + popupValue(p.registration) + '<br>';
            if (p.aircraftType) html += 'Type: ' + popupValue(p.aircraftType) + '<br>';
            if (p.icaoHex) html += '<span class="meta">ICAO: <a href="https://globe.adsbexchange.com/?icao=' + htmlEscape(p.icaoHex.toLowerCase()) + '" target="_blank" rel="noopener" style="color:#8af">' + popupValue(p.icaoHex) + '</a></span><br>';
            if (p.squawk) {
                var sq = String(p.squawk).trim();
                var sqHtml = 'Squawk: ' + popupValue(sq);
                if (sq === '7500') sqHtml += ' <span style="color:#f55;font-weight:bold">HIJACK</span>';
                else if (sq === '7600') sqHtml += ' <span style="color:#fa5;font-weight:bold">RADIO FAIL</span>';
                else if (sq === '7700') sqHtml += ' <span style="color:#f55;font-weight:bold">EMERGENCY</span>';
                else if (p.emergency && p.emergency !== 'none' && p.emergency !== '0') sqHtml += ' <span style="color:#fa5;font-weight:bold">' + htmlEscape(p.emergency) + '</span>';
                html += '<span class="meta">' + sqHtml + '</span><br>';
            }

            html += '<hr style="border-color:#333">';
            var posLabel = friendlySource(p.positionSource || p.source);
            var routeLabel = friendlySource(p.enrichmentSource);
            if (posLabel) html += '<div class="meta">Position: ' + htmlEscape(posLabel) + '</div>';
            if (routeLabel && routeLabel !== posLabel) html += '<div class="meta">Route: ' + htmlEscape(routeLabel) + '</div>';

            var csRaw = String(p.callsign || p.flight || '').trim().replace(/\s+/g, '');
            if (csRaw && airline) {
                html += '<div class="meta"><a href="https://flightaware.com/live/flight/' + htmlEscape(csRaw) + '" target="_blank" rel="noopener" style="color:#8af">FA: ' + htmlEscape(csRaw) + '</a></div>';
            }

            if (flightId) {
                html += '<br><span class="follow-link" onclick="startFollow(\'' + flightId + '\')">Follow aircraft</span>';
            }

            html += '</div>';
            return html;

        function addMarker(id) {
            var p = planeData[id];
            if (!p || planeMarkers[id]) return;

            var color = altColor(p.alt, p.speed);
            var icon = makePlaneIcon(id, p.heading || 0, color, staleOpacity(p));

            var marker = L.marker([p.lat, p.lon], {icon: icon})
                .bindPopup(popupContent(p))
                .on('click', (function(fid) {
                    return function() {
                        if (shouldDrawTrail(planeData[fid])) {
                            showTrail(fid);
                        }
                    };
                })(id))
                .addTo(map);

            planeMarkers[id] = marker;
            planeMarkers[id]._lastColor = color;
        }

        function removeMarker(id) {
            if (planeMarkers[id]) {
                map.removeLayer(planeMarkers[id]);
                delete planeMarkers[id];
            }
        }

        function getVisibleAirMaxAge() {
            return typeof VISIBLE_AIR_MAX_AGE !== 'undefined' ? VISIBLE_AIR_MAX_AGE : 120;
        }

        function getVisibleGroundMaxAge() {
            return typeof VISIBLE_GROUND_MAX_AGE !== 'undefined' ? VISIBLE_GROUND_MAX_AGE : 900;
        }

        function getGroundDisplayMinZoom() {
            return typeof GROUND_DISPLAY_MIN_ZOOM !== 'undefined' ? GROUND_DISPLAY_MIN_ZOOM : 8;
        }

        function getGroundAirportRadiusNm() {
            return typeof GROUND_AIRPORT_RADIUS_NM !== 'undefined' ? GROUND_AIRPORT_RADIUS_NM : 5;
        }

        function planeAgeSeconds(p) {
            return getPlaneAgeSeconds(p);
        }

        function getPlaneAgeSeconds(p) {
            var lastUpdate = parseFloat(p && (p.lastUpdate || p.last_update)) || 0;
            if (!lastUpdate) return 999999;

            return (Date.now() / 1000) - lastUpdate;
        }

        function distanceNm(lat1, lon1, lat2, lon2) {
            var rNm = 3440.065;
            var p = Math.PI / 180;
            var dLat = (lat2 - lat1) * p;
            var dLon = (lon2 - lon1) * p;

            var a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * p) * Math.cos(lat2 * p) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            return rNm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function nearestAirportWithin(lat, lon, maxNm) {
            if (!airportData || !airportData.length) return null;

            var best = null;
            var bestDist = maxNm;

            for (var i = 0; i < airportData.length; i++) {
                var a = airportData[i];
                if (!a) continue;

                var aLat = parseFloat(a.lat || a.latitude || a.latitude_deg);
                var aLon = parseFloat(a.lon || a.longitude || a.longitude_deg);

                if (isNaN(aLat) || isNaN(aLon)) continue;

                var d = distanceNm(lat, lon, aLat, aLon);
                if (d <= bestDist) {
                    best = a;
                    bestDist = d;
                }
            }

            return best;
        }

        function isGroundSweepPlane(p) {
            if (!p) return false;

            var source = String(p.source || '').toLowerCase();
            var positionSource = String(p.positionSource || p.position_source || '').toLowerCase();

            return source === 'adsblol-ground-sweep' || positionSource === 'adsblol-ground-sweep';
        }

        function shouldDisplayPlane(p) {
            if (!p) return false;

            var lat = parseFloat(p.lat);
            var lon = parseFloat(p.lon);

            if (isNaN(lat) || isNaN(lon)) return false;

            var isGroundSweep = isGroundSweepPlane(p);

            // Ground sweep aircraft are useful only when zoomed in near the airport.
            // They are already airport-targeted by the backend, but we still keep
            // frontend bounds, zoom, and freshness checks to avoid clutter.
            if (isGroundSweep) {
                if (typeof map !== 'undefined' && map && typeof map.getZoom === 'function') {
                    if (map.getZoom() < getGroundDisplayMinZoom()) return false;
                }

                if (typeof isVisible === 'function' && !isVisible(lat, lon)) return false;

                if (getPlaneAgeSeconds(p) > getVisibleGroundMaxAge()) return false;

                return true;
            }

            if (typeof isVisible === 'function' && !isVisible(lat, lon)) return false;

            if (isAirbornePlane(p)) {
                if (typeof staleOpacity === 'function' && staleOpacity(p) <= 0) return false;
                return getPlaneAgeSeconds(p) <= getVisibleAirMaxAge();
            }

            if (typeof map !== 'undefined' && map && typeof map.getZoom === 'function') {
                if (map.getZoom() < getGroundDisplayMinZoom()) return false;
            }

            if (typeof staleOpacity === 'function' && staleOpacity(p) <= 0) return false;
            if (getPlaneAgeSeconds(p) > getVisibleGroundMaxAge()) return false;

            return nearestAirportWithin(lat, lon, getGroundAirportRadiusNm()) !== null;
        }

        function updateAircraftTags(target, source) {
            if (!target || !source) return;

            target.aircraftClass = source.aircraftClass || source.aircraft_class || target.aircraftClass || 'unknown';
            target.aircraftRole = source.aircraftRole || source.aircraft_role || target.aircraftRole || 'unknown';
            target.iconType = source.iconType || source.icon_type || target.iconType || target.aircraftClass || 'private';

            // Preserve source fields so ground-sweep aircraft can be identified after storage in planeData.
            target.source = source.source || target.source || '';
            target.positionSource = source.positionSource || source.position_source || target.positionSource || '';
            target.sourceFacility = source.sourceFacility || source.source_facility || target.sourceFacility || '';
            target.groundCluster = source.groundCluster || source.ground_cluster || target.groundCluster || '';

            // Preserve ground/airborne state fields.
            target.alt_baro = source.alt_baro !== undefined ? source.alt_baro : target.alt_baro;
            target.altBaro = source.altBaro !== undefined ? source.altBaro : target.altBaro;
            target.airborne = source.airborne !== undefined ? source.airborne : target.airborne;
            target.onGround = source.onGround !== undefined ? source.onGround : (source.on_ground !== undefined ? source.on_ground : target.onGround);
            target.lastUpdate = source.lastUpdate || source.last_update || target.lastUpdate;

            target.isMilitary = source.isMilitary !== undefined ? source.isMilitary : (source.is_military !== undefined ? source.is_military : target.isMilitary);
            target.isPia = source.isPia !== undefined ? source.isPia : (source.is_pia !== undefined ? source.is_pia : target.isPia);
            target.isLadd = source.isLadd !== undefined ? source.isLadd : (source.is_ladd !== undefined ? source.is_ladd : target.isLadd);
            target.isHelicopter = source.isHelicopter !== undefined ? source.isHelicopter : (source.is_helicopter !== undefined ? source.is_helicopter : target.isHelicopter);
        }

        function aircraftStorageId(p) {
            if (!p) return '';

            if (isGroundSweepPlane(p)) {
                var hex = p.icaoHex || p.icao_hex || p.hex || '';
                if (hex) return 'ground:' + String(hex).toUpperCase();

                var cs = p.callsign || p.flight || '';
                if (cs) return 'ground:' + String(cs).trim();
            }

            return p.flightId || p.flight_id || p.id || p.callsign || p.icaoHex || p.icao_hex || '';
        }

        function processPlane(p) {
            var id = aircraftStorageId(p);
            if (!id) return;

            var lat = parseFloat(p.lat);
            var lon = parseFloat(p.lon);
            if (isNaN(lat) || isNaN(lon)) return;

            var speed = parseFloat(p.speed) || 0;
            var heading = parseFloat(p.heading) || 0;
            var timestamp = parseFloat(p.lastUpdate || p.last_update) || 0;

            // Some ADSB.lol ground-sweep records arrive without a durable timestamp
            // after API normalization. Treat the API fetch time as fresh so they
            // are not immediately removed by cleanStalePlanes().
            if (!timestamp && isGroundSweepPlane(p)) {
                timestamp = Date.now() / 1000;
            }

            if (!planeData[id]) {
                planeData[id] = {
                    flightId: id,
                    callsign: p.callsign || id,
                    lat: lat,
                    lon: lon,
                    speed: speed,
                    heading: heading,
                    lastUpdate: timestamp,
                    alt: p.alt,
                    assignedAlt: p.assignedAlt || p.assigned_alt,
                    dep: p.dep,
                    arr: p.arr,
                    depTime: p.depTime || p.dep_time,
                    eta: p.eta,
                    faaTs: p.faaTs || p.faa_ts,
                    flightStatus: p.flightStatus || p.flight_status,
                    operator: p.operator,
                    icaoHex: p.icaoHex || p.icao_hex,
                    source: p.source,
                    airborne: p.airborne,
                    onGround: p.onGround || p.on_ground,
                    displayState: aircraftDisplayState(p)
                };

                updateAircraftTags(planeData[id], p);
            } else {
                var pd = planeData[id];
                if (timestamp >= pd.lastUpdate || timestamp === 0) {
                    pd.flightId = id;
                    pd.callsign = p.callsign || pd.callsign || id;
                    pd.lat = lat;
                    pd.lon = lon;
                    pd.speed = speed;
                    pd.heading = heading;
                    pd.lastUpdate = timestamp;
                    pd.alt = p.alt;
                    pd.assignedAlt = p.assignedAlt || p.assigned_alt || pd.assignedAlt;
                    pd.dep = p.dep || pd.dep;
                    pd.arr = p.arr || pd.arr;
                    pd.depTime = p.depTime || p.dep_time || pd.depTime;
                    pd.eta = p.eta || pd.eta;
                    pd.faaTs = p.faaTs || p.faa_ts || pd.faaTs;
                    pd.flightStatus = p.flightStatus || p.flight_status || pd.flightStatus;
                    pd.operator = p.operator || pd.operator;
                    pd.icaoHex = p.icaoHex || p.icao_hex || pd.icaoHex;
                    pd.source = p.source || pd.source;
                    pd.airborne = p.airborne !== undefined ? p.airborne : pd.airborne;
                    pd.onGround = (p.onGround || p.on_ground) !== undefined ? (p.onGround || p.on_ground) : pd.onGround;
                    updateAircraftTags(pd, p);
                    pd.displayState = aircraftDisplayState(pd);
                }
            }

            if (planeMarkers[id]) {
                if (!shouldDisplayPlane(planeData[id]) && id !== followFlightId && id !== activeFlightId) {
                    removeMarker(id);
                    return;
                }

                var color = altColor(planeData[id].alt, planeData[id].speed);
                var opacity = staleOpacity(planeData[id]);

                planeMarkers[id].setLatLng([lat, lon]);
                planeMarkers[id].setIcon(makePlaneIcon(id, heading, color, opacity));
                planeMarkers[id]._lastColor = color;
                planeMarkers[id].getPopup().setContent(popupContent(planeData[id]));

                if (followFlightId === id) {
                    map.panTo([lat, lon], {animate: true, duration: 1});
                }
            } else if (shouldDisplayPlane(planeData[id])) {
                addMarker(id);
            }
        }

        function syncVisiblePlanes() {
            updateBounds();
            for (var id in planeData) {
                var p = planeData[id];
                if (shouldDisplayPlane(p)) {
                    if (!planeMarkers[id]) addMarker(id);
                } else if (id !== followFlightId && id !== activeFlightId) {
                    removeMarker(id);
                }
            }
            updateHUD();
        }

        function cleanStalePlanes() {
            var now = Date.now() / 1000;
            for (var id in planeData) {
                var age = now - (parseFloat(planeData[id].lastUpdate) || 0);
                var maxAge = isGroundSweepPlane(planeData[id]) ? getVisibleGroundMaxAge() : REMOVE_STALE_AGE;
                if (age > maxAge) {
                    if (followFlightId === id) stopFollow();
                    removeMarker(id);
                    delete planeData[id];
                } else if (planeMarkers[id]) {
                    planeMarkers[id].setPopupContent(popupContent(planeData[id]));
                    planeMarkers[id].setIcon(makePlaneIcon(
                        id,
                        parseFloat(planeData[id].heading || 0),
                        altColor(planeData[id].alt, planeData[id].speed),
                        staleOpacity(planeData[id])
                    ));
                }
            }
            updateHUD();
        }


        var airportData = [];
        var airportLookup = {};
        var airportMarkers = {};
        var airportLayer = L.layerGroup().addTo(map);

        function airportMinZoom(a) {
            if (a.type === 'large_airport') return 5;
            if (a.type === 'medium_airport') return 7;
            if (a.scheduled_service === 'yes') return 8;
            if (a.type === 'small_airport') return 11;
            return 13;
        }

        function airportColor(a) {
            if (a.type === 'large_airport') return '#ffcc00';
            if (a.type === 'medium_airport') return '#ffaa00';
            if (a.scheduled_service === 'yes') return '#00ffcc';
            return '#ffffff';
        }

        function airportPopup(a) {
            var codeLine = [
                a.iata ? 'IATA ' + a.iata : '',
                a.icao ? 'ICAO ' + a.icao : '',
                a.local ? 'Local ' + a.local : '',
                a.gps ? 'GPS ' + a.gps : ''
            ].filter(Boolean).join(' / ');

            var html = '<div style="min-width:240px">';
            html += '<b>' + (a.code || a.ident) + ' - ' + (a.name || '') + '</b>';
            html += '<br>' + codeLine;
            html += '<br>' + (a.municipality || '') + ' ' + (a.region || '');
            if (a.elevation_ft) html += '<br>Elevation: ' + a.elevation_ft + ' ft';
            html += '<br>Type: ' + (a.type || '').replace('_', ' ');

            if (a.frequencies && a.frequencies.length) {
                html += '<hr style="border-color:#333">';
                html += '<b>Frequencies</b>';
                a.frequencies.slice(0, 8).forEach(function(f) {
                    html += '<br>' + (f.type || '') + ': ' + f.mhz + ' MHz';
                    if (f.description) html += ' - ' + f.description;
                });
            }

            if (a.home_link) {
                html += '<hr style="border-color:#333">';
                html += '<a href="' + a.home_link + '" target="_blank">Airport website</a>';
            }

            html += '<hr style="border-color:#333">';
            html += '<small>Airport/frequency data is for display only. Verify against official FAA sources before operational use.</small>';
            html += '</div>';
            return html;
        }

        function shouldShowAirport(a) {
            if (!a || isNaN(a.lat) || isNaN(a.lon)) return false;
            if (map.getZoom() < airportMinZoom(a)) return false;
            return map.getBounds().pad(0.2).contains([a.lat, a.lon]);
        }

        function addAirportMarker(a) {
            var id = a.ident || a.code;
            if (!id || airportMarkers[id]) return;

            var marker = L.circleMarker([a.lat, a.lon], {
                radius: a.type === 'large_airport' ? 6 : 4,
                color: airportColor(a),
                weight: 2,
                fillColor: airportColor(a),
                fillOpacity: 0.65,
                opacity: 0.95
            }).bindPopup(airportPopup(a));

            marker.addTo(airportLayer);
            airportMarkers[id] = marker;
        }

        function removeAirportMarker(id) {
            if (airportMarkers[id]) {
                airportLayer.removeLayer(airportMarkers[id]);
                delete airportMarkers[id];
            }
        }

        function syncAirportMarkers() {
            if (!airportData.length) return;

            var visible = {};
            airportData.forEach(function(a) {
                var id = a.ident || a.code;
                if (!id) return;

                if (shouldShowAirport(a)) {
                    visible[id] = true;
                    addAirportMarker(a);
                }
            });

            for (var id in airportMarkers) {
                if (!visible[id]) removeAirportMarker(id);
            }
        }

        fetch('/static/airports.json')
            .then(function(res) { return res.json(); })
            .then(function(json) {
                airportData = json.airports || [];
                buildAirportLookup();
                syncAirportMarkers();

                // Ground aircraft visibility depends on airportData.
                // Re-run aircraft visibility after airports load.
                syncVisiblePlanes();
            })
            .catch(function(err) {
                console.log('Airport layer failed to load', err);
            });


        map.on('moveend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
        });
        map.on('zoomend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
            updateLabelVisibility();
        });

        function updateLabelVisibility() {
            var mapEl = document.getElementById('map');
            if (map.getZoom() >= 9) {
                mapEl.classList.remove('labels-hidden');
            } else {
                mapEl.classList.add('labels-hidden');
            }
        }
        updateLabelVisibility();

        // Load initial planes
        fetch('/api/?action=Planes&_=' + Date.now())
            .then(function(res) { return res.json(); })
            .then(function(json) {
                var planes = json.response && json.response.data ? json.response.data.planes || [] : [];
                planes.forEach(processPlane);
                syncVisiblePlanes();
            });

        // SSE stream
        var source = new EventSource('/api/stream');
        source.onmessage = function(event) {
            processPlane(JSON.parse(event.data));
        };
        source.onerror = function() {
            console.log('SSE connection error, will retry...');
        };

        setInterval(function() {
            var now = Date.now() / 1000;
            for (var id in planeMarkers) {
                var pd = planeData[id];
                if (!pd) continue;

                var age = now - (parseFloat(pd.lastUpdate) || 0);
                if (shouldDrawTrail(pd) && pd.speed > 10 && age < DEAD_RECKON_MAX_AGE) {
                    var dist = pd.speed * KNOTS_TO_DEG_SEC * 0.033;
                    var rad = pd.heading * Math.PI / 180;
                    pd.lat += dist * Math.cos(rad);
                    pd.lon += dist * Math.sin(rad) / Math.cos(pd.lat * Math.PI / 180);
                    planeMarkers[id].setLatLng([pd.lat, pd.lon]);
                }

                if (followFlightId === id) {
                    map.panTo([pd.lat, pd.lon], {animate: false});
                }
            }
        }, 33);

        setInterval(function() {
            if (activeFlightId && planeData[activeFlightId]) {
                if (shouldDrawTrail(planeData[activeFlightId])) {
                    showTrail(activeFlightId);
                }
            }
        }, 15000);

        setInterval(cleanStalePlanes, 15000);

        document.getElementById('search-btn').addEventListener('click', doSearch);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        function doSearch() {
            var q = document.getElementById('search-input').value.trim();
            if (!q) return;

            fetch('/api/?action=Search&q=' + encodeURIComponent(q))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    var results = json.response && json.response.data ? json.response.data.results || [] : [];
                    var container = document.getElementById('search-results');
                    
                    if (results.length === 0) {
                        container.innerHTML = '<div class="search-result">No results found</div>';
                    } else {
                        container.innerHTML = results.slice(0, 20).map(function(r) {
                            return '<div class="search-result" onclick="selectSearchResult(\'' + 
                                r.flightId.replace(/'/g, "\\'") + '\')">' +
                                '<span class="sr-call">' + (r.callsign || r.flightId) + '</span> ' +
                                (r.operator ? '(' + r.operator + ')' : '') +
                                '<div class="sr-route">' + htmlEscape(formatRoute(r)) + '</div>' +
                                '</div>';
                        }).join('');
                    }
                    container.style.display = 'block';
                });
        }

        function selectSearchResult(flightId) {
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-input').value = '';
            
            if (planeData[flightId]) {
                var p = planeData[flightId];
                map.setView([p.lat, p.lon], 12);
            }
            startFollow(flightId);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#search-box') && !e.target.closest('#search-results')) {
                document.getElementById('search-results').style.display = 'none';
            }
        });
    </script>
</body>
</html>
