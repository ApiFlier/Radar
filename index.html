                    html += '<span class="mhz">' + htmlEscape(mhz ? mhz + ' MHz' : '—') + '</span>';
                    html += '<span class="desc">' + htmlEscape(desc || '') + '</span>';
                    html += '</div>';
                });

                if (freqs.length > 8) {
                    html += '<div class="apt-row"><span>More</span><span>' + htmlEscape(String(freqs.length - 8)) + ' additional frequencies hidden</span></div>';
                }

                html += '</div>';
            }

            html += '<div class="apt-actions">';
            html += '<a class="apt-action primary" href="/?airport=' + encodeURIComponent(icao || ident || primaryCode) + '">Center Map</a>';
            html += '<a class="apt-action" href="/airports">Airport Dashboard</a>';
            if (website) html += '<a class="apt-action" href="' + htmlEscape(website) + '" target="_blank" rel="noopener">Website</a>';
            if (wiki) html += '<a class="apt-action" href="' + htmlEscape(wiki) + '" target="_blank" rel="noopener">Wikipedia</a>';
            html += '</div>';

            html += '<div class="apt-note">Airport and frequency data is for display only. Verify against official FAA sources before operational use.</div>';

            html += '</div>';
            return html;
        }

        function shouldShowAirport(a) {
            if (!a || isNaN(a.lat) || isNaN(a.lon)) return false;
            if (map.getZoom() < airportMinZoom(a)) return false;
            return map.getBounds().pad(0.2).contains([a.lat, a.lon]);
        }

        function addAirportMarker(a) {
            var id = a.ident || a.code;
            if (!id || airportMarkers[id]) return;

            var marker = L.circleMarker([a.lat, a.lon], {
                radius: a.type === 'large_airport' ? 6 : 4,
                color: airportColor(a),
                weight: 2,
                fillColor: airportColor(a),
                fillOpacity: 0.65,
                opacity: 0.95
            }).on('click', (function(apt) {
                var aptCode = String(apt.ident || apt.gps_code || apt.icao || apt.code || '').toUpperCase();
                return function(e) {
                    if (e.originalEvent && e.originalEvent.shiftKey) {
                        L.popup().setLatLng([apt.lat, apt.lon])
                                 .setContent(airportPopup(apt))
                                 .openOn(map);
                        return;
                    }
                    openAirportPanel(aptCode, apt);
                };
              })(a));

            marker.addTo(airportLayer);
            airportMarkers[id] = marker;
        }

        function removeAirportMarker(id) {
            if (airportMarkers[id]) {
                airportLayer.removeLayer(airportMarkers[id]);
                delete airportMarkers[id];
            }
        }

        function syncAirportMarkers() {
            if (!airportData.length) return;

            var visible = {};
            airportData.forEach(function(a) {
                var id = a.ident || a.code;
                if (!id) return;

                if (shouldShowAirport(a)) {
                    visible[id] = true;
                    addAirportMarker(a);
                }
            });

            for (var id in airportMarkers) {
                if (!visible[id]) removeAirportMarker(id);
            }
        }

        fetch('/static/airports.json')
            .then(function(res) { return res.json(); })
            .then(function(json) {
                airportData = json.airports || [];
                buildAirportLookup();
                syncAirportMarkers();
                syncVisiblePlanes();

                // Apply saved default airport as startup center (no panel, no HUD).
                // Skip when coords were already cached from settings (map started there),
                // or when a URL deep link is present.
                if (!_hasDeepLink) {
                    var defApt = String(_RS.defaultAirport || '').trim().toUpperCase();
                    var _aptCached = !isNaN(parseFloat(_RS.defaultAirportLat)) && !isNaN(parseFloat(_RS.defaultAirportLon));
                    if (defApt && !_aptCached) {
                        var _da = lookupAirport(defApt);
                        if (_da) {
                            var _daLat = parseFloat(_da.lat || _da.latitude || _da.latitude_deg);
                            var _daLon = parseFloat(_da.lon || _da.longitude || _da.longitude_deg);
                            var _daZoom = parseInt(_RS.defaultZoom, 10);
                            if (!isNaN(_daLat) && !isNaN(_daLon)) {
                                map.setView([_daLat, _daLon],
                                    (!isNaN(_daZoom) && _daZoom >= 3 && _daZoom <= 16) ? _daZoom : 10);
                            }
                        }
                    }
                }
            })
            .catch(function(err) {
                console.log('Airport layer failed to load', err);
            });


        var _moveRefreshTimer = null;
        function scheduleBoundsRefresh() {
            clearTimeout(_moveRefreshTimer);
            _moveRefreshTimer = setTimeout(doFullRefresh, 400);
        }

        map.on('moveend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
            scheduleBoundsRefresh();
        });
        map.on('zoomend', function() {
            syncVisiblePlanes();
            syncAirportMarkers();
            updateAllMarkerDensity();
            scheduleBoundsRefresh();
        });

        function updateLabelVisibility() {
            var mapEl = document.getElementById('map');
            if (_RS.showLabels && map.getZoom() >= 9) {
                mapEl.classList.remove('labels-hidden');
            } else {
                mapEl.classList.add('labels-hidden');
            }
        }

        function getMarkerDensityMode() {
            var zoom = map.getZoom();
            if (zoom <= 6) return 'low';
            if (zoom <= 8) return 'medium';
            return 'high';
        }

        function updateAllMarkerDensity() {
            updateLabelVisibility();
            var mode = getMarkerDensityMode();
            if (mode === _lastDensityMode) return;
            _lastDensityMode = mode;
            for (var id in planeMarkers) {
                var p = planeData[id];
                if (!p) continue;
                var color = planeMarkers[id]._lastColor || altColor(p.alt, p.speed);
                planeMarkers[id].setIcon(makePlaneIcon(id, parseFloat(p.heading || 0), color, staleOpacity(p)));
            }
        }
        updateAllMarkerDensity();

        // Initial load — uses the hardened doFullRefresh (defined below)
        doFullRefresh();
        // Apply deep link immediately — airport links resolve as soon as airports.json loads,
        // without waiting for the full aircraft fetch (which can take up to 30s).
        applyDeepLink();

        // SSE stream
        var source = new EventSource('/api/stream');
        source.onmessage = function(event) {
            processPlane(JSON.parse(event.data));
        };
        source.onerror = function() {
            console.log('SSE connection error, will retry...');
        };

        // Periodic full re-fetch — fallback in case SSE is throttled by browser
        setInterval(doFullRefresh, FULL_REFRESH_INTERVAL_MS);
        // Periodic background global refresh — keeps nationwide aircraft fresh
        setInterval(doBackgroundGlobalLoad, GLOBAL_REFRESH_INTERVAL_MS);

        // Re-fetch immediately when user returns to a background tab
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                doFullRefresh();
            }
        });

        setInterval(function() {
            var now = Date.now() / 1000;
            for (var id in planeMarkers) {
                var pd = planeData[id];
                if (!pd) continue;

                var marker    = planeMarkers[id];
                var animActive = marker._moveAnim && marker._moveAnim.active;

                // Skip dead-reckoning while a position animation is in progress so
                // they don't fight each other. pd.lat/pd.lon stay at the accepted
                // real position; after animation ends, dead-reckoning resumes from there.
                if (!animActive) {
                    var age = now - (parseFloat(pd.lastUpdate) || 0);
                    if (shouldDrawTrail(pd) && pd.speed > 10 && age < DEAD_RECKON_MAX_AGE) {
                        var dr = pd.speed * KNOTS_TO_DEG_SEC * 0.033;
                        var rad = pd.heading * Math.PI / 180;
                        pd.lat += dr * Math.cos(rad);
                        pd.lon += dr * Math.sin(rad) / Math.cos(pd.lat * Math.PI / 180);
                        marker.setLatLng([pd.lat, pd.lon]);
                    }
                }

                if (followFlightId === id) {
                    // During animation, follow the marker's animated intermediate position
                    // so the map glides with it rather than jumping to the destination.
                    map.panTo(animActive ? marker.getLatLng() : [pd.lat, pd.lon], {animate: false});
                }
            }
        }, 33);

        setInterval(function() {
            if (activeFlightId && planeData[activeFlightId]) {
                if (shouldDrawTrail(planeData[activeFlightId])) {
                    showTrail(activeFlightId);
                }
            }
        }, 15000);

        setInterval(cleanStalePlanes, 15000);

        var searchSuggestions = [];
        var activeSearchIndex = -1;
        var searchDebounce = null;

        document.getElementById('search-btn').addEventListener('click', function() {
            runSearch(true);
        });

        document.getElementById('search-input').addEventListener('input', function() {
            clearTimeout(searchDebounce);
            var q = this.value.trim();
            if (!q) {
                hideSearchResults();
                return;
            }
            searchDebounce = setTimeout(function() { runSearch(false); }, 180);
        });

        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (searchSuggestions.length) selectSuggestion(Math.max(activeSearchIndex, 0));
                else runSearch(true);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveSearchSelection(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveSearchSelection(-1);
            } else if (e.key === 'Escape') {
                hideSearchResults();
            }
        });

        function hideSearchResults() {
            document.getElementById('search-results').style.display = 'none';
            searchSuggestions = [];
            activeSearchIndex = -1;
        }

        function buildLocalAirportSuggestions(q) {
            var out = [];
            var uq = q.toUpperCase();
            var lq = q.toLowerCase();
            var seen = {};

            if (!airportData || !airportData.length) return out;

            for (var i = 0; i < airportData.length; i++) {
                var a = airportData[i];
                var codes = [a.ident, a.icao, a.gps_code, a.iata_code, a.local_code]
                    .filter(Boolean)
                    .map(function(x) { return String(x).toUpperCase(); });

                var name = String(a.name || '');
                var nameMatch = name.toLowerCase().indexOf(lq) >= 0;
                var codeMatch = codes.some(function(c) { return c === uq || c.indexOf(uq) === 0; });

                if (!nameMatch && !codeMatch) continue;

                var code = codes.find(function(c) { return c === uq; }) || codes[0];
                if (!code || seen[code]) continue;
                seen[code] = true;

                out.push({
                    kind: 'airport',
                    code: code,
                    title: code,
                    subtitle: code + (name ? ' — ' + name : '') + (a.region ? ' · ' + a.region : ''),
                    priority: code === uq ? 0 : 20
                });

                if (out.length >= 8) break;
            }

            return out.sort(function(a, b) {
                return a.priority - b.priority || a.title.localeCompare(b.title);
            });
        }

        function buildLocalAircraftSuggestions(q) {
            var out = [];
            var lq = q.toLowerCase();

            for (var id in planeData) {
                var p = planeData[id];
                if (!p) continue;

                var fields = [
                    p.callsign, p.registration, p.icaoHex, p.flightId, p.operator,
                    p.dep, p.arr, formatRoute(p)
                ].filter(Boolean).join(' ').toLowerCase();

                if (fields.indexOf(lq) < 0) continue;

                out.push({
                    kind: 'aircraft',
                    id: id,
                    title: displayName(p),
                    subtitle: formatRoute(p),
                    priority: 50
                });

                if (out.length >= 12) break;
            }

            return out;
        }

        function renderSearchSuggestions(suggestions) {
            searchSuggestions = suggestions.slice(0, 20);
            activeSearchIndex = searchSuggestions.length ? 0 : -1;

            var container = document.getElementById('search-results');
            if (!searchSuggestions.length) {
                container.innerHTML = '<div class="search-result">No results found</div>';
                container.style.display = 'block';
                return;
            }

            var html = '';
            var lastKind = '';

            searchSuggestions.forEach(function(r, idx) {
                if (r.kind !== lastKind) {
                    lastKind = r.kind;
                    html += '<div class="search-section-label">' + (r.kind === 'airport' ? 'Airports' : 'Aircraft') + '</div>';
                }

                html += '<div class="search-result ' + (idx === activeSearchIndex ? 'active' : '') + '" onclick="selectSuggestion(' + idx + ')">' +
                    '<span class="sr-call">' + htmlEscape(r.title || '') + '</span>' +
                    '<span class="sr-kind">' + htmlEscape(r.kind || '') + '</span>' +
                    '<div class="sr-route">' + htmlEscape(r.subtitle || '') + '</div>' +
                    '</div>';
            });

            container.innerHTML = html;
            container.style.display = 'block';
        }

        function moveSearchSelection(delta) {
            if (!searchSuggestions.length) return;
            activeSearchIndex += delta;
            if (activeSearchIndex < 0) activeSearchIndex = searchSuggestions.length - 1;
            if (activeSearchIndex >= searchSuggestions.length) activeSearchIndex = 0;
            renderSearchSuggestions(searchSuggestions);
        }

        function runSearch(forceApi) {
            var q = document.getElementById('search-input').value.trim();
            if (!q) return;

            var local = buildLocalAirportSuggestions(q).concat(buildLocalAircraftSuggestions(q));
            renderSearchSuggestions(local);

            if (!forceApi && local.length >= 6) return;

            fetch('/api/?action=Search&q=' + encodeURIComponent(q))
                .then(function(res) { return res.json(); })
                .then(function(json) {
                    var results = json.response && json.response.data ? json.response.data.results || [] : [];
                    var extra = [];

                    results.slice(0, 10).forEach(function(r) {
                        var fid = r.flightId || '';
                        if (!fid) return;

                        extra.push({
                            kind: 'aircraft',
                            id: fid,
                            title: r.callsign || r.flightId,
                            subtitle: formatRoute(r),
                            priority: 70
                        });
                    });

                    var merged = local.slice();
                    var seen = {};
                    merged.forEach(function(x) {
                        seen[(x.kind || '') + ':' + (x.code || x.id || x.title)] = true;
                    });
                    extra.forEach(function(x) {
                        var key = (x.kind || '') + ':' + (x.code || x.id || x.title);
                        if (!seen[key]) merged.push(x);
                    });

                    renderSearchSuggestions(merged);
                })
                .catch(function() {
                    // Local results are already shown.
                });
        }

        function doSearch() {
            runSearch(true);
        }

        function selectSuggestion(index) {
            var r = searchSuggestions[index];
            if (!r) return;

            hideSearchResults();
            document.getElementById('search-input').value = '';

            if (r.kind === 'airport') {
                applyAirportDeepLink(r.code);
                openAirportPanel(r.code);
                return;
            }

            if (r.kind === 'aircraft') {
                selectSearchResult(r.id);
            }
        }

        function selectSearchResult(flightId) {
            hideSearchResults();
            document.getElementById('search-input').value = '';

            if (planeData[flightId]) {
                var p = planeData[flightId];
                map.setView([p.lat, p.lon], 12);
                if (!planeMarkers[flightId]) addMarker(flightId);
            }

            startFollow(flightId);
            openAircraftPanel(flightId);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#search-box') && !e.target.closest('#search-results')) {
                document.getElementById('search-results').style.display = 'none';
            }
        });

        /* ── Bounds params for radar view ── */
        function getMapBoundsParams() {
            var b = map.getBounds();
            return 'minLat=' + b.getSouth().toFixed(4) +
                   '&maxLat=' + b.getNorth().toFixed(4) +
                   '&minLon=' + b.getWest().toFixed(4)  +
                   '&maxLon=' + b.getEast().toFixed(4);
        }

        /* ── Bounds-filtered radar refresh ── */
        function doFullRefresh() {
            if (refreshInFlight) return;
            refreshInFlight = true;
            var seq = ++refreshSeqId;

            var controller = new AbortController();
            var abortTimer = setTimeout(function() { controller.abort(); }, FETCH_TIMEOUT_MS);

            var url = '/api/?action=Planes&view=radar&' + getMapBoundsParams() + '&_=' + Date.now();
            fetch(url, { signal: controller.signal })
                .then(function(res) {
                    clearTimeout(abortTimer);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(json) {
                    if (seq !== refreshSeqId) { refreshInFlight = false; return; }
                    refreshInFlight = false;

                    var data   = (json.response && json.response.data) || {};
                    var planes = data.planes || [];
                    var meta   = data.meta   || {};

                    // With bounds filtering, zero results in a remote area is normal — don't guard.
                    // The suspicious-empty guard is removed because totalAvailable is exposed via meta.
                    consecutiveEmptyResponses = 0;

                    var isFirstLoad = (lastGoodRefreshAt === 0);
                    planes.forEach(processPlane);
                    syncVisiblePlanes();

                    if (planes.length > 0) {
                        lastGoodAircraftCount = planes.length;
                        lastGoodRefreshAt = Date.now();
                    }

                    console.debug('[Radar] view=radar returned ' + planes.length +
                        ' / ' + (meta.totalAvailable || '?') + ' total fresh');
                    applyDeepLink();

                    // After the first viewport load completes, start a background global fetch
                    // so aircraft outside the initial viewport are available when the user pans.
                    if (isFirstLoad) setTimeout(doBackgroundGlobalLoad, 1000);
                })
                .catch(function(err) {
                    clearTimeout(abortTimer);
                    if (seq !== refreshSeqId) { refreshInFlight = false; return; }
                    refreshInFlight = false;
                    if (err.name === 'AbortError') {
                        console.warn('[Radar] Refresh timed out after ' + (FETCH_TIMEOUT_MS / 1000) + 's');
                    } else {
                        console.warn('[Radar] Refresh failed:', err.message);
                    }
                    if (lastGoodAircraftCount > 0) {
                        showStatusHUD('Radar refresh failed — showing last known aircraft');
                    }
                });
        }

        /* ── Background global aircraft load ── */
        function doBackgroundGlobalLoad() {
            if (globalLoadInFlight) return;
            if (globalLoadedAt > 0 && (Date.now() - globalLoadedAt) < GLOBAL_REFRESH_INTERVAL_MS) return;
            globalLoadInFlight = true;

            var url = '/api/?action=Planes&view=radar&scope=global&_=' + Date.now();
            fetch(url)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(json) {
                    globalLoadInFlight = false;
                    globalLoadedAt = Date.now();
                    var data   = (json.response && json.response.data) || {};
                    var planes = data.planes || [];
                    var meta   = data.meta   || {};
                    planes.forEach(processPlane);
                    syncVisiblePlanes();
                    console.debug('[Radar] global background: ' + planes.length + ' fresh aircraft; visible: ' + Object.keys(planeMarkers).length);
                })
                .catch(function(err) {
                    globalLoadInFlight = false;
                    console.warn('[Radar] Background global load failed:', err.message);
                });
        }

        function showStatusHUD(message, type) {
            var hud = document.getElementById('status-hud');
            if (!hud) {
                hud = document.createElement('div');
                hud.id = 'status-hud';
                hud.style.cssText = [
                    'position:fixed', 'bottom:64px', 'left:50%', 'transform:translateX(-50%)',
                    'background:rgba(0,0,0,0.85)',
                    'border-radius:6px', 'padding:9px 18px', 'font-size:12px',
                    'font-family:"Segoe UI",sans-serif',
                    'z-index:9999', 'cursor:pointer', 'white-space:nowrap',
                    'box-shadow:0 2px 12px rgba(0,0,0,0.5)'
                ].join(';');
                hud.onclick = function() { this.style.display = 'none'; };
                document.body.appendChild(hud);
            }
            var isInfo = type === 'info';
            hud.style.color  = isInfo ? '#00ffcc' : '#fa5';
            hud.style.border = '1px solid ' + (isInfo ? 'rgba(0,255,204,0.3)' : 'rgba(255,170,85,0.35)');
            hud.textContent = message;
            hud.style.display = 'block';
            if (hud._timer) clearTimeout(hud._timer);
            hud._timer = setTimeout(function() { hud.style.display = 'none'; }, 8000);
        }

        /* ── Deep-link support: /?icao=HEX, /?callsign=CALL, /?airport=CODE ── */
        function applyDeepLink() {
            // Guard: runs at most once per page load regardless of how many refreshes fire
            if (deepLinkApplied) return;
            deepLinkApplied = true;

            var params       = new URLSearchParams(window.location.search);
            var icaoParam    = (params.get('icao')     || '').toUpperCase().trim();
            var callParam    = (params.get('callsign') || '').toUpperCase().trim();
            var airportParam = (params.get('airport')  || '').toUpperCase().trim();
            var focusParam   = params.get('focus') === '1';

            if (!icaoParam && !callParam && !airportParam) return;

            // Airport deep-link — center map; does not require aircraft data
            if (airportParam) {
                showStatusHUD('Finding airport ' + airportParam + '…', 'info');
                applyAirportDeepLink(airportParam, focusParam);
                return;
            }

            showStatusHUD('Finding aircraft ' + (icaoParam || callParam) + '…', 'info');

            // Immediately fetch view=target so the aircraft appears in planeData even if it
            // is outside the current map bounds (which the radar view would exclude).
            var targetQs = '/api/?action=Planes&view=target&_=' + Date.now();
            if (icaoParam)  targetQs += '&icao='     + encodeURIComponent(icaoParam);
            if (callParam)  targetQs += '&callsign=' + encodeURIComponent(callParam);
            fetch(targetQs)
                .then(function(r) { return r.json(); })
                .then(function(json) {
                    var pl = (json.response && json.response.data && json.response.data.planes) || [];
                    pl.forEach(processPlane);
                })
                .catch(function() {});

            // Retry loop — will find the aircraft once processPlane() stores it
            var attempts = 0;
            var maxAttempts = 8;
            function findAndFocus() {
                var targetId = null;
                for (var id in planeData) {
                    var pd = planeData[id];
                    if (icaoParam && (pd.icaoHex || '').toUpperCase() === icaoParam) { targetId = id; break; }
                    if (callParam && (pd.callsign || '').toUpperCase() === callParam) { targetId = id; break; }
                }
                if (targetId) {
                    var pd = planeData[targetId];
                    map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 12));
                    // Allow moveend / syncVisiblePlanes to run before opening popup
                    setTimeout(function() {
                        if (!planeMarkers[targetId]) addMarker(targetId);
                        startFollow(targetId);
                        openAircraftPanel(targetId);
                    }, 350);
                    return;
                }
                if (++attempts < maxAttempts) {
                    setTimeout(findAndFocus, 1500);
                } else {
                    showDeepLinkHUD(icaoParam || callParam, false);
                }
            }
            findAndFocus();
        }

        function applyAirportDeepLink(code, autoFocus) {
            function doCenter() {
                var a = lookupAirport(code);
                if (!a) return false;
                var lat = parseFloat(a.lat || a.latitude || a.latitude_deg);
                var lon = parseFloat(a.lon || a.longitude || a.longitude_deg);
                if (isNaN(lat) || isNaN(lon)) return false;
                var zoom = (a.type === 'large_airport' || a.type === 'medium_airport') ? 11 : 12;
                map.setView([lat, lon], zoom);
                var label = code + (a.name ? ' — ' + a.name : '');
                showStatusHUD('Centered on ' + label, 'info');
                openAirportPanel(code, a);
                if (autoFocus) setTimeout(function() { enterAirportFocus(code); }, 200);
                return true;
            }

            // If airport data already loaded, apply immediately
            if (airportData.length > 0) {
                if (!doCenter()) showDeepLinkHUD('Airport ' + code + ' not found', false);
                return;
            }

            // Airport JSON is still loading — retry up to 10 times at 400 ms
            var retries = 0;
            function tryLater() {
                if (airportData.length > 0) {
                    if (!doCenter()) showDeepLinkHUD('Airport ' + code + ' not found', false);
                    return;
                }
                if (++retries < 10) {
                    setTimeout(tryLater, 400);
                } else {
                    showDeepLinkHUD('Airport ' + code + ' — data unavailable', false);
                }
            }
            setTimeout(tryLater, 400);
        }

        function showDeepLinkHUD(label, found) {
            var hud = document.getElementById('deeplink-hud');
            if (!hud) {
                hud = document.createElement('div');
                hud.id = 'deeplink-hud';
                hud.style.cssText = [
                    'position:fixed', 'bottom:24px', 'left:50%', 'transform:translateX(-50%)',
                    'background:rgba(0,0,0,0.85)', 'border:1px solid rgba(255,153,119,0.35)',
                    'border-radius:6px', 'padding:9px 18px', 'font-size:12px',
                    'font-family:"Segoe UI",sans-serif', 'color:#f97',
                    'z-index:9999', 'cursor:pointer', 'white-space:nowrap',
                    'box-shadow:0 2px 12px rgba(0,0,0,0.5)'
                ].join(';');
                hud.onclick = function() { this.style.display = 'none'; };
                document.body.appendChild(hud);
            }
            hud.textContent = 'Aircraft "' + label + '" is not currently mappable — no live position in feed. May be stale or out of range. Click to dismiss.';
            hud.style.display = 'block';
            setTimeout(function() { if (hud) hud.style.display = 'none'; }, 8000);
        }

        /* ── Popup helpers (Shift+Click or panel Popup button) ── */
        function openAircraftPopup(flightId) {
            var p = planeData[flightId];
            var m = planeMarkers[flightId];
            if (!p || !m) return;
            L.popup().setLatLng(m.getLatLng()).setContent(popupContent(p)).openOn(map);
        }

        function openAirportPopup(code) {
            var a = lookupAirport(code);
            if (!a) return;
            var lat = parseFloat(a.lat || a.latitude_deg);
            var lon = parseFloat(a.lon || a.longitude_deg);
            if (isNaN(lat) || isNaN(lon)) return;
            L.popup().setLatLng([lat, lon]).setContent(airportPopup(a)).openOn(map);
        }

        /* ── Side detail panel ── */
        var selectedAcId   = null;
        var selectedAptCode = null;
        var selectedAptObj  = null;
        var panelMode       = null;   // 'aircraft' | 'airport' | null
        var aptFlightsCache = {};     // code → {ts, inbound, outbound}
        var APT_FLIGHTS_TTL = 45000;  // ms throttle between re-fetches

        // Airport Focus / Ops Mode state
        var focusAirportCode = null;  // ICAO/IATA code, or null when not focused
        var focusRings       = [];    // Leaflet circle layers for radius rings
        var focusBadgeEl     = null;  // DOM element for the focus HUD badge
        var focusAptLat      = NaN;   // focused airport lat (for alert distance calcs)
        var focusAptLon      = NaN;   // focused airport lon
        var focusAlerts      = [];    // [{type, id, callsign, text, ts}] — session-only
        var _focusSeenIn     = {};    // id -> true: aircraft already seen inside inbound radius
        var _focusSeenEmg    = {};    // id -> emgKey: suppress repeat emergency alerts

        function openPanel() {
            document.getElementById('detail-panel').classList.add('open');
            document.body.classList.add('panel-open');
        }

        function closePanel() {
            selectedAcId    = null;
            selectedAptCode = null;
            selectedAptObj  = null;
            panelMode       = null;
            document.getElementById('detail-panel').classList.remove('open');
            document.body.classList.remove('panel-open');
            document.getElementById('dp-body').innerHTML = '';
        }

        /* ── Aircraft panel ── */
        function openAircraftPanel(flightId) {
            selectedAcId    = flightId;
            selectedAptCode = null;
            selectedAptObj  = null;
            panelMode       = 'aircraft';
            document.getElementById('dp-mode-label').textContent = 'Aircraft';
            openPanel();
            renderAircraftPanel();
        }

        function renderAircraftPanel() {
            if (panelMode !== 'aircraft' || !selectedAcId) return;
            document.getElementById('dp-body').innerHTML =
                buildAircraftPanelHTML(planeData[selectedAcId], selectedAcId);
        }

        function buildAircraftPanelHTML(p, flightId) {
            if (!p) {
                if (_RS.showInferredWarnings) {
                    return '<div class="dp-stale">Not in current feed — data unavailable</div>' +
                           '<div class="dp-empty">Aircraft may have landed or left range.</div>';
                }
                return '<div class="dp-empty">Aircraft not in current feed.</div>';
            }

            var name         = displayName(p);
            var route        = formatRoute(p);
            var airline      = airlineInfo(p);
            var acClass      = displayAircraftClass(p);
            var state        = aircraftDisplayState(p);
            var stateLbl     = stateLabel(state);
            var icao         = String(p.icaoHex || '').trim().toUpperCase();
            var csRaw        = String(p.callsign || p.flight || '').trim().replace(/\s+/g, '');
            var isFollowing  = (followFlightId === flightId);

            var acClassLower = acClass.toLowerCase();
            var acClassDisplay = acClass.charAt(0).toUpperCase() + acClass.slice(1);

            var tags = [];
            if (boolField(p.isMilitary)  && acClassLower !== 'military')  tags.push('Military');
            if (boolField(p.isHelicopter) && acClassLower !== 'helicopter') tags.push('Helicopter');
            if (boolField(p.isPia))        tags.push('PIA');
            if (boolField(p.isLadd))       tags.push('LADD');

            var subtitle = airline ? airline.display : (p.operator || p.registration || '');

            var html = '';

            html += '<div class="dp-ac-head">';
            html += '<div class="dp-ac-name">' + htmlEscape(name) + '</div>';
            if (subtitle) html += '<div class="dp-ac-sub">' + htmlEscape(subtitle) + '</div>';
            if (stateLbl) html += '<div class="dp-badge">' + htmlEscape(stateLbl) + '</div>';
            html += '</div>';

            if (route !== 'Route unavailable') {
                html += '<div class="dp-route">' + htmlEscape(route) + '</div>';
            }

            function fmtAlt(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n).toLocaleString() + ' ft'; }
            function fmtSpd(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n) + ' kt'; }
            function fmtHdg(v) { var n = parseFloat(v); return isNaN(n) ? '—' : Math.round(n) + '°'; }

            html += '<div class="dp-grid-3">';
            html += '<div class="dp-cell"><div class="dp-cell-label">Altitude</div><div class="dp-cell-value accent">' + htmlEscape(fmtAlt(p.alt)) + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Speed</div><div class="dp-cell-value">' + htmlEscape(fmtSpd(p.speed)) + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Heading</div><div class="dp-cell-value">' + htmlEscape(fmtHdg(p.heading)) + '</div></div>';
            html += '</div>';

            function dpRow(label, value) {
                if (value === null || value === undefined || value === '') return '';
                return '<div class="dp-row"><span class="dp-row-label">' + htmlEscape(label) +
                       '</span><span class="dp-row-value">' + value + '</span></div>';
            }

            html += '<div class="dp-section">';
            var vr = parseFloat(p.verticalRate);
            if (!isNaN(vr) && Math.abs(vr) >= 100) {
                html += dpRow('V/S', htmlEscape((vr > 0 ? '+' : '') + Math.round(vr).toLocaleString() + ' fpm'));
            }
            var aAlt = parseFloat(p.assignedAlt);
            if (!isNaN(aAlt) && aAlt > 0 && Math.abs((parseFloat(p.alt) || 0) - aAlt) > 300) {
                html += dpRow('Assigned Alt', htmlEscape(fmtAlt(p.assignedAlt)));
            }
            if (airline) html += dpRow('Airline', htmlEscape(airline.airline));
            if (p.registration) {
                html += dpRow('Registration',
                    '<span style="font-family:Consolas,Menlo,monospace">' + htmlEscape(p.registration) + '</span>');
            }
            if (p.aircraftType) html += dpRow('Type', htmlEscape(p.aircraftType));
            html += dpRow('Class', htmlEscape(acClassDisplay));
            if (tags.length) html += dpRow('Tags', htmlEscape(tags.join(' · ')));
            if (icao) {
                html += dpRow('ICAO',
                    '<span style="font-family:Consolas,Menlo,monospace">' + htmlEscape(icao) + '</span>');
            }
            var sq = String(p.squawk || '').trim();
            if (sq && sq !== '0') {
                var sqHtml = htmlEscape(sq);
                if (sq === '7500') sqHtml += ' <span style="color:#ff6060;font-weight:700">HIJACK</span>';
                else if (sq === '7600') sqHtml += ' <span style="color:#f5a623;font-weight:700">RADIO FAIL</span>';
                else if (sq === '7700') sqHtml += ' <span style="color:#ff6060;font-weight:700">EMERGENCY</span>';
                html += dpRow('Squawk', sqHtml);
            }
            html += '</div>';

            var posLabel   = friendlySource(p.positionSource || p.source);
            var routeLabel = friendlySource(p.enrichmentSource);
            if (_RS.showRawSources && (posLabel || routeLabel || p.sourceFacility)) {
                html += '<div class="dp-section dp-section-dim">';
                if (posLabel) html += dpRow('Position', htmlEscape(posLabel));
                if (routeLabel && routeLabel !== posLabel) html += dpRow('Route data', htmlEscape(routeLabel));
                if (p.sourceFacility) html += dpRow('Facility', htmlEscape(p.sourceFacility));
                html += '</div>';
            }

            var _fnLabel = freshnessLabel(p);
            var _fnCls   = freshnessClass(_fnLabel);
            var _posName = friendlySource(p.positionSource || p.source);
            var _ageStr  = formatAge(p);
            html += '<div class="dp-data-line">';
            html += '<span class="freshness-badge ' + _fnCls + '">' + htmlEscape(_fnLabel) + '</span>';
            html += '<span>' + htmlEscape((_posName ? _posName + ' · ' : '') + _ageStr) + '</span>';
            html += '</div>';

            var fid = String(flightId || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            html += '<div class="dp-actions">';
            if (isFollowing) {
                html += '<button class="dp-action primary" onclick="stopFollow();renderAircraftPanel()">Stop Follow</button>';
            } else {
                html += '<button class="dp-action primary" onclick="startFollow(\'' + fid + '\');renderAircraftPanel()">Follow</button>';
            }
            html += '<button class="dp-action" onclick="openAircraftPopup(\'' + fid + '\')">Popup</button>';
            if (icao) {
                html += '<a class="dp-action" href="https://globe.adsbexchange.com/?icao=' +
                        htmlEscape(icao.toLowerCase()) + '" target="_blank" rel="noopener">ADSBx</a>';
            }
            if (csRaw && airline) {
                html += '<a class="dp-action" href="https://flightaware.com/live/flight/' +
                        htmlEscape(csRaw) + '" target="_blank" rel="noopener">FlightAware</a>';
            }
            if (navigator && navigator.clipboard) {
                if (icao) {
                    html += '<button class="dp-action" onclick="var b=this;navigator.clipboard.writeText(\'' +
                            htmlEscape(icao) + '\').then(function(){b.textContent=\'Copied\';' +
                            'setTimeout(function(){b.textContent=\'Copy ICAO\';},1500)})">Copy ICAO</button>';
                } else if (csRaw) {
                    html += '<button class="dp-action" onclick="var b=this;navigator.clipboard.writeText(\'' +
                            htmlEscape(csRaw) + '\').then(function(){b.textContent=\'Copied\';' +
                            'setTimeout(function(){b.textContent=\'Copy Callsign\';},1500)})">Copy Callsign</button>';
                }
            }
            html += '</div>';

            return html;
        }

        /* ── Airport panel ── */
        function openAirportPanel(code, airportObj) {
            code = String(code || '').toUpperCase().trim();
            if (!code) return;
            selectedAcId    = null;
            selectedAptCode = code;
            selectedAptObj  = airportObj || lookupAirport(code) || null;
            panelMode       = 'airport';
            document.getElementById('dp-mode-label').textContent = 'Airport';
            openPanel();
            renderAirportPanel();
            fetchAptFlights(code);

            var lat = selectedAptObj ? (selectedAptObj.lat || selectedAptObj.latitude || selectedAptObj.latitude_deg) : null;
            var lon = selectedAptObj ? (selectedAptObj.lon || selectedAptObj.longitude || selectedAptObj.longitude_deg) : null;
            fetchAptWeather(code, lat, lon);
            fetchAptNotams(code);
        }

        function renderAirportPanel() {
            if (panelMode !== 'airport' || !selectedAptCode) return;
            var code = selectedAptCode;
            document.getElementById('dp-body').innerHTML = buildAirportPanelHTML(selectedAptObj, code);
            
            var fCache = aptFlightsCache[code];
            if (fCache && fCache.inbound !== undefined) {
                renderAptFlightsInPanel(code, fCache.inbound, fCache.outbound);
            }
            
            var wCache = aptWeatherCache[code];
            if (wCache && wCache.data !== undefined) {
                renderAptWeatherInPanel(code, wCache.data);
            }

            var nCache = aptNotamsCache[code];
            if (nCache && nCache.data !== undefined) {
                renderAptNotamsInPanel(code, nCache.data);
            }
        }

        function buildAirportPanelHTML(a, code) {
            function esc(v) { return htmlEscape(v); }
            function clean(v) { return String(v || '').trim(); }

            var html = '';

            if (!a) {
                html += '<div class="dp-apt-head"><div class="dp-apt-code">' + esc(code) + '</div></div>';
                var _simFocused = focusAirportCode === code;
                html += '<div class="dp-actions">';
                html += _simFocused
                    ? '<button class="dp-action focus-active" onclick="exitAirportFocus()">Exit Focus</button>'
                    : '<button class="dp-action" onclick="enterAirportFocus(\'' + htmlEscape(code) + '\')">Focus Airport</button>';
                html += '</div>';
                html += '<div class="dp-flights-box" id="dp-flights-' + esc(code) +
                        '"><div class="dp-flights-loading">Loading…</div></div>';
                return html;
            }

            var iata     = clean(a.iata_code || a.iata).toUpperCase();
            var icao     = clean(a.gps_code || a.icao || a.ident).toUpperCase();
            var local    = clean(a.local_code).toUpperCase();
            var gps      = clean(a.gps_code).toUpperCase();
            var name     = clean(a.name) || 'Airport';
            var muni     = clean(a.municipality || a.city);
            var region   = clean(a.region || a.iso_region);
            var country  = clean(a.iso_country || a.country);
            var elev     = clean(a.elevation_ft || a.elevation);
            var type     = clean(a.type).replace(/_/g, ' ');
            var website  = clean(a.home_link || a.website || a.url);
            var wiki     = clean(a.wikipedia_link);
            var loc      = [muni, region || country].filter(Boolean).join(' · ');

            html += '<div class="dp-apt-head">';
            html += '<div class="dp-apt-code">' + esc(code) + '</div>';
            html += '<div class="dp-apt-name">' + esc(name) + '</div>';
            if (loc) html += '<div class="dp-apt-region">' + esc(loc) + '</div>';
            html += '</div>';

            html += '<div class="dp-grid-3">';
            html += '<div class="dp-cell"><div class="dp-cell-label">IATA</div>' +
                    '<div class="dp-cell-value' + (iata ? ' accent' : '') + '">' + esc(iata || '—') + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">ICAO</div>' +
                    '<div class="dp-cell-value' + (icao ? ' accent' : '') + '">' + esc(icao || code || '—') + '</div></div>';
            html += '<div class="dp-cell"><div class="dp-cell-label">Elevation</div>' +
                    '<div class="dp-cell-value">' + esc(elev ? elev + ' ft' : '—') + '</div></div>';
            html += '</div>';

            html += '<div id="dp-weather-box" class="dp-wx-box"><div class="dp-flights-loading">Loading weather…</div></div>';
            html += '<div id="dp-notam-box" class="dp-nt-box"><div class="dp-flights-loading">Loading NOTAMs…</div></div>';

            function dpRow(label, val) {
                if (!val) return '';
                return '<div class="dp-row"><span class="dp-row-label">' + esc(label) +
                       '</span><span class="dp-row-value">' + esc(val) + '</span></div>';
            }

            html += '<div class="dp-section">';
            if (type) html += dpRow('Type', type.replace(/\b\w/g, function(c) { return c.toUpperCase(); }));
            if (local) html += dpRow('Local', local);
            if (gps && gps !== icao) html += dpRow('GPS', gps);
            if (region) html += dpRow('Region', region);
            html += '</div>';

            var freqs = Array.isArray(a.frequencies) ? a.frequencies : [];
            if (freqs.length) {
                html += '<div class="dp-section">';
                html += '<div class="dp-section-title">Frequencies</div>';
                freqs.slice(0, 8).forEach(function(f) {
                    var fType = clean(f.type || f.frequency_type || f.name).toUpperCase();
                    var mhz   = clean(f.frequency_mhz || f.mhz || f.freq || f.frequency);
                    var desc  = clean(f.description || f.desc || f.use || f.name);
                    html += '<div class="dp-freq">';
                    html += '<span class="dp-freq-type">' + esc(fType || '—') + '</span>';
                    html += '<span class="dp-freq-mhz">' + esc(mhz ? mhz + ' MHz' : '—') + '</span>';
                    html += '<span class="dp-freq-desc">' + esc(desc || '') + '</span>';
                    html += '</div>';
                });
                if (freqs.length > 8) {
                    html += '<div style="font-size:10px;color:#444;margin-top:4px">+' +
                            esc(String(freqs.length - 8)) + ' more</div>';
                }
                html += '</div>';
            }

            var aptCode = icao || code;
            var isFocused = focusAirportCode === aptCode || focusAirportCode === code;
            html += '<div class="dp-actions">';
            html += '<button class="dp-action primary" onclick="applyAirportDeepLink(\'' +
                    htmlEscape(aptCode) + '\')">Center Map</button>';
            html += isFocused
                ? '<button class="dp-action focus-active" onclick="exitAirportFocus()">Exit Focus</button>'
                : '<button class="dp-action" onclick="enterAirportFocus(\'' + htmlEscape(aptCode) + '\')">Focus Airport</button>';
            html += '<button class="dp-action" onclick="openAirportPopup(\'' + htmlEscape(aptCode) + '\')">Popup</button>';
            html += '<a class="dp-action" href="/airports">Airports</a>';
            if (website) html += '<a class="dp-action" href="' + esc(website) + '" target="_blank" rel="noopener">Website</a>';
            if (wiki)    html += '<a class="dp-action" href="' + esc(wiki) + '" target="_blank" rel="noopener">Wikipedia</a>';
            html += '</div>';

            html += '<div class="dp-flights-box" id="dp-flights-' + esc(code) +
                    '"><div class="dp-flights-loading">Loading aircraft…</div></div>';

            return html;
        }

        function fetchAptFlights(code) {
            var now   = Date.now();
            var cache = aptFlightsCache[code];
            if (cache && (now - cache.ts) < APT_FLIGHTS_TTL) {
                if (selectedAptCode === code && panelMode === 'airport') {
                    renderAptFlightsInPanel(code, cache.inbound, cache.outbound);
                }
                return;
            }
            fetch('/api/?action=Planes&view=airport&airport=' + encodeURIComponent(code) + '&_=' + now)
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(json) {
                    var data     = ((json.response || {}).data) || {};
                    var inbound  = data.inbound  || [];
                    var outbound = data.outbound || [];
                    aptFlightsCache[code] = { ts: Date.now(), inbound: inbound, outbound: outbound };
                    if (selectedAptCode === code && panelMode === 'airport') {
                        renderAptFlightsInPanel(code, inbound, outbound);
                    }
                })
                .catch(function() {
                    var box = document.getElementById('dp-flights-' + code);
                    if (box) box.innerHTML = '<div class="dp-flights-loading" style="color:#555">Aircraft data unavailable</div>';
                });
        }

        function renderAptFlightsInPanel(code, inbound, outbound) {
            var box = document.getElementById('dp-flights-' + code);
            if (!box) return;

            if (!inbound.length && !outbound.length) {
                box.innerHTML = '<div class="dp-flights-loading" style="color:#555">No active aircraft for ' +
                                htmlEscape(code) + '</div>';
                return;
            }

            var aptObj   = selectedAptObj || lookupAirport(code) || null;
            var aptLat   = aptObj ? parseFloat(aptObj.lat || aptObj.latitude || aptObj.latitude_deg) : NaN;
            var aptLon   = aptObj ? parseFloat(aptObj.lon || aptObj.longitude || aptObj.longitude_deg) : NaN;
            var hasAptPos = !isNaN(aptLat) && !isNaN(aptLon);

            function calcDist(p) {
                if (!hasAptPos) return NaN;
                var pLat = parseFloat(p.lat), pLon = parseFloat(p.lon);
                if (isNaN(pLat) || isNaN(pLon) || (pLat === 0 && pLon === 0)) return NaN;
                return distanceNm(pLat, pLon, aptLat, aptLon);
            }

            function fmtNm(d) {
                if (!isFinite(d) || d < 0) return '—';
                return d < 10 ? d.toFixed(1) + ' nm' : Math.round(d) + ' nm';
            }

            function fmtEta(minutes) {
                if (!isFinite(minutes) || minutes < 0) return '—';
                if (minutes < 2) return 'Nearby';
                var h = Math.floor(minutes / 60), m = Math.round(minutes % 60);
                var clock = new Date(Date.now() + minutes * 60000);
                var clockStr = clock.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                return (h ? h + 'h ' : '') + m + 'm (~' + clockStr + ')';
            }

            function vTrend(vr) {
                var v = parseFloat(vr);
                if (isNaN(v)) return '—';
                if (v > 300) return '↑ Climbing';
                if (v < -300) return '↓ Descending';
                return '→ Level';
            }

            function buildRow(p, isInbound) {
                var icaoHex = (p.icaoHex || '').toUpperCase();
                var cs      = (p.callsign || '').trim();
                var call    = (cs && cs !== icaoHex) ? cs : (p.registration || p.flightId || icaoHex || '—');
                var dep     = (p.dep || '').trim().toUpperCase();
                var arr     = (p.arr || '').trim().toUpperCase();
                var rt      = (dep && arr) ? dep + '→' + arr : dep ? dep + '→?' : arr ? '?→' + arr : '—';
                var altN    = parseFloat(p.alt);
                var altStr  = (!isNaN(altN) && altN > 0) ? Math.round(altN).toLocaleString() + ' ft' : '—';
                var dist    = calcDist(p);
                var distStr = fmtNm(dist);
                var link    = icaoHex ? '/?icao=' + encodeURIComponent(icaoHex) : '';
                var ageStr  = formatAge(p);
                var meta;
                if (isInbound) {
                    var spd = parseFloat(p.speed);
                    var eta = (isFinite(dist) && isFinite(spd) && spd >= 80) ? fmtEta(dist / spd * 60) : null;
                    meta = distStr + ' · ' + altStr + ' · ' + vTrend(p.verticalRate) +
                           (eta ? ' · ETA est. ' + eta : '') + (ageStr ? ' · ' + ageStr : '');
                } else {
                    var isAir  = String(p.airborne) === '1' || parseFloat(p.speed) > 40;
                    var spdN   = parseFloat(p.speed);
                    var spdStr = (!isNaN(spdN) && spdN > 0) ? Math.round(spdN) + ' kt' : '';
                    meta = distStr + ' · ' + (isAir ? 'Airborne · ' + vTrend(p.verticalRate) : 'Ground') +
                           ' · ' + altStr + (spdStr ? ' · ' + spdStr : '') + (ageStr ? ' · ' + ageStr : '');
                }
                return '<div class="dp-flight-entry">' +
                       '<div class="dp-flight-top">' +
                       '<span class="dp-flight-call">' + htmlEscape(call) + '</span>' +
                       '<span class="dp-flight-route">' + htmlEscape(rt) + '</span>' +
                       (link ? '<a class="dp-flight-link" href="' + htmlEscape(link) + '">Radar</a>' : '<span></span>') +
                       '</div>' +
                       '<div class="dp-flight-bot">' + htmlEscape(meta) + '</div>' +
                       '</div>';
            }

            function groupHtml(list, label, isInbound) {
                if (!list.length) return '';
                var h = '<div class="dp-flights-group">';
                h += '<div class="dp-flights-group-title">' + htmlEscape(label) +
                     ' <span style="color:#444;font-weight:400">(' + list.length + ')</span></div>';
                list.slice(0, 15).forEach(function(p) { h += buildRow(p, isInbound); });
                if (list.length > 15) {
                    h += '<div style="font-size:10px;color:#444;padding:4px 0">+' +
                         (list.length - 15) + ' more</div>';
                }
                h += '</div>';
                return h;
            }

            var html = '<div class="dp-flights-counts">';
            html += '<span style="color:#aaa">' + inbound.length  + ' inbound</span>';
            html += '<span style="color:#444">·</span>';
            html += '<span style="color:#aaa">' + outbound.length + ' outbound</span>';
            html += '</div>';
            html += groupHtml(inbound,  'Inbound to '    + code, true);
            html += groupHtml(outbound, 'Outbound from ' + code, false);
            if (inbound.length) {
                html += '<div class="dp-flights-disclaimer">ETA est. from live position and groundspeed. Not official airline schedule data.</div>';
            }

            box.innerHTML = html;
        }

        /* ── Airport Weather ── */
        var aptWeatherCache = {};
        var APT_WEATHER_TTL = 10 * 60 * 1000; // 10 minutes

        function fetchAptWeather(code, lat, lon) {
            var now = Date.now();
            var cache = aptWeatherCache[code];
            if (cache && (now - cache.ts) < APT_WEATHER_TTL) {
                if (selectedAptCode === code && panelMode === 'airport') {
                    renderAptWeatherInPanel(code, cache.data);
                }
                return;
            }

            var url = '/api/?action=Weather&airport=' + encodeURIComponent(code);
            if (lat != null && lon != null) {
                url += '&lat=' + lat + '&lon=' + lon;
            }
            url += '&_=' + now;

            fetch(url)
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(json) {
                    var data = (json.response || {}).data || null;
                    aptWeatherCache[code] = { ts: Date.now(), data: data };
                    if (selectedAptCode === code && panelMode === 'airport') {
                        renderAptWeatherInPanel(code, data);
                    }
                })
                .catch(function() {
                    if (selectedAptCode === code && panelMode === 'airport') {
                        var el = document.getElementById('dp-weather-box');
                        if (el) el.innerHTML = '<div class="dp-flights-loading" style="color:#555">Weather unavailable</div>';
                    }
                });
        }

        function renderAptWeatherInPanel(code, data) {
            var el = document.getElementById('dp-weather-box');
            if (!el) return;
            if (!data) {
                el.innerHTML = '<div class="dp-flights-loading" style="color:#555">Weather unavailable</div>';
                return;
            }

            var esc = htmlEscape;
            var html = '';

            html += '<div class="dp-wx-head">';
            html += '<div class="dp-wx-title">Airport Weather</div>';
            if (data.metar && data.metar.flightCategory) {
                html += '<div class="dp-wx-cat ' + esc(data.metar.flightCategory) + '">' + esc(data.metar.flightCategory) + '</div>';
            }
            html += '</div>';

            if (data.metar && data.metar.raw) {
                html += '<div class="dp-wx-metar">' + esc(data.metar.raw) + '</div>';

                html += '<div class="dp-wx-grid">';
                html += '<div class="dp-wx-field"><span class="dp-wx-label">Wind</span><span class="dp-wx-value">' + esc(data.metar.wind || '—') + '</span></div>';
                html += '<div class="dp-wx-field"><span class="dp-wx-label">Visibility</span><span class="dp-wx-value">' + esc(data.metar.visibility || '—') + '</span></div>';
                html += '<div class="dp-wx-field"><span class="dp-wx-label">Ceiling</span><span class="dp-wx-value">' + esc(data.metar.ceiling || '—') + '</span></div>';
                html += '<div class="dp-wx-field"><span class="dp-wx-label">Altimeter</span><span class="dp-wx-value">' + esc(data.metar.altimeter || '—') + '</span></div>';
                html += '</div>';
            } else {
                html += '<div class="dp-flights-loading" style="color:#555;padding:5px 0">METAR unavailable</div>';
            }

            if (data.alerts && data.alerts.length) {
                html += '<div class="dp-wx-alerts">';
                data.alerts.forEach(function(a) {
                    html += '<div class="dp-wx-alert">' + esc(a.event || 'Weather Alert') + '</div>';
                });
                html += '</div>';
            }

            if (data.taf && data.taf.raw) {
                html += '<div class="dp-wx-taf-wrap">';
                html += '<div class="dp-wx-taf-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">Show TAF</div>';
                html += '<div class="dp-wx-taf-raw">' + esc(data.taf.raw) + '</div>';
                html += '</div>';
            }

            html += '<div class="dp-wx-advisory">' + esc(data.advisory) + '</div>';

            el.innerHTML = html;
        }

        /* ── Airport NOTAMs ── */
        var aptNotamsCache = {};
        var APT_NOTAMS_TTL = 10 * 60 * 1000; // 10 minutes

        function fetchAptNotams(code) {
            var now = Date.now();
            var cache = aptNotamsCache[code];
            if (cache && (now - cache.ts) < APT_NOTAMS_TTL) {
                if (selectedAptCode === code && panelMode === 'airport') {
                    renderAptNotamsInPanel(code, cache.data);
                }
                return;
            }

            fetch('/api/?action=Notams&airport=' + encodeURIComponent(code) + '&_=' + now)
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(json) {
                    var data = (json.response || {}).data || null;
                    aptNotamsCache[code] = { ts: Date.now(), data: data };
                    if (selectedAptCode === code && panelMode === 'airport') {
                        renderAptNotamsInPanel(code, data);
                    }
                })
                .catch(function() {
                    if (selectedAptCode === code && panelMode === 'airport') {
                        var el = document.getElementById('dp-notam-box');
                        if (el) el.innerHTML = '<div class="dp-flights-loading" style="color:#555">NOTAMs unavailable</div>';
                    }
                });
        }

        function renderAptNotamsInPanel(code, data) {
            var el = document.getElementById('dp-notam-box');
            if (!el) return;
            if (!data) {
                el.innerHTML = '<div class="dp-flights-loading" style="color:#555">NOTAMs unavailable</div>';
                return;
            }

            var esc = htmlEscape;
            var html = '';

            html += '<div class="dp-nt-head">';
            html += '<div class="dp-nt-title">NOTAMs</div>';
            html += '</div>';

            if (!data.configured) {
                html += '<div class="dp-nt-msg">NOTAM source not configured</div>';
                html += '<div class="dp-nt-planned">Real FAA FNS/SWIM NOTAM ingestion is planned for a future phase.</div>';
                if (data.officialUrl) {
                    html += '<a class="dp-nt-action" href="' + esc(data.officialUrl) + '" target="_blank" rel="noopener">Open Official NOTAM Search</a>';
                }
            } else if (data.notams && data.notams.length) {
                // Future placeholder for rendering real NOTAMs
                data.notams.forEach(function(n) {
                    html += '<div class="dp-flight-entry" style="border-bottom:1px solid rgba(255,255,255,0.03);padding:6px 0">';
                    html += '<div style="font-size:10px;color:#888;margin-bottom:2px">' + esc(n.category || 'NOTAM') + '</div>';
                    html += '<div style="font-size:11px;color:#bbb;line-height:1.4">' + esc(n.text || '') + '</div>';
                    html += '</div>';
                });
            } else {
                html += '<div class="dp-nt-msg" style="color:#444">No active NOTAMs found.</div>';
            }

            html += '<div class="dp-wx-advisory" style="margin-top:10px">' + esc(data.advisory) + '</div>';

            el.innerHTML = html;
        }

        /* ── Airport Focus / Ops Mode ─────────────────────────────────────────── */

        function isRelatedToFocus(id) {
            if (!focusAirportCode) return true;
            var pd = planeData[id];
            if (!pd) return false;
            var dep = (pd.dep || '').trim().toUpperCase();
            var arr = (pd.arr || '').trim().toUpperCase();
            return dep === focusAirportCode || arr === focusAirportCode;
        }

        function applyMarkerFocus(id) {
            var marker = planeMarkers[id];
            if (!marker) return;
            if (!focusAirportCode) {
                var pd = planeData[id];
                if (pd) marker.setOpacity(staleOpacity(pd));
                return;
            }
            marker.setOpacity(isRelatedToFocus(id) ? 1.0 : 0.18);
        }

        function applyFocusOverlay() {
            for (var id in planeMarkers) {
                applyMarkerFocus(id);
            }
        }

        function _getFocusRadius() {
            return Math.max(5, Math.min(200, parseFloat(_RS.focusRadiusNm) || 50));
        }

        function evaluateFocusAlerts() {
            if (!focusAirportCode || isNaN(focusAptLat) || isNaN(focusAptLon)) return;
            var radius = _getFocusRadius();
            var buffer = Math.max(5, radius * 0.1);
            var code   = focusAirportCode;
            var now    = Date.now();

            for (var id in planeData) {
                var p = planeData[id];
                if (!p) continue;
                var pLat = parseFloat(p.lat), pLon = parseFloat(p.lon);
                if (isNaN(pLat) || isNaN(pLon) || (pLat === 0 && pLon === 0)) continue;

                var dist  = distanceNm(pLat, pLon, focusAptLat, focusAptLon);
                var arrC  = (p.arr || '').trim().toUpperCase();
                var cs    = String(p.callsign || id).trim();

                // Inbound radius alert
                if (_RS.focusInboundAlerts !== false) {
                    var isInbound = arrC === code && isAirbornePlane(p);
                    if (isInbound && dist <= radius) {
                        if (!_focusSeenIn[id]) {
                            _focusSeenIn[id] = true;
                            var spd = parseFloat(p.speed) || 0;
                            var etaMin = (spd > 10) ? Math.round(dist / spd * 60) : null;
                            var txt = cs + ' inbound to ' + code
                                + ' entered ' + Math.round(radius) + ' NM'
                                + (etaMin !== null ? ' · ETA est. ' + etaMin + ' min' : '');
                            focusAlerts.unshift({type: 'inbound', id: id, callsign: cs, text: txt, ts: now});
                            if (focusAlerts.length > 20) focusAlerts.length = 20;
                        }
                    } else if (!isInbound || dist > radius + buffer) {
                        _focusSeenIn[id] = false;
                    }
                }

                // Emergency alert
                if (_RS.focusEmergencyAlerts !== false) {
                    var inRange = dist <= radius || arrC === code;
                    if (inRange && isEmergencySquawk(p)) {
                        var emgKey = String(p.squawk || '') + '|' + String(p.emergency || '');
                        if (_focusSeenEmg[id] !== emgKey) {
                            _focusSeenEmg[id] = emgKey;
                            var sq = p.squawk || p.emergency || '?';
                            var emgTxt = 'Emergency squawk ' + sq + ': ' + cs
                                + ' near ' + code + ' · ' + Math.round(dist) + ' NM';
                            focusAlerts.unshift({type: 'emergency', id: id, callsign: cs, text: emgTxt, ts: now});
                            if (focusAlerts.length > 20) focusAlerts.length = 20;
                        }
                    } else if (!inRange) {
                        delete _focusSeenEmg[id];
                    }
                }
            }

            renderFocusAlertList();
        }

        function renderFocusAlertList() {
            var el = document.getElementById('focus-alert-list');
            if (!el) {
                el = document.createElement('div');
                el.id = 'focus-alert-list';
                document.body.appendChild(el);
            }
            if (!focusAirportCode || focusAlerts.length === 0) {
                el.style.display = 'none';
                return;
            }
            el.innerHTML = '';
            var clearBtn = document.createElement('button');
            clearBtn.className = 'fal-clear';
            clearBtn.textContent = 'Clear alerts';
            clearBtn.onclick = function() {
                focusAlerts = [];
                renderFocusAlertList();
                updateFocusBadge();
            };
            el.appendChild(clearBtn);
            var shown = focusAlerts.slice(0, 8);
            for (var i = 0; i < shown.length; i++) {
                var a = shown[i];
                var item = document.createElement('div');
                item.className = 'fal-item' + (a.type === 'emergency' ? ' fal-emergency' : '');
                var msg = document.createElement('div');
                msg.className = 'fal-msg';
                var words = a.text.split(' ');
                msg.innerHTML = '<b>' + htmlEscape(words[0]) + '</b> ' + htmlEscape(words.slice(1).join(' '));
                item.appendChild(msg);
                el.appendChild(item);
            }
            el.style.display = 'flex';
        }

        function updateFocusBadge() {
            if (!focusAirportCode) {
                if (focusBadgeEl) focusBadgeEl.style.display = 'none';
                renderFocusAlertList();
                return;
            }
            var code = focusAirportCode;
            var inCount = 0, outCount = 0;
            for (var id in planeData) {
                var pd = planeData[id];
                var depC = (pd.dep || '').trim().toUpperCase();
                var arrC = (pd.arr || '').trim().toUpperCase();
                if (arrC === code) inCount++;
                if (depC === code) outCount++;
            }

            evaluateFocusAlerts();

            if (!focusBadgeEl) {
                focusBadgeEl = document.createElement('div');
                focusBadgeEl.id = 'focus-airport-badge';
                document.body.appendChild(focusBadgeEl);
            }

            var infoText = 'Airport Focus: ' + code;
            var chipsText = 'Inbound ' + inCount + ' · Outbound ' + outCount;
            if (focusAlerts.length > 0) {
                chipsText += ' · ' + focusAlerts.length + ' alert' + (focusAlerts.length === 1 ? '' : 's');
            }

            focusBadgeEl.innerHTML = '';
            var infoSpan = document.createElement('span');
            infoSpan.textContent = infoText;
            var chipsSpan = document.createElement('span');
            chipsSpan.className = 'fbadge-chips';
            chipsSpan.textContent = chipsText;
            var exitBtn = document.createElement('button');
            exitBtn.className = 'fbadge-exit';
            exitBtn.textContent = 'Exit Focus';
            exitBtn.onclick = exitAirportFocus;
            focusBadgeEl.appendChild(infoSpan);
            focusBadgeEl.appendChild(chipsSpan);
            focusBadgeEl.appendChild(exitBtn);
            focusBadgeEl.style.display = 'flex';
        }

        function _preseedFocusAlertState(aLat, aLon, radius, code) {
            // Pre-seed seen dicts so aircraft already inside on focus-enter don't spam alerts
            for (var id in planeData) {
                var p = planeData[id];
                if (!p) continue;
                var pLat = parseFloat(p.lat), pLon = parseFloat(p.lon);
                if (isNaN(pLat) || isNaN(pLon)) continue;
                var dist = distanceNm(pLat, pLon, aLat, aLon);
                var arrC = (p.arr || '').trim().toUpperCase();
                if (arrC === code && isAirbornePlane(p) && dist <= radius) {
                    _focusSeenIn[id] = true;
                }
                if (isEmergencySquawk(p) && (dist <= radius || arrC === code)) {
                    _focusSeenEmg[id] = String(p.squawk || '') + '|' + String(p.emergency || '');
                }
            }
        }

        function enterAirportFocus(code) {
            code = (code || '').toUpperCase().trim();
            if (!code) return;

            // Remove existing rings from any prior focus session
            focusRings.forEach(function(r) { try { map.removeLayer(r); } catch(e) {} });
            focusRings = [];

            // Reset alert state for new focus session
            focusAlerts    = [];
            _focusSeenIn   = {};
            _focusSeenEmg  = {};
            focusAptLat    = NaN;
            focusAptLon    = NaN;

            focusAirportCode = code;

            // Open/re-render airport panel
            if (panelMode !== 'airport' || selectedAptCode !== code) {
                openAirportPanel(code);
            } else {
                renderAirportPanel();
            }

            // Draw radius rings: radius/2, radius, radius*2
            var a = selectedAptObj || lookupAirport(code) || null;
            if (a) {
                var aLat = parseFloat(a.lat || a.latitude || a.latitude_deg);
                var aLon = parseFloat(a.lon || a.longitude || a.longitude_deg);
                if (!isNaN(aLat) && !isNaN(aLon)) {
                    var NM = 1852;
                    var r  = _getFocusRadius();
                    focusAptLat = aLat;
                    focusAptLon = aLon;
                    focusRings.push(L.circle([aLat, aLon], {
                        radius: (r / 2) * NM, color: '#00ffcc', weight: 1.5, opacity: 0.4,
                        fillOpacity: 0, interactive: false
                    }).addTo(map));
                    focusRings.push(L.circle([aLat, aLon], {
                        radius: r * NM, color: '#00ffcc', weight: 1.5, opacity: 0.28,
                        fillOpacity: 0, interactive: false
                    }).addTo(map));
                    focusRings.push(L.circle([aLat, aLon], {
                        radius: (r * 2) * NM, color: '#00ffcc', weight: 1, opacity: 0.14,
                        fillOpacity: 0, interactive: false
                    }).addTo(map));
                    map.panTo([aLat, aLon]);
                    // Pre-seed: don't alert for aircraft already inside on entry
                    _preseedFocusAlertState(aLat, aLon, r, code);
                }
            }

            // Dim unrelated markers, highlight related
            applyFocusOverlay();

            // Show HUD badge
            updateFocusBadge();
        }

        function exitAirportFocus() {
            focusAirportCode = null;
            focusAptLat      = NaN;
            focusAptLon      = NaN;

            // Remove radius rings
            focusRings.forEach(function(r) { try { map.removeLayer(r); } catch(e) {} });
            focusRings = [];

            // Clear alert state
            focusAlerts   = [];
            _focusSeenIn  = {};
            _focusSeenEmg = {};

            // Hide badge and alert list
            if (focusBadgeEl) focusBadgeEl.style.display = 'none';
            renderFocusAlertList();

            // Restore all marker opacities to natural stale-based values
            applyFocusOverlay();

            // Re-render airport panel to flip button back to "Focus Airport"
            if (panelMode === 'airport') renderAirportPanel();
        }

    </script>
</body>
</html>
