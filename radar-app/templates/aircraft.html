<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar — Aircraft</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #ccc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ── Header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 24px;
            background: rgba(0,0,0,0.75);
            border-bottom: 1px solid rgba(0,255,204,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .page-header h1 { font-size: 16px; font-weight: 600; color: #00ffcc; letter-spacing: 0.6px; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        #last-update { font-size: 11px; color: #444; white-space: nowrap; }
        .refresh-btn {
            font-size: 11px; font-weight: 600; color: #00ffcc;
            background: rgba(0,255,204,0.07); border: 1px solid rgba(0,255,204,0.22);
            border-radius: 4px; padding: 4px 12px; cursor: pointer;
            letter-spacing: 0.3px; transition: background 0.15s; font-family: inherit;
        }
        .refresh-btn:hover { background: rgba(0,255,204,0.14); }
        .refresh-btn:active { background: rgba(0,255,204,0.2); }

        /* ── Sidebar ── */
        .page-content { margin-left: 56px; }
        #sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 56px;
            z-index: 1100; background: rgba(8,8,8,0.97);
            border-right: 1px solid rgba(0,255,204,0.1);
            display: flex; flex-direction: column; align-items: center;
        }
        .sidebar-logo {
            width: 100%; height: 48px; display: flex; align-items: center;
            justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #00ffcc; flex-shrink: 0;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-nav {
            flex: 1; width: 100%; padding: 6px 0; display: flex;
            flex-direction: column; align-items: center; gap: 1px;
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar-bottom {
            width: 100%; padding: 6px 0 8px; border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-direction: column; align-items: center;
            gap: 1px; flex-shrink: 0;
        }
        .nav-item {
            width: 46px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 3px; padding: 8px 0 7px; border-radius: 6px;
            text-decoration: none; color: #686868; font-size: 8.5px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-item:hover { color: #b0b0b0; background: rgba(255,255,255,0.06); }
        .nav-item.active { color: #00ffcc; background: rgba(0,255,204,0.09); }
        .nav-item.active:hover { color: #00ffcc; background: rgba(0,255,204,0.13); }
        .nav-item.soon { color: #464646; }
        .nav-item.soon:hover { color: #636363; background: rgba(255,255,255,0.02); }
        .nav-sep { width: 28px; height: 1px; background: rgba(255,255,255,0.06); margin: 3px 0; }

        /* ── Airport Focus banner ── */
        .focus-banner {
            background: rgba(0,255,204,0.06); border-bottom: 1px solid rgba(0,255,204,0.16);
            padding: 6px 20px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: #999;
        }
        .focus-banner strong { color: #00ffcc; font-weight: 600; }
        .focus-banner a { color: #7aadee; text-decoration: none; }
        .focus-banner a:hover { text-decoration: underline; }
        .focus-banner .fb-clear {
            margin-left: auto; background: none; border: 1px solid rgba(255,255,255,0.14);
            color: #777; font-size: 11px; padding: 2px 9px; border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        .focus-banner .fb-clear:hover { color: #ccc; border-color: rgba(255,255,255,0.28); }

        /* ── Focused airport sections ── */
        .focus-section { margin-bottom: 28px; }
        .sec-head { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 0; }
        .sec-head h2 { font-size: 13px; font-weight: 600; color: #ccc; margin: 0; }
        .sec-badge { background: rgba(0,255,204,0.12); color: #00ffcc; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
        .sec-empty { color: #444; font-size: 13px; padding: 16px 4px; }
        .sec-note { color: #555; font-size: 11px; margin-top: 8px; padding: 0 4px; }

        /* ── Main layout ── */
        .main { max-width: 1600px; margin: 0 auto; padding: 24px 20px 48px; }

        /* ── Cards ── */
        .cards-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .card {
            flex: 1 1 110px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,204,0.13); border-radius: 8px;
            padding: 14px 18px 13px; min-width: 100px;
        }
        .card .value {
            font-size: 24px; font-weight: 700; color: #00ffcc; line-height: 1.1;
            letter-spacing: -0.5px; font-variant-numeric: tabular-nums;
        }
        .card .label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.9px; margin-top: 5px; }
        .card .sub { font-size: 11px; color: #3a3a3a; margin-top: 2px; }
        .card.dim .value { color: #555; }
        .card.warn .value { color: #f5a623; }

        /* ── Section shell ── */
        .section {
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .section-head {
            display: flex; align-items: center; flex-wrap: wrap;
            padding: 9px 16px 8px; background: rgba(0,0,0,0.35);
            border-bottom: 1px solid rgba(255,255,255,0.05); gap: 8px;
        }
        .section-head h2 {
            font-size: 11px; font-weight: 600; color: #00ffcc;
            text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
        }
        .count-badge { font-size: 10px; color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* ── Filter tabs ── */
        .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .filter-btn {
            font-size: 10px; font-weight: 600; color: #3a3a3a;
            background: transparent; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 3px; padding: 2px 9px; cursor: pointer;
            letter-spacing: 0.3px; transition: all 0.12s; text-transform: uppercase;
            font-family: inherit; white-space: nowrap;
        }
        .filter-btn:hover { color: #888; border-color: rgba(255,255,255,0.2); }
        .filter-btn.active { color: #00ffcc; border-color: rgba(0,255,204,0.4); background: rgba(0,255,204,0.07); }

        /* ── Checkboxes ── */
        .check-label {
            display: flex; align-items: center; gap: 5px;
            font-size: 10px; font-weight: 600; color: #555;
            text-transform: uppercase; letter-spacing: 0.3px;
            cursor: pointer; white-space: nowrap; user-select: none;
        }
        .check-label input[type=checkbox] {
            accent-color: #00ffcc; width: 13px; height: 13px; cursor: pointer;
        }
        .check-label:hover { color: #888; }

        /* ── Search ── */
        .search-wrap { flex: 1; min-width: 160px; max-width: 260px; margin-left: auto; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
            color: #ccc; font-size: 11px; padding: 4px 9px; outline: none; font-family: inherit;
        }
        .search-input:focus { border-color: rgba(0,255,204,0.35); }
        .search-input::placeholder { color: #3a3a3a; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; }
        th {
            font-size: 10px; font-weight: 600; color: #444; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 7px 12px 6px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap;
            cursor: default;
        }
        th.r { text-align: right; }
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { color: #888; }
        th.sort-asc::after  { content: ' ↑'; color: #00ffcc; }
        th.sort-desc::after { content: ' ↓'; color: #00ffcc; }
        td {
            padding: 5px 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: middle; font-size: 12px;
        }
        td.callsign {
            color: #ddd; font-weight: 700;
            font-family: 'Consolas','Menlo',monospace; white-space: nowrap;
        }
        td.callsign.no-id { color: #444; font-weight: 400; font-style: italic; }
        td.reg { color: #aaa; font-family: 'Consolas','Menlo',monospace; white-space: nowrap; }
        td.hex { color: #555; font-family: 'Consolas','Menlo',monospace; font-size: 11px; white-space: nowrap; }
        td.actype { color: #777; font-size: 11px; white-space: nowrap; }
        td.route { color: #888; font-size: 11px; white-space: nowrap; }
        td.route .airports { color: #bbb; font-family: 'Consolas','Menlo',monospace; font-weight: 600; }
        td.route .no-route { color: #2a2a2a; }
        td.route .partial { color: #555; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        td.alt { color: #aaa; }
        td.alt.ground { color: #3a3a3a; }
        td.spd { color: #00ffcc; font-weight: 600; }
        td.spd.slow { color: #888; }
        td.spd.zero { color: #2a2a2a; }
        td.state { white-space: nowrap; }
        td.src-cell { color: #3a3a3a; font-size: 10px; white-space: nowrap; }
        tr:last-child td { border-bottom: none; }
        .hidden-row { display: none; }

        /* ── Tags ── */
        .tag {
            display: inline-block; font-size: 9px; font-weight: 700;
            padding: 1px 5px; border-radius: 2px; letter-spacing: 0.4px;
            text-transform: uppercase; margin-right: 2px; white-space: nowrap;
        }
        .tag-mil  { color: #e8a030; border: 1px solid rgba(232,160,48,0.35); background: rgba(232,160,48,0.07); }
        .tag-heli { color: #7eb8f7; border: 1px solid rgba(126,184,247,0.35); background: rgba(126,184,247,0.07); }
        .tag-ladd { color: #888;    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
        .tag-pia  { color: #888;    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
        .tag-emrg { color: #f97;    border: 1px solid rgba(255,153,119,0.4);  background: rgba(255,153,119,0.08); }
        .td-tags { white-space: nowrap; }

        /* ── State dot ── */
        .dot {
            display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; margin-right: 4px; flex-shrink: 0; vertical-align: middle;
        }
        .dot-air    { background: #00ffcc; }
        .dot-roll   { background: #f5a623; }
        .dot-ground { background: #444; }
        .dot-stop   { background: #2a2a2a; }
        .state-air    { color: #00ffcc; }
        .state-roll   { color: #f5a623; }
        .state-ground { color: #555; }
        .state-stop   { color: #3a3a3a; }

        /* ── Show-more button ── */
        .show-more-btn {
            font-size: 11px; font-weight: 600; color: #555;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 4px;
            padding: 6px 20px; cursor: pointer; background: transparent;
            font-family: inherit; letter-spacing: 0.3px; transition: all 0.12s;
        }
        .show-more-btn:hover { color: #888; border-color: rgba(255,255,255,0.22); }
        .show-more-wrap {
            text-align: center; padding: 12px 0 8px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .show-more-info {
            font-size: 10px; color: #333; margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* ── Clickable rows + detail panel ── */
        .clickable-row { cursor: pointer; }
        .clickable-row:hover td { background: rgba(255,255,255,0.04) !important; }
        .detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .detail-panel {
            padding: 12px 16px;
            background: rgba(0,255,204,0.025);
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }
        .detail-grid {
            display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px;
        }
        .dp-field { display: flex; flex-direction: column; gap: 1px; }
        .dp-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #444; }
        .dp-value { color: #bbb; font-size: 12px; }
        .dp-value.accent { color: #00ffcc; font-weight: 600; }
        .dp-value.mono { font-family: 'Consolas','Menlo',monospace; }
        .dp-value.warn { color: #f5a623; }
        .dp-sep { width: 100%; height: 1px; background: rgba(255,255,255,0.04); margin: 8px 0; }
        .dp-actions { display: flex; gap: 8px; margin-top: 6px; }
        .dp-action {
            font-size: 10px; font-weight: 600; color: #444;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
            padding: 3px 10px; text-decoration: none; letter-spacing: 0.3px;
            text-transform: uppercase; cursor: pointer; font-family: inherit;
            background: transparent;
        }
        .dp-action:hover { color: #888; border-color: rgba(255,255,255,0.2); }
        .dp-action.primary { color: #00ffcc; border-color: rgba(0,255,204,0.3); background: rgba(0,255,204,0.04); }
        .dp-action.primary:hover { background: rgba(0,255,204,0.09); }
        .no-radar-action { font-size: 11px; color: #444; align-self: center; cursor: default; }
        .detail-row.hidden { display: none; }

        /* ── Status / Empty ── */
        .status-msg { text-align: center; padding: 40px 24px; color: #444; font-size: 13px; }
        .status-msg.error { color: #f97; }

        /* ── Footer ── */
        .footer { margin-top: 28px; text-align: center; font-size: 11px; color: #383838; }
    </style>
</head>
<body>

        <a class="nav-item" href="/health" title="Health">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,9 4,9 6.5,4 9,13.5 11,6.5 13.5,9 17,9"/></svg>
            <span>Health</span>

            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5 L9 4.5 M9 13.5 L9 16.5 M1.5 9 L4.5 9 M13.5 9 L16.5 9 M3.7 3.7 L5.8 5.8 M12.2 12.2 L14.3 14.3 M3.7 14.3 L5.8 12.2 M12.2 5.8 L14.3 3.7"/></svg>

</nav>

<div class="page-content">
    <header class="page-header">
        <h1>Aircraft</h1>
        <div class="header-right">
            <span id="last-update">Loading…</span>
            <button class="refresh-btn" onclick="doRefresh()">Refresh</button>
        </div>
    </header>
    <script>(function(){
        var _f;try{_f=JSON.parse(localStorage.getItem('radar.focus')||'null');}catch(e){}
        if(!_f||!_f.airport||(Date.now()-(_f.ts||0))>14400000)return;
        var c=String(_f.airport).replace(/[^A-Z0-9]/g,'');
        if(!c)return;
        ['#sidebar a[href="/stats"]','#sidebar a[href="/airports"]','#sidebar .nav-sep'].forEach(function(s){var e=document.querySelector(s);if(e)e.style.display='none';});
        var b=document.createElement('div');b.className='focus-banner';
        b.innerHTML='<strong>Airport Focus: '+c+'</strong>'
            +'<span>advisory display · public near-live data</span>'
            +'<a href="/?airport='+encodeURIComponent(c)+'&focus=1">View on Radar</a>'
            +'<button class="fb-clear" onclick="(function(){try{localStorage.removeItem(\'radar.focus\');}catch(e){}this.closest(\'.focus-banner\').remove();document.querySelectorAll(\'#sidebar a[href=\\\'/stats\\\'],#sidebar a[href=\\\'/airports\\\'],#sidebar .nav-sep\').forEach(function(e){e.style.display=\'\';});}).call(this)">Clear Focus</button>';
        var h=document.querySelector('.page-header');
        if(h&&h.parentNode)h.parentNode.insertBefore(b,h.nextSibling);
    })();</script>

    <div class="main">

        <div class="cards-row" id="cards-row">
            <div class="card dim"><div class="value">—</div><div class="label">Total</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Commercial</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Private</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Military</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Helicopter</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Ground</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Unknown</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">With Route</div></div>
        </div>

        <div class="section">
            <div class="section-head">
                <h2>All Aircraft</h2>
                <div class="filter-tabs" id="class-filter-tabs">
                    <button class="filter-btn active" data-f="all"        onclick="setClassFilter('all')">All</button>
                    <button class="filter-btn"        data-f="commercial" onclick="setClassFilter('commercial')">Commercial</button>
                    <button class="filter-btn"        data-f="private"    onclick="setClassFilter('private')">Private</button>
                    <button class="filter-btn"        data-f="military"   onclick="setClassFilter('military')">Military</button>
                    <button class="filter-btn"        data-f="helicopter" onclick="setClassFilter('helicopter')">Helicopter</button>
                    <button class="filter-btn"        data-f="ground"     onclick="setClassFilter('ground')">Ground</button>
                    <button class="filter-btn"        data-f="unknown"    onclick="setClassFilter('unknown')">Unknown</button>
                </div>
                <label class="check-label" title="Show only aircraft with known departure and arrival">
                    <input type="checkbox" id="chk-route"> Route only
                </label>
                <label class="check-label" title="Show only aircraft with no callsign or registration">
                    <input type="checkbox" id="chk-noid"> Missing ID
                </label>
                <label class="check-label" title="Show only aircraft with a live position on the radar map">
                    <input type="checkbox" id="chk-mappable"> Mappable
                </label>
                <div class="search-wrap">
                    <input class="search-input" id="ac-search" type="text"
                           placeholder="callsign, reg, ICAO, route…">
                </div>
                <span class="count-badge" id="ac-count"></span>
            </div>
            <div id="ac-content">
                <div class="status-msg">Loading…</div>
            </div>
            <div id="show-more-wrap" class="show-more-wrap" style="display:none">
                <button class="show-more-btn" id="show-more-btn" onclick="loadMore()">Load more</button>
                <div class="show-more-info" id="show-more-info"></div>
            </div>
        </div>

        <div class="footer">Auto-refreshes every 30 seconds</div>
    </div>
</div>

<script>
/* ── Settings ── */
const RS = (function() {
    try { return JSON.parse(localStorage.getItem('radar.settings') || '{}'); } catch(e) { return {}; }
})();

/* ── Constants ── */
const VALID_CODE_RE = /^[A-Z]{3,4}$/;
const PAGE_SIZE = Math.max(50, Math.min(2000, parseInt(RS.aircraftPageSize || '500', 10) || 500));

const SOURCE_LABELS = {
    'adsblol-ground-sweep': 'Ground Sweep',
    'adsblol-ground':       'ADSB.lol Ground',
    'adsb-lol-reapi':       'ADSB.lol',
    'adsblol':              'ADSB.lol',
    'faa-sfdps':            'FAA/SFDPS',
    'faa-stdds-tfms':       'FAA/TFMS',
    'faa-stdds-tfm':        'FAA/TFM',
    'faa-stdds':            'FAA/STDDS',
    'faa-swim':             'FAA/SWIM',
    'faa':                  'FAA',
    'opensky':              'OpenSky',
    'unknown':              'Unknown',
};

/* ── Airport Focus ── */
const FOCUS_CODE = (function() {
    const p = new URLSearchParams(location.search);
    const ua = (p.get('airport') || '').replace(/[^A-Z0-9]/g, '').toUpperCase();
    if (ua && p.get('focus') === '1') return ua;
    try {
        const f = JSON.parse(localStorage.getItem('radar.focus') || 'null');
        if (f && f.airport && (Date.now() - (f.ts || 0)) < 14400000)
            return String(f.airport).replace(/[^A-Z0-9]/g, '');
    } catch(e) {}
    return '';
})();

if (FOCUS_CODE) {
    document.title = 'Radar — Aircraft · ' + FOCUS_CODE + ' Focus';
    const _h1 = document.querySelector('.page-header h1');
    if (_h1) _h1.textContent = 'Aircraft — ' + FOCUS_CODE + ' Focus';
    const _rfBtn = document.querySelector('.refresh-btn');
    if (_rfBtn) _rfBtn.setAttribute('onclick', '');  // replaced by addEventListener below

    // Inject banner if not already present (URL-param focus without localStorage entry)
    if (!document.querySelector('.focus-banner')) {
        const _b = document.createElement('div');
        _b.className = 'focus-banner';
        _b.innerHTML = '<strong>Airport Focus: ' + FOCUS_CODE + '</strong>'
            + '<span>advisory display · public near-live data</span>'
            + '<a href="/?airport=' + encodeURIComponent(FOCUS_CODE) + '&focus=1">View on Radar</a>'
            + '<button class="fb-clear">Clear Focus</button>';
        const _ph = document.querySelector('.page-header');
        if (_ph && _ph.parentNode) _ph.parentNode.insertBefore(_b, _ph.nextSibling);
    }
    // Patch Clear Focus to redirect to plain /aircraft after clearing
    const _clrBtn = document.querySelector('.focus-banner .fb-clear');
    if (_clrBtn) _clrBtn.onclick = function() {
        try { localStorage.removeItem('radar.focus'); } catch(e) {}
        location.href = '/aircraft';
    };
    // Hide global class filter tabs and checkboxes — not meaningful for airport-scoped view
    const _ft = document.getElementById('class-filter-tabs');
    if (_ft) _ft.style.display = 'none';
    ['chk-route', 'chk-noid', 'chk-mappable'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el && el.closest('label')) el.closest('label').style.display = 'none';
    });
}

/* ── State ── */
let loadedPlanes   = [];      // planes for the currently loaded page(s)
let classFilter    = 'all';
let sortCol        = 'lastUpdate';
let sortDir        = 'desc';
let currentSorted  = [];
let renderedCount  = 0;
const planeMap     = new Map(); // detailId → plane object
let currentPage    = 1;
let serverPageSize = PAGE_SIZE;
let serverTotal    = 0;
let serverTotalMatching = 0;
let serverHasMore  = false;
let searchQ        = '';
let searchDebounce = null;

/* ── Helpers ── */
function n(v) {
    const f = parseFloat(v);
    return isNaN(f) ? null : f;
}

function isValidCode(code) {
    if (!code) return false;
    return VALID_CODE_RE.test(code.trim().toUpperCase());
}

function routeDisplay(dep, arr) {
    const d = (dep || '').trim().toUpperCase();
    const a = (arr || '').trim().toUpperCase();
    const dOk = isValidCode(d);
    const aOk = isValidCode(a);
    if (dOk && aOk)  return { html: `<span class="airports">${d} → ${a}</span>`, text: `${d} ${a}`, full: true };
    if (dOk)         return { html: `<span class="airports">${d}</span><span class="partial"> → ?</span>`, text: d, full: false };
    if (aOk)         return { html: `<span class="partial">? → </span><span class="airports">${a}</span>`, text: a, full: false };
    return { html: `<span class="no-route">Route unavailable</span>`, text: '', full: false };
}

function friendlySource(raw) {
    if (!raw) return '—';
    const lower = raw.toLowerCase();
    for (const [key, label] of Object.entries(SOURCE_LABELS)) {
        if (lower === key) return label;
    }
    for (const [key, label] of Object.entries(SOURCE_LABELS)) {
        if (lower.startsWith(key)) return label;
    }
    return raw;
}

function stateInfo(p) {
    const src = ((p.source || '') + (p.positionSource || '')).toLowerCase();
    const isGround = src.includes('ground');
    const spd = n(p.speed) || 0;
    const airborne = String(p.airborne) === '1';
    if (isGround) return { label: 'Ground', dotCls: 'dot-ground', lblCls: 'state-ground' };
    if (airborne || spd > 40) return { label: 'Airborne', dotCls: 'dot-air', lblCls: 'state-air' };
    if (spd > 3)              return { label: 'Rolling',  dotCls: 'dot-roll', lblCls: 'state-roll' };
    return { label: 'Stopped', dotCls: 'dot-stop', lblCls: 'state-stop' };
}

function isGroundPlane(p) {
    const src = ((p.source || '') + (p.positionSource || '')).toLowerCase();
    return src.includes('ground');
}

function noFlightId(p) {
    return (p.callsign || '').toUpperCase() === (p.icaoHex || '').toUpperCase();
}

function noIdentity(p) {
    return noFlightId(p) && !(p.registration || '').trim();
}

function fmtAlt(a) {
    const v = n(a);
    if (v === null || v === 0) return { txt: 'GND', ground: true };
    return { txt: Math.round(v).toLocaleString() + ' ft', ground: false };
}

function fmtSpeed(s) {
    const v = n(s) || 0;
    if (v === 0)  return { txt: '—',              cls: 'zero' };
    if (v < 10)   return { txt: v.toFixed(1)+' kt', cls: 'slow' };
    return { txt: Math.round(v)+' kt', cls: '' };
}

function fmtHeading(h) {
    const v = n(h);
    return v != null ? v.toFixed(0) + '°' : '—';
}

function fmtAge(ts) {
    const v = n(ts);
    if (!v || v < 1e9) return '—';
    const secs = Math.floor(Date.now() / 1000 - v);
    if (secs < 0)   return 'now';
    if (secs < 60)  return secs + 's ago';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    return Math.floor(secs / 3600) + 'h ago';
}

function tagsHtml(p) {
    let t = '';
    if (p.isMilitary)   t += '<span class="tag tag-mil">MIL</span>';
    if (p.isHelicopter) t += '<span class="tag tag-heli">HELI</span>';
    if (p.isLadd)       t += '<span class="tag tag-ladd">LADD</span>';
    if (p.isPia)        t += '<span class="tag tag-pia">PIA</span>';
    if (p.emergency && p.emergency !== '0' && p.emergency !== 'none' && p.emergency !== '')
                        t += '<span class="tag tag-emrg">EMRG</span>';
    return t;
}

function classBadgeLabel(p) {
    if (isGroundPlane(p)) return 'Ground';
    return (p.aircraftClass || 'unknown');
}

// VISIBLE_AIR_MAX_AGE / VISIBLE_GROUND_MAX_AGE must match index.html radar thresholds.
const RADAR_AIR_MAX_AGE    = 120;   // seconds — airborne freshness window
const RADAR_GROUND_MAX_AGE = 900;   // seconds — ground freshness window

function isMappable(p) {
    const icao = (p.icaoHex || '').trim().toUpperCase();
    const call = (p.callsign || '').trim().toUpperCase();
    const hasId = !!(icao || call);

    const lat = parseFloat(p.lat);
    const lon = parseFloat(p.lon);
    const hasPos = !isNaN(lat) && !isNaN(lon) && !(lat === 0 && lon === 0);

    const lu = parseFloat(p.lastUpdate) || 0;
    const ageS = lu > 1e9 ? Math.floor(Date.now() / 1000 - lu) : 999999;
    const airborne = String(p.airborne) === '1' || (parseFloat(p.speed) || 0) > 40;
    const maxAge = airborne ? RADAR_AIR_MAX_AGE : RADAR_GROUND_MAX_AGE;
    const isStale = ageS > maxAge;

    const flightEnc = (p.flightId || '').trim() ? encodeURIComponent(p.flightId.trim()) : '';
    const link = icao
        ? `/?icao=${icao}` + (flightEnc ? `&flight=${flightEnc}` : '')
        : (flightEnc ? `/?flight=${flightEnc}` : (call ? `/?callsign=${encodeURIComponent(call)}` : null));

    let reason = null;
    if (!hasId)       reason = 'No identifier';
    else if (!hasPos) reason = 'No current position';
    else if (isStale) reason = 'Position stale';

    return { ok: hasId && hasPos && !isStale, reason, link };
}

/* ── Sorting (client-side, applies to loaded rows only) ── */
function thHtml(label, col, isRight) {
    const active = sortCol === col;
    const cls = ['sortable', isRight ? 'r' : '', active ? `sort-${sortDir}` : ''].filter(Boolean).join(' ');
    return `<th class="${cls}" onclick="sortBy('${col}')">${label}</th>`;
}

function sortBy(col) {
    if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
        sortCol = col;
        sortDir = col === 'callsign' || col === 'reg' ? 'asc' : 'desc';
    }
    renderTable(loadedPlanes);
}

function sortedPlanes(planes) {
    const dir = sortDir === 'asc' ? 1 : -1;
    return [...planes].sort((a, b) => {
        switch (sortCol) {
            case 'callsign': return dir * (a.callsign || '').localeCompare(b.callsign || '');
            case 'reg':      return dir * (a.registration || '').localeCompare(b.registration || '');
            case 'class':    return dir * (a.aircraftClass || '').localeCompare(b.aircraftClass || '');
            case 'alt':      return dir * ((n(a.alt) || 0) - (n(b.alt) || 0));
            case 'speed':    return dir * ((n(a.speed) || 0) - (n(b.speed) || 0));
            case 'lastUpdate': return dir * ((n(a.lastUpdate) || 0) - (n(b.lastUpdate) || 0));
            default: return 0;
        }
    });
}

/* ── Cards (from summary data) ── */
function renderCards(summary) {
    const cc   = summary.classCounts   || {};
    const rc   = summary.routeCoverage || {};
    const total      = summary.total        || 0;
    const commercial = cc.commercial        || 0;
    const priv       = cc.private           || 0;
    const mil        = cc.military          || 0;
    const heli       = cc.helicopter        || 0;
    const ground     = cc.ground            || 0;
    const unknown    = cc.unknown           || 0;
    const withRoute  = rc.withRoute         || 0;

    document.getElementById('cards-row').innerHTML = `
        <div class="card"><div class="value">${total.toLocaleString()}</div><div class="label">Total</div></div>
        <div class="card ${commercial>0?'':'dim'}"><div class="value">${commercial.toLocaleString()}</div><div class="label">Commercial</div></div>
        <div class="card ${priv>0?'':'dim'}"><div class="value">${priv.toLocaleString()}</div><div class="label">Private</div></div>
        <div class="card ${mil>0?'':'dim'}"><div class="value">${mil.toLocaleString()}</div><div class="label">Military</div></div>
        <div class="card ${heli>0?'':'dim'}"><div class="value">${heli.toLocaleString()}</div><div class="label">Helicopter</div></div>
        <div class="card dim"><div class="value">${ground.toLocaleString()}</div><div class="label">Ground</div></div>
        <div class="card dim"><div class="value">${unknown.toLocaleString()}</div><div class="label">Unknown</div></div>
        <div class="card ${withRoute>0?'':'dim'}"><div class="value">${withRoute.toLocaleString()}</div><div class="label">With Route</div></div>
    `;
}

/* ── Row HTML builder (no pre-built detail rows) ── */
function buildRowHtml(p, detailId) {
    const noId = noFlightId(p);
    const callText = noId ? (p.callsign || p.icaoHex || '—') : (p.callsign || p.flightId || '—');
    const callCls  = noId ? 'callsign no-id' : 'callsign';
    const route = routeDisplay(p.dep, p.arr);
    const alt   = fmtAlt(p.alt);
    const spd   = fmtSpeed(p.speed);
    const st    = stateInfo(p);
    const srch  = [
        callText, p.registration || '', p.icaoHex || '',
        p.dep || '', p.arr || '', p.source || '', p.positionSource || '',
        p.aircraftType || '', p.operator || ''
    ].join(' ').toLowerCase();

    const mp = isMappable(p);
    return `<tr class="clickable-row"
        data-class="${p.aircraftClass || 'unknown'}"
        data-ground="${isGroundPlane(p) ? '1' : '0'}"
        data-route="${route.full ? '1' : '0'}"
        data-noid="${noIdentity(p) ? '1' : '0'}"
        data-mappable="${mp.ok ? '1' : '0'}"
        data-srch="${srch}"
        data-detail-id="${detailId}"
        onclick="toggleDetail('${detailId}')">
        <td class="${callCls}">${callText}</td>
        <td class="reg">${p.registration || '—'}</td>
        <td class="hex">${p.icaoHex || '—'}</td>
        <td class="actype">${p.aircraftType || '<span style="color:#2a2a2a">—</span>'}</td>
        <td class="td-tags">${tagsHtml(p)}</td>
        <td class="route">${route.html}</td>
        <td class="num alt ${alt.ground ? 'ground' : ''}">${alt.txt}</td>
        <td class="num spd ${spd.cls}">${spd.txt}</td>
        <td class="state"><span class="dot ${st.dotCls}"></span><span class="${st.lblCls}">${st.label}</span></td>
        <td class="src-cell">${friendlySource(p.source || p.positionSource || '')}</td>
    </tr>`;
}

/* ── Detail panel (built on demand) ── */
function buildDetailHtml(p, id) {
    const route = routeDisplay(p.dep, p.arr);
    const alt   = fmtAlt(p.alt);
    const spd   = fmtSpeed(p.speed);
    const st    = stateInfo(p);
    const tags  = tagsHtml(p);
    const icao  = (p.icaoHex || '').toUpperCase();
    const assignedAlt = p.assignedAlt ? Math.round(n(p.assignedAlt) || 0).toLocaleString() + ' ft' : '';
    const vr    = p.verticalRate ? (n(p.verticalRate) > 0 ? '+' : '') + Math.round(n(p.verticalRate) || 0) + ' fpm' : '';

    function field(label, val, cls='') {
        if (!val && val !== 0) return '';
        return `<div class="dp-field"><div class="dp-label">${label}</div><div class="dp-value ${cls}">${val}</div></div>`;
    }

    return `<div class="detail-panel">
        <div class="detail-grid">
            ${field('Callsign / ID', p.callsign || p.flightId || '—', 'mono accent')}
            ${p.registration ? field('Registration', p.registration, 'mono') : ''}
            ${icao ? field('ICAO Hex', icao, 'mono') : ''}
            ${p.aircraftType ? field('Aircraft Type', p.aircraftType) : ''}
            ${field('Class', p.aircraftClass || 'unknown')}
            ${tags ? `<div class="dp-field"><div class="dp-label">Tags</div><div class="dp-value">${tags}</div></div>` : ''}
        </div>
        <div class="dp-sep"></div>
        <div class="detail-grid">
            <div class="dp-field"><div class="dp-label">Route</div><div class="dp-value">${route.html}</div></div>
            ${p.dep && isValidCode(p.dep.trim().toUpperCase()) ? field('Departure', p.dep.trim().toUpperCase(), 'mono') : ''}
            ${p.arr && isValidCode(p.arr.trim().toUpperCase()) ? field('Arrival', p.arr.trim().toUpperCase(), 'mono') : ''}
            ${p.depTime ? field('Dep Time', p.depTime) : ''}
            ${p.eta     ? field('ETA',      p.eta)     : ''}
            ${p.flightStatus ? field('Status', p.flightStatus) : ''}
        </div>
        <div class="dp-sep"></div>
        <div class="detail-grid">
            ${field('Altitude', alt.ground ? 'Ground' : alt.txt, alt.ground ? '' : 'accent')}
            ${assignedAlt ? field('Assigned Alt', assignedAlt) : ''}
            ${field('Speed', spd.txt !== '—' ? spd.txt : '')}
            ${field('Heading', fmtHeading(p.heading))}
            ${vr ? field('Vert Rate', vr, n(p.verticalRate) > 0 ? '' : 'warn') : ''}
            <div class="dp-field"><div class="dp-label">State</div><div class="dp-value ${st.lblCls}">${st.label}</div></div>
        </div>
        <div class="dp-sep"></div>
        <div class="detail-grid">
            ${field('Position Source', friendlySource(p.positionSource || p.source || ''))}
            ${p.enrichmentSource ? field('Enrichment', friendlySource(p.enrichmentSource)) : ''}
            ${p.sourceFacility ? field('Facility', p.sourceFacility, 'mono') : ''}
            ${p.source ? field('Raw Source', p.source, 'mono') : ''}
            ${field('Last Update', fmtAge(p.lastUpdate))}
            ${p.squawk && p.squawk !== '0' ? field('Squawk', p.squawk, 'mono') : ''}
        </div>
        <div class="dp-actions">
            ${(function() {
                const _mp = isMappable(p);
                if (_mp.ok && _mp.link) {
                    return `<a class="dp-action primary" href="${_mp.link}" title="Open on radar map">Open on Radar</a>`;
                }
                return `<span class="no-radar-action" title="${_mp.reason || 'Not mappable'}">${_mp.reason || 'Not mappable'}</span>`;
            })()}
        </div>
    </div>`;
}

/* ── Focused airport fetch and render ── */
function renderFocusCards(data) {
    const ic = data.inboundCount  || 0;
    const oc = data.outboundCount || 0;
    const pc = data.parkedCount   || 0;
    const nc = data.nearbyCount   || 0;
    document.getElementById('cards-row').innerHTML =
        `<div class="card ${ic>0?'':'dim'}"><div class="value">${ic}</div><div class="label">Inbound</div></div>`
        + `<div class="card ${oc>0?'':'dim'}"><div class="value">${oc}</div><div class="label">Outbound</div></div>`
        + `<div class="card ${pc>0?'':'dim'}"><div class="value">${pc}</div><div class="label">Parked / Last Observed</div></div>`
        + `<div class="card ${nc>0?'':'dim'}"><div class="value">${nc}</div><div class="label">Nearby</div></div>`;
}

function renderFocusSections(data) {
    const code = data.airport || FOCUS_CODE;
    planeMap.clear();
    renderedCount = 0;
    loadedPlanes = [
        ...(data.inbound  || []),
        ...(data.outbound || []),
        ...(data.parked   || []),
        ...(data.nearby   || []),
    ];

    const thead = `<thead><tr>
        <th>Callsign</th><th>Reg</th><th>ICAO</th><th>Type</th><th>Tags</th>
        <th>Route</th><th class="r">Alt</th><th class="r">Speed</th><th>State</th><th>Source</th>
    </tr></thead>`;

    function sectionHtml(title, planes, emptyMsg, totalCount) {
        if (!planes.length) {
            return `<div class="focus-section">
                <div class="sec-head"><h2>${title}</h2><span class="sec-badge">0</span></div>
                <div class="sec-empty">${emptyMsg}</div>
            </div>`;
        }
        let rows = '';
        planes.forEach(p => {
            const detailId = 'ac-detail-' + renderedCount++;
            planeMap.set(detailId, p);
            rows += buildRowHtml(p, detailId);
        });
        const capNote = (totalCount > planes.length)
            ? `<div class="sec-note">Showing ${planes.length} of ${totalCount} observed aircraft · most recent first</div>`
            : '';
        return `<div class="focus-section">
            <div class="sec-head"><h2>${title}</h2><span class="sec-badge">${planes.length}</span></div>
            <div style="overflow-x:auto"><table class="ac-table">
                ${thead}<tbody>${rows}</tbody>
            </table></div>
            ${capNote}
        </div>`;
    }

    document.getElementById('ac-content').innerHTML =
        sectionHtml('Inbound to ' + code,              data.inbound  || [], 'No inbound aircraft observed',         data.inboundCount  || 0)
        + sectionHtml('Outbound from ' + code,         data.outbound || [], 'No outbound aircraft observed',        data.outboundCount || 0)
        + sectionHtml('Parked / Last Observed at ' + code, data.parked|| [], 'No parked aircraft observed',         data.parkedCount   || 0)
        + sectionHtml('Nearby / Regional',             data.nearby   || [], 'No nearby aircraft observed',          data.nearbyCount   || 0)
        + `<div class="sec-note">Airport Focus · advisory display · public near-live data · may be delayed or incomplete</div>`;

    document.getElementById('show-more-wrap').style.display = 'none';
    document.getElementById('ac-count').textContent = loadedPlanes.length + ' aircraft';

    // Reapply search after focused sections are rebuilt
    const _q = (document.getElementById('ac-search').value || '').trim().toLowerCase();
    if (_q) {
        document.querySelectorAll('#ac-content tr.clickable-row').forEach(function(tr) {
            tr.style.display = !_q || (tr.dataset.srch || '').includes(_q) ? '' : 'none';
        });
    }
}

async function doFocusRefresh() {
    document.getElementById('last-update').textContent = 'Refreshing…';
    const t0 = Date.now();
    try {
        const r = await fetch('/api/?action=Planes&view=airport&airport=' + encodeURIComponent(FOCUS_CODE) + '&_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        const data = d?.response?.data || {};
        renderFocusCards(data);
        renderFocusSections(data);
        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);
        document.getElementById('last-update').textContent =
            'Updated ' + new Date().toLocaleTimeString()
            + ' · ' + elapsed + 's · ' + FOCUS_CODE + ' focus';
    } catch(e) {
        document.getElementById('last-update').textContent = 'Error: ' + e.message;
        document.getElementById('ac-content').innerHTML =
            '<div class="status-msg error">Unable to reach API</div>';
    }
}

let focusTimer;
function scheduleFocusRefresh() {
    clearTimeout(focusTimer);
    focusTimer = setTimeout(() => { doFocusRefresh().then(scheduleFocusRefresh); }, 30000);
}

/* ── Table rendering ── */
function renderTable(planes) {
    currentSorted = sortedPlanes(planes);
    renderedCount = 0;
    planeMap.clear();

    if (!currentSorted.length) {
        document.getElementById('ac-content').innerHTML = '<div class="status-msg">No aircraft data</div>';
        document.getElementById('ac-count').textContent = '0 aircraft';
        document.getElementById('show-more-wrap').style.display = 'none';
        return;
    }

    document.getElementById('ac-content').innerHTML = `
        <div style="overflow-x:auto">
        <table id="ac-table">
            <thead><tr>
                ${thHtml('Callsign', 'callsign', false)}
                ${thHtml('Reg',      'reg',      false)}
                <th>ICAO</th>
                ${thHtml('Type',     'class',    false)}
                <th>Tags</th>
                <th>Route</th>
                ${thHtml('Alt',      'alt',      true)}
                ${thHtml('Speed',    'speed',    true)}
                <th>State</th>
                <th>Source</th>
            </tr></thead>
            <tbody id="ac-tbody"></tbody>
        </table>
        </div>`;

    appendRows(currentSorted);
    updateShowMore();
    applyFilters();
}

function appendRows(planes) {
    const tbody = document.getElementById('ac-tbody');
    if (!tbody) return;
    let html = '';
    const base = renderedCount;
    for (let i = 0; i < planes.length; i++) {
        const p = planes[i];
        const detailId = `ac-detail-${base + i}`;
        planeMap.set(detailId, p);
        html += buildRowHtml(p, detailId);
    }
    renderedCount += planes.length;
    tbody.insertAdjacentHTML('beforeend', html);
}

async function loadMore() {
    if (!serverHasMore) return;
    currentPage++;
    const btn = document.getElementById('show-more-btn');
    if (btn) btn.textContent = 'Loading…';
    try {
        const qs = buildTableQS(currentPage);
        const r = await fetch('/api/?action=Planes&view=table&' + qs + '&_=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        const data = d?.response?.data || {};
        const planes = data.planes || [];
        serverHasMore = data.hasMore || false;
        serverTotalMatching = data.totalMatching || serverTotalMatching;
        loadedPlanes = loadedPlanes.concat(planes);
        const sorted = sortedPlanes(planes);
        appendRows(sorted);
        updateShowMore();
        applyFilters();
    } catch (e) {
        currentPage--;
        if (btn) btn.textContent = 'Retry';
    }
}

function updateShowMore() {
    const wrap = document.getElementById('show-more-wrap');
    const btn  = document.getElementById('show-more-btn');
    const info = document.getElementById('show-more-info');
    if (!wrap) return;
    if (!serverHasMore) {
        wrap.style.display = 'none';
    } else {
        const remaining = serverTotalMatching - renderedCount;
        btn.textContent = `Load ${Math.min(PAGE_SIZE, remaining).toLocaleString()} more`;
        info.textContent = `Loaded ${renderedCount.toLocaleString()} of ${serverTotalMatching.toLocaleString()} matching · sort applies to loaded rows`;
        wrap.style.display = 'block';
    }
}

/* ── Filter / Search ── */
function setClassFilter(cls) {
    classFilter = cls;
    document.querySelectorAll('#class-filter-tabs .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.f === cls);
    });
    fetchTablePage().catch(console.error);
}

function applyFilters() {
    const routeOnly    = document.getElementById('chk-route').checked;
    const noIdOnly     = document.getElementById('chk-noid').checked;
    const mappableOnly = document.getElementById('chk-mappable').checked;
    const tbl = document.getElementById('ac-table');
    if (!tbl) return;

    let vis = 0, total = 0;
    for (const row of tbl.querySelectorAll('tbody tr.clickable-row')) {
        total++;
        const hasRt    = row.dataset.route    === '1';
        const noId     = row.dataset.noid     === '1';
        const mappable = row.dataset.mappable === '1';

        const rtMatch   = !routeOnly    || hasRt;
        const noidMatch = !noIdOnly     || noId;
        const mapMatch  = !mappableOnly || mappable;

        const show = rtMatch && noidMatch && mapMatch;
        row.classList.toggle('hidden-row', !show);

        const detail = row.nextElementSibling;
        if (detail && detail.classList.contains('detail-row')) {
            detail.classList.toggle('hidden-row', !show);
            if (!show) detail.classList.add('hidden');
        }
        if (show) vis++;
    }

    const hasClientFilter = routeOnly || noIdOnly || mappableOnly;
    const rendered = renderedCount;
    document.getElementById('ac-count').textContent =
        hasClientFilter
            ? `${vis} of ${rendered} loaded`
            : serverHasMore
                ? `${rendered} loaded of ${serverTotalMatching.toLocaleString()} matching`
                : `${rendered} aircraft`;
}

function toggleDetail(id) {
    const existing = document.getElementById(id);
    if (existing) {
        existing.classList.toggle('hidden');
        return;
    }
    const p = planeMap.get(id);
    if (!p) return;
    const ownerRow = document.querySelector(`[data-detail-id="${id}"]`);
    if (!ownerRow) return;
    const tr = document.createElement('tr');
    tr.id = id;
    tr.className = 'detail-row';
    tr.innerHTML = `<td colspan="10">${buildDetailHtml(p, id)}</td>`;
    ownerRow.insertAdjacentElement('afterend', tr);
}

/* ── Server query helpers ── */
function buildTableQS(page) {
    let qs = 'page=' + page + '&pageSize=' + PAGE_SIZE;
    if (searchQ) qs += '&q=' + encodeURIComponent(searchQ);
    if (classFilter !== 'all') qs += '&aircraftClass=' + encodeURIComponent(classFilter);
    return qs;
}

async function fetchTablePage() {
    currentPage = 1;
    loadedPlanes = [];
    const qs = buildTableQS(1);
    const r = await fetch('/api/?action=Planes&view=table&' + qs + '&_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const data = d?.response?.data || {};
    const planes = data.planes || [];
    serverHasMore       = data.hasMore        || false;
    serverTotalMatching = data.totalMatching  || planes.length;
    serverTotal         = data.total          || serverTotalMatching;
    serverPageSize      = data.pageSize       || PAGE_SIZE;
    loadedPlanes        = planes;
    renderTable(planes);
    return data;
}

/* ── Fetch & render ── */
async function doRefresh() {
    document.getElementById('last-update').textContent = 'Refreshing…';
    const t0 = Date.now();
    try {
        const [summaryRes, tableData] = await Promise.all([
            fetch('/api/?action=Planes&view=summary&_=' + Date.now())
                .then(r => r.ok ? r.json() : null)
                .then(d => (d?.response?.data) || {}),
            fetchTablePage(),
        ]);

        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

        if (summaryRes.total) {
            renderCards(summaryRes);
        }

        document.getElementById('last-update').textContent =
            'Updated ' + new Date().toLocaleTimeString() +
            ' · ' + elapsed + 's · ' + serverTotal.toLocaleString() + ' aircraft';
    } catch (e) {
        document.getElementById('last-update').textContent = 'Error: ' + e.message;
        document.getElementById('ac-content').innerHTML =
            '<div class="status-msg error">Unable to reach API</div>';
        document.getElementById('show-more-wrap').style.display = 'none';
    }
}

let timer;
function scheduleRefresh() {
    clearTimeout(timer);
    timer = setTimeout(() => { doRefresh().then(scheduleRefresh); }, 30000);
}

// Wire search input — server-side in global mode, client-side in focused mode
document.getElementById('ac-search').addEventListener('input', function() {
    if (FOCUS_CODE) {
        const q = this.value.trim().toLowerCase();
        document.querySelectorAll('#ac-content tr.clickable-row').forEach(tr => {
            tr.style.display = !q || (tr.dataset.srch || '').includes(q) ? '' : 'none';
        });
    } else {
        clearTimeout(searchDebounce);
        const q = this.value.trim();
        searchDebounce = setTimeout(function() {
            searchQ = q;
            fetchTablePage().then(applyFilters).catch(console.error);
        }, 350);
    }
});

// Wire checkbox filters to client-side show/hide (they filter the loaded rows)
['chk-route', 'chk-noid', 'chk-mappable'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', applyFilters);
});

// Wire refresh button for focused mode
if (FOCUS_CODE) {
    const _rfBtn = document.querySelector('.refresh-btn');
    if (_rfBtn) _rfBtn.addEventListener('click', () => doFocusRefresh().catch(console.error));
}

if (FOCUS_CODE) {
    doFocusRefresh().then(scheduleFocusRefresh);
} else {
    doRefresh().then(scheduleRefresh);
}
</script>
</body>
</html>
