<!DOCTYPE html>
<html>
<head>
    <title>Meeks Family Radar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .plane-container { background: none; border: none; }
        .plane-svg { filter: drop-shadow(0px 0px 3px #00ffcc); }
        #hud {
            position: fixed; top: 12px; left: 60px; z-index: 1000;
            background: rgba(0,0,0,0.75); color: #00ffcc; padding: 8px 16px;
            border-radius: 6px; font-size: 14px; pointer-events: none;
            border: 1px solid rgba(0,255,204,0.2);
        }
        #hud span { color: #fff; font-weight: bold; }
        .leaflet-popup-content-wrapper {
            background: rgba(0,0,0,0.85); color: #ccc; border: 1px solid #00ffcc44;
            border-radius: 6px; font-size: 13px;
        }
        .leaflet-popup-tip { background: rgba(0,0,0,0.85); }
        .leaflet-popup-content b { color: #00ffcc; }
        .leaflet-popup-content .route { color: #fff; font-size: 14px; margin: 4px 0; }
        .leaflet-popup-content .meta { color: #888; font-size: 11px; }
    </style>
</head>
<body>
    <div id="hud">Tracking <span id="count">0</span> aircraft</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.8283, -98.5795], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO'
        }).addTo(map);

        var planes = {};
        var activeTrail = null;
        var activeCallsign = null;
        var KNOTS_TO_DEG_SEC = 0.0000046296;

        function updateCount() {
            document.getElementById('count').textContent = Object.keys(planes).length;
        }

        function showTrail(callsign) {
            if (activeTrail) { map.removeLayer(activeTrail); activeTrail = null; }
            activeCallsign = callsign;
            fetch('/api/trail/' + callsign)
                .then(function(res) { return res.json(); })
                .then(function(points) {
                    if (points.length > 1) {
                        var latlngs = points.map(function(p) {
                            return [parseFloat(p.lat), parseFloat(p.lon)];
                        });
                        if (planes[callsign]) {
                            latlngs.push([planes[callsign].lat, planes[callsign].lon]);
                        }
                        activeTrail = L.polyline(latlngs, {
                            color: '#00ffcc', weight: 2, opacity: 0.5, dashArray: '6 4'
                        }).addTo(map);
                    }
                });
        }

        map.on('click', function() {
            if (activeTrail) { map.removeLayer(activeTrail); activeTrail = null; activeCallsign = null; }
        });

        function vertArrow(alt, assigned) {
            var a = parseFloat(alt) || 0;
            var t = parseFloat(assigned) || 0;
            if (!t || Math.abs(a - t) < 200) return '';
            return a < t ? ' &#9650;' : ' &#9660;';
        }

        function fmtTime(iso) {
            if (!iso) return '';
            try {
                var d = new Date(iso);
                return d.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', timeZoneName: 'short'});
            } catch(e) { return ''; }
        }

        function popupContent(p) {
            var s = '<b>' + p.callsign + '</b>';
            if (p.operator) s += ' <span class="meta">(' + p.operator + ')</span>';

            if (p.dep || p.arr) {
                s += '<div class="route">' + (p.dep || '???') + ' &#9992; ' + (p.arr || '???') + '</div>';
            }

            var altStr = Math.round(parseFloat(p.alt || 0)).toLocaleString();
            s += 'Alt: ' + altStr + ' ft' + vertArrow(p.alt, p.assigned_alt);
            if (p.assigned_alt && Math.abs(parseFloat(p.alt) - parseFloat(p.assigned_alt)) > 200) {
                s += ' <span class="meta">(assigned ' + Math.round(parseFloat(p.assigned_alt)).toLocaleString() + ')</span>';
            }
            s += '<br>';

            s += 'Speed: ' + Math.round(parseFloat(p.speed || 0)) + ' kts';
            s += ' / Hdg: ' + Math.round(parseFloat(p.heading || 0)) + '&deg;<br>';

            if (p.dep_time) s += 'Departed: ' + fmtTime(p.dep_time) + '<br>';
            if (p.eta) s += 'ETA: ' + fmtTime(p.eta) + '<br>';
            if (p.icao_hex) s += '<span class="meta">ICAO: ' + p.icao_hex + '</span><br>';
            if (p.source) s += '<span class="meta">' + p.source + '</span>';

            return s;
        }

        function updateOrCreatePlane(p) {
            var id = p.callsign;
            var newLat = parseFloat(p.lat);
            var newLon = parseFloat(p.lon);
            var speed = parseFloat(p.speed) || 0;
            var heading = parseFloat(p.heading) || 0;
            var timestamp = parseFloat(p.last_update) || 0;

            if (!planes[id]) {
                var icon = L.divIcon({
                    className: 'plane-container',
                    html: '<div id="icon-' + id + '" style="transform:rotate(' + heading + 'deg);transition:transform 0.5s ease-out;">' +
                          '<svg class="plane-svg" viewBox="0 0 24 24" width="24" height="24" fill="#00ffcc">' +
                          '<path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>' +
                          '</svg></div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                var marker = L.marker([newLat, newLon], {icon: icon})
                    .bindPopup(popupContent(p))
                    .on('click', (function(cid) {
                        return function() { showTrail(cid); };
                    })(id))
                    .addTo(map);

                planes[id] = {
                    marker: marker, lat: newLat, lon: newLon,
                    heading: heading, speed: speed, lastUpdate: timestamp,
                    data: p
                };
                updateCount();
            } else {
                var plane = planes[id];
                if (timestamp > plane.lastUpdate || timestamp === 0) {
                    plane.lat = newLat;
                    plane.lon = newLon;
                    plane.speed = speed;
                    plane.heading = heading;
                    plane.lastUpdate = timestamp;
                    plane.data = p;

                    var iconDiv = document.getElementById('icon-' + id);
                    if (iconDiv) { iconDiv.style.transform = 'rotate(' + heading + 'deg)'; }

                    plane.marker.getPopup().setContent(popupContent(p));
                }
            }
        }

        // 1. Initial bulk load
        fetch('/api/planes')
            .then(function(res) { return res.json(); })
            .then(function(data) { data.forEach(updateOrCreatePlane); });

        // 2. Live stream
        var source = new EventSource("/api/stream");
        source.onmessage = function(event) {
            updateOrCreatePlane(JSON.parse(event.data));
        };

        // 3. Physics engine — extrapolate between FAA updates
        setInterval(function() {
            for (var id in planes) {
                var p = planes[id];
                if (p.speed > 10) {
                    var dist = p.speed * KNOTS_TO_DEG_SEC * 0.033;
                    var rad = p.heading * Math.PI / 180;
                    p.lat += dist * Math.cos(rad);
                    p.lon += dist * Math.sin(rad) / Math.cos(p.lat * Math.PI / 180);
                    p.marker.setLatLng([p.lat, p.lon]);
                }
            }
        }, 33);

        // 4. Refresh active trail
        setInterval(function() {
            if (activeCallsign && planes[activeCallsign]) {
                showTrail(activeCallsign);
            }
        }, 30000);
    </script>
</body>
</html>
