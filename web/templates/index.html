<!DOCTYPE html>
<html>
<head>
    <title>Meeks Family Radar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: 'Segoe UI', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .plane-container { background: none; border: none; }

        #hud {
            position: fixed; top: 12px; left: 60px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #00ffcc; padding: 10px 16px;
            border-radius: 6px; font-size: 13px; pointer-events: none;
            border: 1px solid rgba(0,255,204,0.2); min-width: 160px;
        }
        #hud .total { font-size: 16px; margin-bottom: 6px; }
        #hud .total span { color: #fff; font-weight: bold; }
        #hud .airlines { font-size: 11px; color: #aaa; line-height: 1.6; }
        #hud .airlines span { color: #00ffcc; font-weight: bold; min-width: 30px; display: inline-block; text-align: right; margin-right: 4px; }

        #search-box {
            position: fixed; top: 12px; right: 12px; z-index: 1000;
            display: flex; gap: 0;
        }
        #search-input {
            background: rgba(0,0,0,0.8); color: #fff; border: 1px solid rgba(0,255,204,0.3);
            border-radius: 6px 0 0 6px; padding: 8px 12px; font-size: 14px; width: 220px;
            outline: none; font-family: 'Segoe UI', sans-serif;
        }
        #search-input::placeholder { color: #666; }
        #search-input:focus { border-color: #00ffcc; }
        #search-btn {
            background: rgba(0,255,204,0.15); color: #00ffcc; border: 1px solid rgba(0,255,204,0.3);
            border-left: none; border-radius: 0 6px 6px 0; padding: 8px 12px; cursor: pointer;
            font-size: 14px;
        }
        #search-btn:hover { background: rgba(0,255,204,0.3); }
        #search-results {
            position: fixed; top: 48px; right: 12px; z-index: 1000;
            background: rgba(0,0,0,0.9); border: 1px solid rgba(0,255,204,0.2);
            border-radius: 6px; max-height: 300px; overflow-y: auto; display: none; width: 260px;
        }
        .search-result {
            padding: 8px 12px; color: #ccc; cursor: pointer; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .search-result:hover { background: rgba(0,255,204,0.1); color: #fff; }
        .search-result .sr-call { color: #00ffcc; font-weight: bold; }
        .search-result .sr-route { color: #888; font-size: 11px; }

        #follow-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0,0,0,0.85); color: #00ffcc;
            padding: 8px 20px; border-radius: 20px; font-size: 13px;
            border: 1px solid rgba(0,255,204,0.3); display: none; cursor: pointer;
        }
        #follow-bar:hover { background: rgba(0,255,204,0.15); }

        .leaflet-popup-content-wrapper {
            background: rgba(0,0,0,0.85); color: #ccc; border: 1px solid #00ffcc44;
            border-radius: 6px; font-size: 13px;
        }
        .leaflet-popup-tip { background: rgba(0,0,0,0.85); }
        .leaflet-popup-content b { color: #00ffcc; }
        .leaflet-popup-content .route { color: #fff; font-size: 14px; margin: 4px 0; }
        .leaflet-popup-content .meta { color: #888; font-size: 11px; }
        .leaflet-popup-content .follow-link { color: #00ffcc; cursor: pointer; text-decoration: underline; font-size: 11px; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="total">Tracking <span id="count">0</span> aircraft (<span id="visible-count">0</span> visible)</div>
        <div class="airlines" id="airline-stats"></div>
    </div>
    <div id="search-box">
        <input type="text" id="search-input" placeholder="Callsign, airport, airline, flight ID">
        <button id="search-btn">&#128269;</button>
    </div>
    <div id="search-results"></div>
    <div id="follow-bar" onclick="stopFollow()">Following <span id="follow-name"></span> — click to stop</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([40.49, -79.84], 10);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri'
        }).addTo(map);

        var planeData = {};
        var planeMarkers = {};
        var activeTrail = null;
        var activeFlightId = null;
        var followFlightId = null;
        var KNOTS_TO_DEG_SEC = 0.0000046296;
        var currentBounds = null;
        var BOUNDS_PAD = 0.3;

        function updateBounds() {
            currentBounds = map.getBounds().pad(BOUNDS_PAD);
        }
        updateBounds();

        function isVisible(lat, lon) {
            return currentBounds && currentBounds.contains([lat, lon]);
        }

        function altColor(alt, speed) {
            var a = parseFloat(alt) || 0;
            var s = parseFloat(speed) || 0;
            if (s < 40) return '#666666';
            if (a < 5000) return '#3b82f6';
            if (a < 15000) return '#06b6d4';
            if (a < 25000) return '#00ffcc';
            if (a < 35000) return '#a5f3fc';
            return '#ffffff';
        }

        function displayName(p) {
            return p.callsign || p.flight_id || 'UNKNOWN';
        }

        function updateHUD() {
            var total = Object.keys(planeData).length;
            var vis = Object.keys(planeMarkers).length;
            document.getElementById('count').textContent = total;
            document.getElementById('visible-count').textContent = vis;

            var counts = {};
            for (var id in planeData) {
                var op = planeData[id].operator || '';
                if (op) counts[op] = (counts[op] || 0) + 1;
            }

            var sorted = Object.entries(counts).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 6);
            document.getElementById('airline-stats').innerHTML = sorted.map(function(e) {
                return '<span>' + e[1] + '</span> ' + e[0];
            }).join(' &middot; ');
        }

        function startFollow(flightId) {
            followFlightId = flightId;
            var pd = planeData[flightId];
            document.getElementById('follow-name').textContent = pd ? displayName(pd) : flightId;
            document.getElementById('follow-bar').style.display = 'block';
            if (pd) map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 11));
            showTrail(flightId);
        }

        function stopFollow() {
            followFlightId = null;
            document.getElementById('follow-bar').style.display = 'none';
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
                activeFlightId = null;
            }
        }

        function showTrail(flightId) {
            if (activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
            }

            activeFlightId = flightId;

            fetch('/api/trail/' + encodeURIComponent(flightId))
                .then(function(res) { return res.json(); })
                .then(function(points) {
                    if (points.length > 0) {
                        var latlngs = points.map(function(p) {
                            return [parseFloat(p.lat), parseFloat(p.lon)];
                        });

                        var pd = planeData[flightId];
                        if (pd) latlngs.push([pd.lat, pd.lon]);

                        var color = pd ? altColor(pd.alt, pd.speed) : '#00ffcc';
                        activeTrail = L.polyline(latlngs, {
                            color: color,
                            weight: 2,
                            opacity: 0.5,
                            dashArray: '6 4'
                        }).addTo(map);
                    }
                });
        }

        map.on('click', function() {
            if (!followFlightId && activeTrail) {
                map.removeLayer(activeTrail);
                activeTrail = null;
                activeFlightId = null;
            }
        });

        var searchInput = document.getElementById('search-input');
        var searchResults = document.getElementById('search-results');

        function doSearch() {
            var q = searchInput.value.toUpperCase().trim();
            if (!q) {
                searchResults.style.display = 'none';
                return;
            }

            var matches = [];
            for (var id in planeData) {
                var p = planeData[id];
                var name = (p.callsign || '').toUpperCase();
                var fid = (p.flight_id || '').toUpperCase();
                var dep = (p.dep || '').toUpperCase();
                var arr = (p.arr || '').toUpperCase();
                var op = (p.operator || '').toUpperCase();

                if (
                    name.indexOf(q) !== -1 ||
                    fid.indexOf(q) !== -1 ||
                    dep.indexOf(q) !== -1 ||
                    arr.indexOf(q) !== -1 ||
                    op.indexOf(q) !== -1
                ) {
                    matches.push(p);
                }

                if (matches.length >= 20) break;
            }

            if (matches.length === 0) {
                searchResults.innerHTML = '<div class="search-result" style="color:#666">No results</div>';
            } else {
                searchResults.innerHTML = matches.map(function(p) {
                    var route = (p.dep || '') + (p.dep && p.arr ? ' → ' : '') + (p.arr || '');
                    return '<div class="search-result" onclick="jumpTo(\'' + encodeURIComponent(p.flight_id) + '\')">' +
                           '<div class="sr-call">' + displayName(p) + (p.operator ? ' (' + p.operator + ')' : '') + '</div>' +
                           (route ? '<div class="sr-route">' + route + '</div>' : '') +
                           '<div class="sr-route">' + p.flight_id + '</div>' +
                           '</div>';
                }).join('');
            }

            searchResults.style.display = 'block';
        }

        function jumpTo(encodedFlightId) {
            var flightId = decodeURIComponent(encodedFlightId);
            searchResults.style.display = 'none';
            searchInput.value = '';

            var pd = planeData[flightId];
            if (pd) {
                map.setView([pd.lat, pd.lon], Math.max(map.getZoom(), 11));
                setTimeout(function() {
                    syncVisiblePlanes();
                    if (planeMarkers[flightId]) planeMarkers[flightId].openPopup();
                    showTrail(flightId);
                }, 300);
            }
        }

        searchInput.addEventListener('input', doSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                searchResults.style.display = 'none';
                searchInput.blur();
            }
            if (e.key === 'Enter') {
                var first = searchResults.querySelector('.search-result[onclick]');
                if (first) first.click();
            }
        });

        document.addEventListener('click', function(e) {
            if (!document.getElementById('search-box').contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        function vertArrow(alt, assigned) {
            var a = parseFloat(alt) || 0;
            var t = parseFloat(assigned) || 0;
            if (!t || Math.abs(a - t) < 200) return '';
            return a < t ? ' ▲' : ' ▼';
        }

        function fmtTime(iso) {
            if (!iso) return '';
            try {
                var d = new Date(iso);
                return d.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZoneName: 'short'
                });
            } catch(e) {
                return '';
            }
        }

        function popupContent(p) {
            var s = '<b>' + displayName(p) + '</b>';
            if (p.operator) s += ' <span class="meta">(' + p.operator + ')</span>';

            if (p.dep || p.arr) {
                s += '<div class="route">' + (p.dep || '???') + ' ✈ ' + (p.arr || '???') + '</div>';
            }

            var altStr = Math.round(parseFloat(p.alt || 0)).toLocaleString();
            s += 'Alt: ' + altStr + ' ft' + vertArrow(p.alt, p.assigned_alt);

            if (p.assigned_alt && Math.abs(parseFloat(p.alt || 0) - parseFloat(p.assigned_alt || 0)) > 200) {
                s += ' <span class="meta">(assigned ' + Math.round(parseFloat(p.assigned_alt)).toLocaleString() + ')</span>';
            }

            s += '<br>Speed: ' + Math.round(parseFloat(p.speed || 0)) + ' kts';
            s += ' / Hdg: ' + Math.round(parseFloat(p.heading || 0)) + '°<br>';

            if (p.dep_time) s += 'Departed: ' + fmtTime(p.dep_time) + '<br>';
            if (p.eta) s += 'ETA: ' + fmtTime(p.eta) + '<br>';
            if (p.icao_hex) s += '<span class="meta">ICAO: ' + p.icao_hex + '</span><br>';
            if (p.flight_id) s += '<span class="meta">ID: ' + p.flight_id + '</span><br>';
            if (p.source) s += '<span class="meta">' + p.source + '</span> ';

            s += '<span class="follow-link" onclick="startFollow(\'' + p.flight_id.replace(/'/g, "\\'") + '\')">follow</span>';
            return s;
        }

        function makePlaneIcon(id, heading, color) {
            return L.divIcon({
                className: 'plane-container',
                html: '<div id="icon-' + cssSafe(id) + '" style="transform:rotate(' + heading + 'deg);transition:transform 0.5s ease-out;">' +
                      '<svg viewBox="0 0 24 24" width="22" height="22" fill="' + color + '" style="filter:drop-shadow(0px 0px 3px ' + color + ')">' +
                      '<path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>' +
                      '</svg></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
        }

        function cssSafe(value) {
            return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function addMarker(id) {
            var p = planeData[id];
            if (!p || planeMarkers[id]) return;

            var color = altColor(p.alt, p.speed);
            var icon = makePlaneIcon(id, p.heading || 0, color);

            var marker = L.marker([p.lat, p.lon], {icon: icon})
                .bindPopup(popupContent(p))
                .on('click', (function(fid) {
                    return function() { showTrail(fid); };
                })(id))
                .addTo(map);

            planeMarkers[id] = marker;
            planeMarkers[id]._lastColor = color;
        }

        function removeMarker(id) {
            if (planeMarkers[id]) {
                map.removeLayer(planeMarkers[id]);
                delete planeMarkers[id];
            }
        }

        function syncVisiblePlanes() {
            updateBounds();
            var zoom = map.getZoom();
            var gridSize = zoom >= 12 ? 0 : 4 / Math.pow(2, zoom - 3);
            var grid = {};
            var winners = {};

            for (var id in planeData) {
                var p = planeData[id];
                if (!isVisible(p.lat, p.lon)) continue;

                if (id === followFlightId) { winners[id] = true; continue; }
                if (id === activeFlightId) { winners[id] = true; continue; }

                if (gridSize === 0) {
                    winners[id] = true;
                } else {
                    var cellX = Math.floor(p.lon / gridSize);
                    var cellY = Math.floor(p.lat / gridSize);
                    var cellKey = cellX + ',' + cellY;

                    if (!grid[cellKey]) {
                        grid[cellKey] = id;
                        winners[id] = true;
                    } else if ((parseFloat(p.speed) || 0) > (parseFloat(planeData[grid[cellKey]].speed) || 0)) {
                        winners[grid[cellKey]] = false;
                        grid[cellKey] = id;
                        winners[id] = true;
                    }
                }
            }

            for (var id in planeData) {
                var vis = isVisible(planeData[id].lat, planeData[id].lon);
                if (winners[id]) {
                    if (!planeMarkers[id]) addMarker(id);
                } else if (!vis && id !== followFlightId && id !== activeFlightId) {
                    if (planeMarkers[id]) removeMarker(id);
                }
            }

            updateHUD();
        }

        function processPlane(p) {
            var id = p.flight_id || p.callsign;
            if (!id) return;

            var lat = parseFloat(p.lat);
            var lon = parseFloat(p.lon);
            if (isNaN(lat) || isNaN(lon)) return;

            var speed = parseFloat(p.speed) || 0;
            var heading = parseFloat(p.heading) || 0;
            var timestamp = parseFloat(p.last_update) || 0;

            if (!planeData[id]) {
                planeData[id] = {
                    flight_id: id,
                    callsign: p.callsign || id,
                    lat: lat,
                    lon: lon,
                    speed: speed,
                    heading: heading,
                    lastUpdate: timestamp,
                    alt: p.alt,
                    assigned_alt: p.assigned_alt,
                    dep: p.dep,
                    arr: p.arr,
                    dep_time: p.dep_time,
                    eta: p.eta,
                    faa_ts: p.faa_ts,
                    flight_status: p.flight_status,
                    operator: p.operator,
                    icao_hex: p.icao_hex,
                    source: p.source
                };
            } else {
                var pd = planeData[id];
                if (timestamp >= pd.lastUpdate || timestamp === 0) {
                    pd.flight_id = id;
                    pd.callsign = p.callsign || pd.callsign || id;
                    pd.lat = lat;
                    pd.lon = lon;
                    pd.speed = speed;
                    pd.heading = heading;
                    pd.lastUpdate = timestamp;
                    pd.alt = p.alt;
                    pd.assigned_alt = p.assigned_alt;
                    pd.dep = p.dep || pd.dep;
                    pd.arr = p.arr || pd.arr;
                    pd.dep_time = p.dep_time || pd.dep_time;
                    pd.eta = p.eta || pd.eta;
                    pd.faa_ts = p.faa_ts || pd.faa_ts;
                    pd.flight_status = p.flight_status || pd.flight_status;
                    pd.operator = p.operator || pd.operator;
                    pd.icao_hex = p.icao_hex || pd.icao_hex;
                    pd.source = p.source || pd.source;
                }
            }

            if (planeMarkers[id]) {
                var color = altColor(planeData[id].alt, planeData[id].speed);
                if (color !== planeMarkers[id]._lastColor) {
                    planeMarkers[id].setIcon(makePlaneIcon(id, heading, color));
                    planeMarkers[id]._lastColor = color;
                } else {
                    var iconDiv = document.getElementById('icon-' + cssSafe(id));
                    if (iconDiv) iconDiv.style.transform = 'rotate(' + heading + 'deg)';
                }

                planeMarkers[id].getPopup().setContent(popupContent(planeData[id]));

                if (followFlightId === id) {
                    map.panTo([lat, lon], {animate: true, duration: 1});
                }
            } else if (isVisible(lat, lon)) {
                addMarker(id);
            }
        }

        function cleanStalePlanes() {
            var now = Date.now() / 1000;
            for (var id in planeData) {
                var age = now - planeData[id].lastUpdate;
                if (age > 3600) {
                    if (followFlightId === id) stopFollow();
                    removeMarker(id);
                    delete planeData[id];
                }
            }
            updateHUD();
        }

        map.on('moveend', syncVisiblePlanes);
        map.on('zoomend', syncVisiblePlanes);

        fetch('/api/planes')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                data.forEach(processPlane);
                syncVisiblePlanes();
            });

        var source = new EventSource("/api/stream");
        source.onmessage = function(event) {
            processPlane(JSON.parse(event.data));
        };

        setInterval(function() {
            var now = Date.now() / 1000;
            for (var id in planeMarkers) {
                var pd = planeData[id];
                if (!pd) continue;

                var age = now - pd.lastUpdate;
                if (pd.speed > 10 && age < 60) {
                    var dist = pd.speed * KNOTS_TO_DEG_SEC * 0.033;
                    var rad = pd.heading * Math.PI / 180;
                    pd.lat += dist * Math.cos(rad);
                    pd.lon += dist * Math.sin(rad) / Math.cos(pd.lat * Math.PI / 180);
                    planeMarkers[id].setLatLng([pd.lat, pd.lon]);
                }

                if (followFlightId === id) {
                    map.panTo([pd.lat, pd.lon], {animate: false});
                }
            }
        }, 33);

        setInterval(function() {
            if (activeFlightId && planeData[activeFlightId]) {
                if ((parseFloat(planeData[activeFlightId].speed) || 0) >= 40) {
                    showTrail(activeFlightId);
                }
            }
        }, 15000);

        setInterval(cleanStalePlanes, 120000);
    </script>
</body>
</html>
