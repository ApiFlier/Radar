<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar — Alerts</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #ccc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ── Header ── */
        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 13px 24px; background: rgba(0,0,0,0.75);
            border-bottom: 1px solid rgba(0,255,204,0.15);
            position: sticky; top: 0; z-index: 100;
        }
        .page-header h1 { font-size: 16px; font-weight: 600; color: #00ffcc; letter-spacing: 0.6px; }
        .header-right { display: flex; align-items: center; gap: 14px; }
        #last-update { font-size: 11px; color: #444; white-space: nowrap; }
        .refresh-btn {
            font-size: 11px; font-weight: 600; color: #00ffcc;
            background: rgba(0,255,204,0.07); border: 1px solid rgba(0,255,204,0.22);
            border-radius: 4px; padding: 4px 12px; cursor: pointer;
            letter-spacing: 0.3px; transition: background 0.15s; font-family: inherit;
        }
        .refresh-btn:hover { background: rgba(0,255,204,0.14); }
        .refresh-btn:active { background: rgba(0,255,204,0.2); }

        /* ── Sidebar ── */
        .page-content { margin-left: 56px; }
        #sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 56px;
            z-index: 1100; background: rgba(8,8,8,0.97);
            border-right: 1px solid rgba(0,255,204,0.1);
            display: flex; flex-direction: column; align-items: center;
        }
        .sidebar-logo {
            width: 100%; height: 48px; display: flex; align-items: center;
            justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #00ffcc; flex-shrink: 0;
        }
        .sidebar-logo svg { width: 20px; height: 20px; }
        .sidebar-nav {
            flex: 1; width: 100%; padding: 6px 0; display: flex;
            flex-direction: column; align-items: center; gap: 1px;
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar-bottom {
            width: 100%; padding: 6px 0 8px; border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-direction: column; align-items: center;
            gap: 1px; flex-shrink: 0;
        }
        .nav-item {
            width: 46px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 3px; padding: 8px 0 7px; border-radius: 6px;
            text-decoration: none; color: #686868; font-size: 8.5px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-item:hover { color: #b0b0b0; background: rgba(255,255,255,0.06); }
        .nav-item.active { color: #00ffcc; background: rgba(0,255,204,0.09); }
        .nav-item.active:hover { color: #00ffcc; background: rgba(0,255,204,0.13); }
        .nav-item.soon { color: #464646; }
        .nav-item.soon:hover { color: #636363; background: rgba(255,255,255,0.02); }
        .nav-sep { width: 28px; height: 1px; background: rgba(255,255,255,0.06); margin: 3px 0; }

        /* ── Main ── */
        .main { max-width: 1600px; margin: 0 auto; padding: 24px 20px 48px; }

        /* ── Cards ── */
        .cards-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .card {
            flex: 1 1 110px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0,255,204,0.13); border-radius: 8px;
            padding: 14px 18px 13px; min-width: 100px;
        }
        .card .value {
            font-size: 24px; font-weight: 700; color: #00ffcc; line-height: 1.1;
            letter-spacing: -0.5px; font-variant-numeric: tabular-nums;
        }
        .card .label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.9px; margin-top: 5px; }
        .card .sub { font-size: 11px; color: #3a3a3a; margin-top: 2px; }
        .card.dim .value { color: #555; }
        .card.crit .value { color: #ff5a5a; }
        .card.warn .value { color: #f5a623; }
        .card.crit { border-color: rgba(255,90,90,0.25); }
        .card.warn { border-color: rgba(245,166,35,0.2); }

        /* ── Section ── */
        .section {
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px; overflow: hidden; margin-bottom: 16px;
        }
        .section-head {
            display: flex; align-items: center; flex-wrap: wrap;
            padding: 9px 16px 8px; background: rgba(0,0,0,0.35);
            border-bottom: 1px solid rgba(255,255,255,0.05); gap: 8px;
        }
        .section-head h2 {
            font-size: 11px; font-weight: 600; color: #00ffcc;
            text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
        }
        .count-badge { font-size: 10px; color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* ── Filter tabs ── */
        .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .filter-btn {
            font-size: 10px; font-weight: 600; color: #3a3a3a;
            background: transparent; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 3px; padding: 2px 9px; cursor: pointer;
            letter-spacing: 0.3px; transition: all 0.12s; text-transform: uppercase;
            font-family: inherit; white-space: nowrap;
        }
        .filter-btn:hover { color: #888; border-color: rgba(255,255,255,0.2); }
        .filter-btn.active { color: #00ffcc; border-color: rgba(0,255,204,0.4); background: rgba(0,255,204,0.07); }

        /* ── Search ── */
        .search-wrap { flex: 1; min-width: 160px; max-width: 280px; margin-left: auto; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
            color: #ccc; font-size: 11px; padding: 4px 9px; outline: none; font-family: inherit;
        }
        .search-input:focus { border-color: rgba(0,255,204,0.35); }
        .search-input::placeholder { color: #3a3a3a; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; }
        th {
            font-size: 10px; font-weight: 600; color: #444; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 7px 12px 6px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap;
        }
        th.r { text-align: right; }
        td {
            padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: middle; font-size: 12px;
        }
        tr:last-child td { border-bottom: none; }
        .hidden-row { display: none; }

        /* ── Severity ── */
        .sev-cell { width: 28px; padding: 6px 4px 6px 14px !important; }
        .sev-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            flex-shrink: 0; vertical-align: middle;
        }
        .sev-dot.critical { background: #ff5a5a; box-shadow: 0 0 5px rgba(255,90,90,0.6); }
        .sev-dot.warning  { background: #f5a623; }
        .sev-dot.notice   { background: #4a7a9b; }
        tbody tr.sev-critical.clickable-row { background: rgba(255,90,90,0.025); }
        tbody tr.sev-warning.clickable-row  { background: rgba(245,166,35,0.015); }

        /* ── Category badge ── */
        .cat-badge {
            display: inline-block; font-size: 9px; font-weight: 700;
            padding: 1px 6px; border-radius: 2px; letter-spacing: 0.4px;
            text-transform: uppercase; white-space: nowrap;
        }
        .cat-emergency     { color: #ff5a5a; border: 1px solid rgba(255,90,90,0.35);   background: rgba(255,90,90,0.07); }
        .cat-military      { color: #e8a030; border: 1px solid rgba(232,160,48,0.35);  background: rgba(232,160,48,0.07); }
        .cat-helicopter    { color: #7eb8f7; border: 1px solid rgba(126,184,247,0.35); background: rgba(126,184,247,0.07); }
        .cat-ground        { color: #666;    border: 1px solid rgba(255,255,255,0.1);  background: rgba(255,255,255,0.03); }
        .cat-data-quality  { color: #f5a623; border: 1px solid rgba(245,166,35,0.3);  background: rgba(245,166,35,0.05); }
        .cat-source-health { color: #b07ef7; border: 1px solid rgba(176,126,247,0.3); background: rgba(176,126,247,0.05); }

        /* ── Aircraft cell ── */
        td.ac-cell { white-space: nowrap; }
        .ac-call { color: #ddd; font-weight: 700; font-family: 'Consolas','Menlo',monospace; }
        .ac-call.dim { color: #444; font-style: italic; font-weight: 400; }
        .ac-reg { color: #666; font-size: 10px; font-family: 'Consolas','Menlo',monospace; margin-top: 1px; }
        .ac-hex { color: #3a3a3a; font-size: 10px; font-family: 'Consolas','Menlo',monospace; }
        .ac-system { color: #555; font-style: italic; }

        /* ── Alert text ── */
        td.alert-title { color: #aaa; font-size: 12px; white-space: nowrap; font-weight: 600; }
        td.alert-title.critical { color: #ff8080; }
        td.alert-title.warning  { color: #f5a623; }
        td.alert-detail { color: #555; font-size: 11px; max-width: 360px; }
        td.alert-age { color: #3a3a3a; font-size: 11px; white-space: nowrap; text-align: right; }

        /* ── Clickable rows ── */
        .clickable-row { cursor: pointer; }
        .clickable-row:hover td { background: rgba(255,255,255,0.04) !important; }
        .detail-row td {
            padding: 0 !important;
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        }
        .detail-row.hidden { display: none; }
        .detail-panel {
            padding: 12px 16px;
            background: rgba(0,255,204,0.02);
            font-size: 12px; color: #888; line-height: 1.6;
        }
        .detail-panel.critical { background: rgba(255,90,90,0.03); }
        .detail-panel.warning  { background: rgba(245,166,35,0.02); }
        .detail-reason {
            font-size: 11px; color: #888; margin-bottom: 10px;
            padding: 6px 10px; border-left: 2px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.02); border-radius: 0 3px 3px 0;
        }
        .detail-reason.critical { border-left-color: rgba(255,90,90,0.5); color: #ff8080; }
        .detail-reason.warning  { border-left-color: rgba(245,166,35,0.5); color: #f5a623; }
        .detail-reason.notice   { border-left-color: rgba(74,122,155,0.5); }
        .detail-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 8px; }
        .dp-field { display: flex; flex-direction: column; gap: 1px; }
        .dp-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #444; }
        .dp-value { color: #bbb; font-size: 12px; }
        .dp-value.accent { color: #00ffcc; font-weight: 600; }
        .dp-value.mono { font-family: 'Consolas','Menlo',monospace; }
        .dp-value.crit { color: #ff8080; font-weight: 600; }
        .dp-value.warn { color: #f5a623; }
        .dp-sep { width: 100%; height: 1px; background: rgba(255,255,255,0.04); margin: 7px 0; }
        .dp-actions { display: flex; gap: 8px; margin-top: 8px; }
        .dp-action {
            font-size: 10px; font-weight: 600; color: #444;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 3px;
            padding: 3px 10px; text-decoration: none; letter-spacing: 0.3px;
            text-transform: uppercase; cursor: pointer; font-family: inherit; background: transparent;
        }
        .dp-action:hover { color: #888; border-color: rgba(255,255,255,0.2); }
        .dp-action.primary { color: #00ffcc; border-color: rgba(0,255,204,0.3); background: rgba(0,255,204,0.04); }
        .dp-action.primary:hover { background: rgba(0,255,204,0.09); }

        /* ── Empty state ── */
        .empty-state {
            text-align: center; padding: 60px 24px 70px;
            color: #444; font-size: 13px;
        }
        .empty-state .icon {
            font-size: 32px; margin-bottom: 14px; opacity: 0.4;
            color: #00ffcc; line-height: 1;
        }
        .empty-state .msg { font-size: 15px; color: #555; margin-bottom: 6px; }
        .empty-state .sub { font-size: 12px; color: #333; }

        /* ── Status / error ── */
        .status-msg { text-align: center; padding: 40px 24px; color: #444; font-size: 13px; }
        .status-msg.error { color: #f97; }

        /* ── Footer ── */
        .footer { margin-top: 28px; text-align: center; font-size: 11px; color: #383838; }
    </style>
</head>
<body>

<div class="page-content">
    <header class="page-header">
        <h1>Alerts</h1>
        <div class="header-right">
            <span id="last-update">Loading…</span>
            <button class="refresh-btn" onclick="doRefresh()">Refresh</button>
        </div>
    </header>

    <div class="main">

        <div class="cards-row" id="cards-row">
            <div class="card dim"><div class="value">—</div><div class="label">Active Alerts</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Emergency</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Military</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Helicopter</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Ground</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Data Issues</div></div>
            <div class="card dim"><div class="value">—</div><div class="label">Source Health</div></div>
        </div>

        <div class="section">
            <div class="section-head">
                <h2>Alert Feed</h2>
                <div class="filter-tabs" id="cat-filter-tabs">
                    <button class="filter-btn active" data-f="all"           onclick="setCatFilter('all')">All</button>
                    <button class="filter-btn"        data-f="emergency"     onclick="setCatFilter('emergency')">Emergency</button>
                    <button class="filter-btn"        data-f="military"      onclick="setCatFilter('military')">Military</button>
                    <button class="filter-btn"        data-f="helicopter"    onclick="setCatFilter('helicopter')">Helicopter</button>
                    <button class="filter-btn"        data-f="ground"        onclick="setCatFilter('ground')">Ground</button>
                    <button class="filter-btn"        data-f="data-quality"  onclick="setCatFilter('data-quality')">Data Quality</button>
                    <button class="filter-btn"        data-f="source-health" onclick="setCatFilter('source-health')">Source Health</button>
                </div>
                <div class="search-wrap">
                    <input class="search-input" id="alert-search" type="text"
                           placeholder="callsign, ICAO, alert text…" oninput="applyFilters()">
                </div>
                <span class="count-badge" id="alert-count"></span>
            </div>
            <div id="alerts-content">
                <div class="status-msg">Loading…</div>
            </div>
        </div>

        <div class="footer">Auto-refreshes every 30 seconds</div>
    </div>
</div>

<script>
/* ── Constants ── */
const VALID_CODE_RE = /^[A-Z]{3,4}$/;
const EMRG_SQUAWKS  = { '7500': 'Unlawful interference / Hijack', '7600': 'Radio communication failure', '7700': 'General emergency declared' };
const STALE_SECS    = 180;   // 3 min — flag as potentially stale
const HB_STALE_SECS = 90;    // ADSB.lol heartbeat stale threshold

/* ── State ── */
let allAlerts   = [];
let catFilter   = 'all';

/* ── Helpers ── */
function n(v) { const f = parseFloat(v); return isNaN(f) ? null : f; }

function isValidCode(code) {
    if (!code) return false;
    return VALID_CODE_RE.test(code.trim().toUpperCase());
}

function isGroundPlane(p) {
    return ((p.source || '') + (p.positionSource || '')).toLowerCase().includes('ground');
}

function hasRoute(p) {
    return isValidCode((p.dep || '').trim()) || isValidCode((p.arr || '').trim());
}

function noFlightId(p) {
    const cs = (p.callsign || '').toUpperCase();
    const hx = (p.icaoHex  || '').toUpperCase();
    return cs && cs === hx;
}

function noIdentity(p) {
    return noFlightId(p) && !(p.registration || '').trim();
}

function displayCall(p) {
    const icao = (p.icaoHex || '').toUpperCase();
    if (p.callsign && p.callsign.toUpperCase() !== icao) return p.callsign;
    return p.flightId || p.icaoHex || '—';
}

function routeText(p) {
    const d = (p.dep || '').trim().toUpperCase();
    const a = (p.arr || '').trim().toUpperCase();
    const dOk = isValidCode(d), aOk = isValidCode(a);
    if (dOk && aOk) return `${d} → ${a}`;
    if (dOk) return `${d} → ?`;
    if (aOk) return `? → ${a}`;
    return '';
}

function fmtAlt(a) {
    const v = n(a);
    if (v === null || v === 0) return 'GND';
    return Math.round(v).toLocaleString() + ' ft';
}

function fmtSpeed(s) {
    const v = n(s) || 0;
    if (v === 0) return '—';
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' kt';
}

function fmtAge(ts) {
    const v = n(ts);
    if (!v || v < 1e9) return '—';
    const secs = Math.floor(Date.now() / 1000 - v);
    if (secs < 0)    return 'just now';
    if (secs < 60)   return secs + 's ago';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    return Math.floor(secs / 3600) + 'h ago';
}

const SOURCE_LABELS = {
    'adsblol-ground-sweep': 'Ground Sweep',
    'adsblol-ground':       'ADSB.lol Ground',
    'adsb-lol-reapi':       'ADSB.lol',
    'adsblol':              'ADSB.lol',
    'faa-sfdps':            'FAA/SFDPS',
    'faa-stdds-tfms':       'FAA/TFMS',
    'faa-stdds-tfm':        'FAA/TFM',
    'faa-stdds':            'FAA/STDDS',
    'faa-swim':             'FAA/SWIM',
    'faa':                  'FAA',
    'opensky':              'OpenSky',
    'unknown':              'Unknown',
};

function friendlySource(raw) {
    if (!raw) return '—';
    const lower = raw.toLowerCase();
    for (const [k, v] of Object.entries(SOURCE_LABELS)) {
        if (lower === k) return v;
    }
    for (const [k, v] of Object.entries(SOURCE_LABELS)) {
        if (lower.startsWith(k)) return v;
    }
    return raw;
}

/* ── Alert builders ── */
let _idx = 0;

function makeAircraftAlert(severity, category, plane, title, detail) {
    const icao  = (plane.icaoHex || '').toUpperCase();
    const call  = displayCall(plane);
    const route = routeText(plane);
    const src   = friendlySource(plane.source || plane.positionSource || '');
    const srch  = [call, plane.registration || '', icao, plane.dep || '', plane.arr || '',
                   plane.source || '', title, detail, category].join(' ').toLowerCase();
    return { id: `alert-${_idx++}`, severity, category, plane, icao, call, title, detail, route, source: src, srch };
}

function makeSystemAlert(severity, category, title, detail) {
    const srch = [title, detail, category, 'system'].join(' ').toLowerCase();
    return { id: `alert-${_idx++}`, severity, category, plane: null, icao: '', call: '', title, detail, route: '', source: 'System', srch };
}

/* ── Alert detection ── */
function buildAlerts(planes, health) {
    _idx = 0;
    const alerts = [];

    for (const p of planes) {
        const squawk = String(p.squawk || '').trim();
        const emrg   = String(p.emergency || '').toLowerCase().trim();

        /* Emergency squawks — Critical */
        if (EMRG_SQUAWKS[squawk]) {
            alerts.push(makeAircraftAlert('critical', 'emergency', p,
                `Squawk ${squawk}`, EMRG_SQUAWKS[squawk]));
        }

        /* Non-squawk emergency field — Critical */
        if (emrg && emrg !== '0' && emrg !== 'none' && emrg !== '' && !EMRG_SQUAWKS[squawk]) {
            alerts.push(makeAircraftAlert('critical', 'emergency', p,
                'Emergency', `Emergency status: ${p.emergency}`));
        }

        /* Military — Notice */
        if (p.isMilitary || p.aircraftClass === 'military') {
            alerts.push(makeAircraftAlert('notice', 'military', p,
                'Military Aircraft', 'Flagged as military by aircraft database'));
        }

        /* Helicopter — Notice */
        if (p.isHelicopter || p.aircraftClass === 'helicopter') {
            alerts.push(makeAircraftAlert('notice', 'helicopter', p,
                'Helicopter', 'Rotary-wing aircraft detected'));
        }

        /* Ground sweep — Notice */
        if (isGroundPlane(p)) {
            alerts.push(makeAircraftAlert('notice', 'ground', p,
                'Ground Aircraft', 'Detected via ADSB.lol airport surface sweep'));
        }

        /* Missing identity — Notice */
        if (noIdentity(p)) {
            alerts.push(makeAircraftAlert('notice', 'data-quality', p,
                'No Identity', 'No callsign or registration — aircraft identity unknown'));
        }

        /* Commercial with no route — Warning */
        if (p.aircraftClass === 'commercial' && !isGroundPlane(p) && !hasRoute(p)) {
            alerts.push(makeAircraftAlert('warning', 'data-quality', p,
                'Missing Route', 'Commercial flight has no departure or arrival data'));
        }

        /* Unknown source — Warning */
        const rawSrc = (p.source || p.positionSource || '').toLowerCase().trim();
        if (!rawSrc || rawSrc === 'unknown') {
            alerts.push(makeAircraftAlert('warning', 'data-quality', p,
                'Unknown Source', 'Data source is unidentified — provenance unknown'));
        }

        /* Stale position data — Warning (inferred) */
        const lu = n(p.lastUpdate);
        if (lu && lu > 1e9) {
            const age = Date.now() / 1000 - lu;
            if (age > STALE_SECS) {
                alerts.push(makeAircraftAlert('warning', 'data-quality', p,
                    'Stale Position', `Position last updated ${fmtAge(lu)} — may be outdated (inferred)`));
            }
        }
    }

    /* Source health alerts */
    if (health) {
        const d = (health.response && health.response.data) ? health.response.data : health;
        const redisOk = d.redis && d.redis.connected;

        if (!redisOk) {
            alerts.push(makeSystemAlert('critical', 'source-health',
                'Redis Disconnected', 'Redis database is not responding — all live data unavailable'));
        }

        if (redisOk) {
            const sources = d.sources || {};
            let faaCount = 0;
            for (const [k, v] of Object.entries(sources)) {
                if (k.toLowerCase().startsWith('faa') || k.toLowerCase().startsWith('swim')) faaCount += v;
            }
            if (faaCount === 0) {
                alerts.push(makeSystemAlert('warning', 'source-health',
                    'No FAA/SWIM Data', 'Zero FAA/SWIM aircraft records in Redis — ingestor may be offline'));
            }

            const adsbCount = (d.adsbLol || {}).count || 0;
            if (adsbCount === 0) {
                alerts.push(makeSystemAlert('warning', 'source-health',
                    'No ADSB.lol Data', 'Zero ADSB.lol aircraft records in Redis — ingestor may be offline'));
            }

            const hb = (d.adsbLol || {}).heartbeat || {};
            if (hb.last_success) {
                const hbAge = Date.now() / 1000 - parseFloat(hb.last_success);
                if (hbAge > HB_STALE_SECS && hbAge < 86400) {
                    alerts.push(makeSystemAlert('warning', 'source-health',
                        'ADSB.lol Stale', `ADSB.lol ingestor last succeeded ${fmtAge(parseFloat(hb.last_success))} — feed may be stale`));
                }
            } else {
                alerts.push(makeSystemAlert('warning', 'source-health',
                    'ADSB.lol Heartbeat Missing', 'No ADSB.lol heartbeat data — ingestor may not have started yet'));
            }
        }
    }

    /* Sort: critical → warning → notice; within each severity newest aircraft first */
    const sevOrder = { critical: 0, warning: 1, notice: 2 };
    alerts.sort((a, b) => {
        const sd = sevOrder[a.severity] - sevOrder[b.severity];
        if (sd !== 0) return sd;
        const aTs = a.plane ? (n(a.plane.lastUpdate) || 0) : 0;
        const bTs = b.plane ? (n(b.plane.lastUpdate) || 0) : 0;
        return bTs - aTs;
    });

    return alerts;
}

/* ── Cards ── */
function renderCards(alerts) {
    const total   = alerts.length;
    const emrg    = alerts.filter(a => a.category === 'emergency').length;
    const mil     = alerts.filter(a => a.category === 'military').length;
    const heli    = alerts.filter(a => a.category === 'helicopter').length;
    const ground  = alerts.filter(a => a.category === 'ground').length;
    const dq      = alerts.filter(a => a.category === 'data-quality').length;
    const sh      = alerts.filter(a => a.category === 'source-health').length;
    const hasCrit = alerts.some(a => a.severity === 'critical');
    const hasWarn = !hasCrit && alerts.some(a => a.severity === 'warning');

    document.getElementById('cards-row').innerHTML = `
        <div class="card ${hasCrit ? 'crit' : hasWarn ? 'warn' : total > 0 ? '' : 'dim'}">
            <div class="value">${total.toLocaleString()}</div>
            <div class="label">Active Alerts</div>
        </div>
        <div class="card ${emrg > 0 ? 'crit' : 'dim'}">
            <div class="value">${emrg.toLocaleString()}</div>
            <div class="label">Emergency</div>
        </div>
        <div class="card ${mil > 0 ? '' : 'dim'}">
            <div class="value">${mil.toLocaleString()}</div>
            <div class="label">Military</div>
        </div>
        <div class="card ${heli > 0 ? '' : 'dim'}">
            <div class="value">${heli.toLocaleString()}</div>
            <div class="label">Helicopter</div>
        </div>
        <div class="card ${ground > 0 ? '' : 'dim'}">
            <div class="value">${ground.toLocaleString()}</div>
            <div class="label">Ground</div>
        </div>
        <div class="card ${dq > 0 ? 'warn' : 'dim'}">
            <div class="value">${dq.toLocaleString()}</div>
            <div class="label">Data Issues</div>
        </div>
        <div class="card ${sh > 0 ? 'warn' : 'dim'}">
            <div class="value">${sh.toLocaleString()}</div>
            <div class="label">Source Health</div>
        </div>
    `;
}

/* ── Category badge HTML ── */
function catBadge(cat) {
    const labels = {
        'emergency':     'Emergency',
        'military':      'Military',
        'helicopter':    'Helicopter',
        'ground':        'Ground',
        'data-quality':  'Data',
        'source-health': 'Source',
    };
    return `<span class="cat-badge cat-${cat}">${labels[cat] || cat}</span>`;
}

/* ── Detail panel ── */
function buildDetailPanel(alert) {
    const p = alert.plane;
    const sev = alert.severity;

    function field(label, val, cls = '') {
        if (val === null || val === undefined || val === '') return '';
        return `<div class="dp-field"><div class="dp-label">${label}</div><div class="dp-value ${cls}">${val}</div></div>`;
    }

    let body = `<div class="detail-reason ${sev}">${alert.title}: ${alert.detail}</div>`;

    if (p) {
        const icao = (p.icaoHex || '').toUpperCase();
        const call = displayCall(p);
        const isNoId = noFlightId(p);
        const route = routeText(p);
        const lu = fmtAge(p.lastUpdate);
        const emrg = String(p.emergency || '').toLowerCase().trim();
        const squawk = String(p.squawk || '').trim();
        const src  = friendlySource(p.source || p.positionSource || '');

        body += `<div class="detail-grid">
            ${field('Callsign / ID', call, isNoId ? 'mono' : 'mono accent')}
            ${p.registration ? field('Registration', p.registration, 'mono') : ''}
            ${icao ? field('ICAO Hex', icao, 'mono') : ''}
            ${p.aircraftType ? field('Type', p.aircraftType) : ''}
            ${field('Class', p.aircraftClass || 'unknown')}
            ${p.operator ? field('Operator', p.operator) : ''}
        </div>`;

        if (route || p.dep || p.arr) {
            body += `<div class="dp-sep"></div><div class="detail-grid">
                ${route ? field('Route', route) : ''}
                ${p.dep && isValidCode(p.dep.trim().toUpperCase()) ? field('Dep', p.dep.trim().toUpperCase(), 'mono') : ''}
                ${p.arr && isValidCode(p.arr.trim().toUpperCase()) ? field('Arr', p.arr.trim().toUpperCase(), 'mono') : ''}
            </div>`;
        }

        body += `<div class="dp-sep"></div><div class="detail-grid">
            ${field('Altitude', fmtAlt(p.alt))}
            ${field('Speed',    fmtSpeed(p.speed))}
            ${field('Heading',  n(p.heading) != null ? n(p.heading).toFixed(0) + '°' : '')}
            ${field('State',    (n(p.airborne) === 1 || (n(p.speed)||0) > 40) ? 'Airborne'
                                : isGroundPlane(p) ? 'Ground' : (n(p.speed)||0) > 3 ? 'Rolling' : 'Stopped')}
        </div>`;

        body += `<div class="dp-sep"></div><div class="detail-grid">
            ${field('Source', src)}
            ${p.enrichmentSource ? field('Enrichment', friendlySource(p.enrichmentSource)) : ''}
            ${p.sourceFacility ? field('Facility', p.sourceFacility, 'mono') : ''}
            ${squawk && squawk !== '0' ? field('Squawk', squawk, sev === 'critical' ? 'mono crit' : 'mono warn') : ''}
            ${emrg && emrg !== '0' && emrg !== 'none' ? field('Emergency', p.emergency, 'crit') : ''}
            ${field('Last Update', lu)}
        </div>`;

        if (icao) {
            body += `<div class="dp-actions">
                <a class="dp-action primary" href="/?icao=${icao}">Open on Radar</a>
                <a class="dp-action" href="/aircraft" title="Browse all aircraft">All Aircraft</a>
            </div>`;
        }
    } else {
        /* System / health alert */
        body += `<div class="detail-grid">
            <div class="dp-field"><div class="dp-label">Alert Type</div><div class="dp-value">System / Infrastructure</div></div>
            <div class="dp-field"><div class="dp-label">Category</div><div class="dp-value">${alert.category}</div></div>
        </div>
        <div class="dp-actions">
            <a class="dp-action primary" href="/health">View Health Dashboard</a>
        </div>`;
    }

    return `<div class="detail-panel ${sev}">${body}</div>`;
}

/* ── Table rendering ── */
function renderTable(alerts) {
    if (!alerts.length) {
        document.getElementById('alerts-content').innerHTML = `
            <div class="empty-state">
                <div class="icon">✓</div>
                <div class="msg">No active alerts detected.</div>
                <div class="sub">The system is monitoring continuously. Alerts appear here when conditions are met.</div>
            </div>`;
        document.getElementById('alert-count').textContent = '0 alerts';
        return;
    }

    let rows = '';
    for (const alert of alerts) {
        const p = alert.plane;
        const isNoId = p ? noFlightId(p) : false;
        const callHtml = alert.plane
            ? `<div class="ac-call ${isNoId ? 'dim' : ''}">${alert.call || '—'}</div>
               ${p.registration ? `<div class="ac-reg">${p.registration}</div>` : ''}
               ${alert.icao ? `<div class="ac-hex">${alert.icao}</div>` : ''}`
            : `<div class="ac-system">System</div>`;

        const contextHtml = alert.route
            ? `<span style="color:#555;font-family:monospace;font-size:11px">${alert.route}</span>`
            : `<span style="color:#2a2a2a;font-size:11px">—</span>`;

        const titleCls = alert.severity === 'critical' ? 'critical' : alert.severity === 'warning' ? 'warning' : '';

        rows += `<tr class="clickable-row sev-${alert.severity}"
            data-cat="${alert.category}"
            data-srch="${alert.srch}"
            onclick="toggleDetail('${alert.id}')">
            <td class="sev-cell"><span class="sev-dot ${alert.severity}"></span></td>
            <td class="ac-cell">${callHtml}</td>
            <td>${catBadge(alert.category)}</td>
            <td class="alert-title ${titleCls}">${alert.title}</td>
            <td class="alert-detail">${alert.detail}</td>
            <td style="color:#3a3a3a;font-size:11px;white-space:nowrap">${alert.source}</td>
            <td class="alert-age">${p ? fmtAge(p.lastUpdate) : '—'}</td>
        </tr><tr class="detail-row hidden" id="${alert.id}">
            <td colspan="7">${buildDetailPanel(alert)}</td>
        </tr>`;
    }

    document.getElementById('alerts-content').innerHTML = `
        <div style="overflow-x:auto">
        <table id="alerts-table">
            <thead><tr>
                <th style="width:28px"></th>
                <th>Aircraft</th>
                <th>Category</th>
                <th>Alert</th>
                <th>Detail</th>
                <th>Source</th>
                <th class="r">Age</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
        </div>`;

    document.getElementById('alert-count').textContent = `${alerts.length} alert${alerts.length === 1 ? '' : 's'}`;
    applyFilters();
}

/* ── Filtering ── */
function setCatFilter(cat) {
    catFilter = cat;
    document.querySelectorAll('#cat-filter-tabs .filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.f === cat);
    });
    applyFilters();
}

function applyFilters() {
    const q   = (document.getElementById('alert-search').value || '').toLowerCase().trim();
    const tbl = document.getElementById('alerts-table');
    if (!tbl) return;

    let vis = 0, total = 0;
    for (const row of tbl.querySelectorAll('tbody tr.clickable-row')) {
        total++;
        const cat  = row.dataset.cat  || '';
        const srch = row.dataset.srch || '';

        const catMatch = catFilter === 'all' || cat === catFilter;
        const qMatch   = !q || srch.includes(q);
        const show     = catMatch && qMatch;

        row.classList.toggle('hidden-row', !show);
        const detail = row.nextElementSibling;
        if (detail && detail.classList.contains('detail-row')) {
            detail.classList.toggle('hidden-row', !show);
            if (!show) detail.classList.add('hidden');
        }
        if (show) vis++;
    }

    document.getElementById('alert-count').textContent =
        (q || catFilter !== 'all')
            ? `${vis} of ${total} alert${total === 1 ? '' : 's'}`
            : `${total} alert${total === 1 ? '' : 's'}`;
}

function toggleDetail(id) {
    const row = document.getElementById(id);
    if (row) row.classList.toggle('hidden');
}

/* ── Fetch & render ── */
async function doRefresh() {
    document.getElementById('last-update').textContent = 'Refreshing…';
    const t0 = Date.now();
    try {
        const [planesRes, healthRes] = await Promise.all([
            fetch('/api/?action=Planes&view=alerts&_=' + Date.now()),
            fetch('/api/?action=Health'),
        ]);
        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

        const planesJson = planesRes.ok ? await planesRes.json() : null;
        const healthJson = healthRes.ok ? await healthRes.json() : null;

        const planes = planesJson?.response?.data?.planes || [];
        const total  = planesJson?.response?.data?.total  || 0;
        const health = healthJson?.response?.data || healthJson;

        allAlerts = buildAlerts(planes, health);
        renderCards(allAlerts);
        renderTable(allAlerts);

        document.getElementById('last-update').textContent =
            'Updated ' + new Date().toLocaleTimeString() +
            ' · ' + elapsed + 's · ' + total.toLocaleString() + ' aircraft';
    } catch (e) {
        document.getElementById('last-update').textContent = 'Error: ' + e.message;
        document.getElementById('alerts-content').innerHTML =
            '<div class="status-msg error">Unable to reach API</div>';
    }
}

let timer;
function scheduleRefresh() {
    clearTimeout(timer);
    timer = setTimeout(() => { doRefresh().then(scheduleRefresh); }, 30000);
}

doRefresh().then(scheduleRefresh);
</script>
